<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>排名 — WHONEXT UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
  :root{
    --n-accent:#9FB3C8; --n-glow:rgba(159,179,200,0.5);
    --e-accent:#C9B79B; --e-glow:rgba(201,183,155,0.5);
    --x-accent:#B9B9BD; --x-glow:rgba(185,185,189,0.5);
    --t-accent:#E9E9E4; --t-glow:rgba(233,233,228,0.5);
    --good:#7FD79A;
    --warn:#E7A15A;
    --gold:#E4C97A;   --gold-bg:rgba(228,201,122,0.14);
    --silver:#C9CDD3; --silver-bg:rgba(201,205,211,0.12);
    --bronze:#C98A55; --bronze-bg:rgba(201,138,85,0.14);

    --bg:#000000;
    --card:rgba(255,255,255,0.07);
    --card-strong:rgba(255,255,255,0.13);
    --line:rgba(255,255,255,0.14);
    --label:#F5F5F7;
    --secondary:rgba(235,235,245,0.62);
    --tertiary:rgba(235,235,245,0.32);

    --sf: -apple-system, BlinkMacSystemFont, "PingFang TC", "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    --sf-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(228,201,122,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(159,179,200,0.07), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  .navbar{
    position:sticky; top:0; z-index:30;
    padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner{
    max-width: 640px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
    padding: 10px 16px 12px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .nav-title .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary); text-transform:uppercase; }
  .nav-title h1{ margin:1px 0 0; font-size:20px; font-weight:800; letter-spacing:-.01em; }

  .wrap{ max-width: 640px; margin:0 auto; padding: 20px 16px 8px; }

  .hero{ padding: 4px 4px 10px; }
  .hero .hero-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary);
    text-transform:uppercase; margin-bottom:8px;
  }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(26px,7vw,34px); margin-bottom:8px;
  }
  .hero p{ margin:0; font-size: clamp(13px,3.2vw,14.5px); color:var(--secondary); line-height:1.6; max-width:440px; }

  .controls-row{ display:flex; align-items:center; gap:10px; margin: 0 0 18px; }

  .period-toggle{
    display:flex; background: var(--card); border:1px solid var(--line);
    border-radius:999px; padding:2px; flex-shrink:0;
  }
  .period-btn{
    font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px; color:var(--tertiary);
  }
  .period-btn.active{ background: var(--card-strong); color: var(--label); }

  .board-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin: 0 4px 16px;
  }
  .board-nav-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--gold);
  }
  .board-nav-btn:active{ background: var(--card-strong); }

  .board-title{ text-align:center; }
  .board-title .t{ display:block; font-size:16px; font-weight:800; }
  .board-title .n{ display:block; margin-top:2px; font-size:10.5px; color:var(--tertiary); }

  .podium{
    display:flex; align-items:stretch; gap:10px;
    margin-bottom:16px; padding: 0 2px;
  }
  .podium-slot{
    flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    text-align:center; padding: 16px 8px 14px;
    border:1px solid var(--line); border-radius:18px;
    background: rgba(255,255,255,0.04);
    position:relative;
  }
  .podium-slot.p1{ padding-top:26px; border-color: rgba(228,201,122,0.4); background: var(--gold-bg); order:2; }
  .podium-slot.p2{ order:1; }
  .podium-slot.p3{ order:3; }
  .podium-rank{
    font-family: var(--sf-mono); font-weight:700; font-size:11px; line-height:1; color:var(--tertiary);
    margin-bottom:8px;
  }
  .podium-slot.p1 .podium-rank{ color: var(--gold); font-size:12px; }
  .podium-slot.p2 .podium-rank{ color: var(--silver); }
  .podium-slot.p3 .podium-rank{ color: var(--bronze); }
  .podium-avatar{
    width:44px; height:44px; border-radius:50%; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; line-height:1;
    background: var(--card-strong); border:1.5px solid var(--line);
  }
  .podium-slot.p1 .podium-avatar{ width:56px; height:56px; font-size:18px; border-color: var(--gold); color: var(--gold); }
  .podium-slot.p2 .podium-avatar{ width:46px; height:46px; font-size:15.5px; border-color: var(--silver); color: var(--silver); }
  .podium-slot.p3 .podium-avatar{ width:38px; height:38px; font-size:13px; border-color: var(--bronze); color: var(--bronze); }
  .podium-name{ font-size:12.5px; font-weight:700; line-height:1.3; margin-bottom:2px; }
  .podium-value{ font-size:11px; line-height:1.3; color:var(--secondary); font-family: var(--sf-mono); }

  .board-list{ padding: 6px 6px; margin-bottom: 22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding: 11px 6px;
    border-top: 1px solid var(--line);
  }
  .row:first-child{ border-top:none; }
  .row-rank{
    width:22px; flex-shrink:0; text-align:center;
    font-family: var(--sf-mono); font-weight:700; font-size:12.5px; line-height:1; color:var(--tertiary);
  }
  .row-avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; line-height:1;
    background: rgba(255,255,255,0.05); border:1px solid var(--line);
  }
  .row-name{ flex:1; font-size:13.5px; font-weight:600; line-height:1.3; min-width:0; }
  .row-value{ font-size:12.5px; line-height:1.3; color:var(--secondary); font-family: var(--sf-mono); flex-shrink:0; }

  .wordmark-footer{
    text-align:center; margin: 24px 0 6px;
    font-family:'Archivo Black', var(--sf); font-size:12px; letter-spacing:.16em; color: var(--tertiary);
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="nav-inner">
      <a class="back-btn" href="index.html" aria-label="返回首頁">‹</a>
      <div class="nav-title">
        <div class="eyebrow">WHONEXT</div>
        <h1>UNIVERSE</h1>
      </div>
      <div class="nav-role">
        <div class="role-toggle">
          <button class="active" data-role="player">球員</button>
          <button data-role="admin">管理員</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">WHONEXT BADMINTON CLUB</div>
      <div class="wordmark">排行榜</div>
    </div>

    <div class="controls-row">
      <div class="period-toggle" id="periodToggle">
        <button class="period-btn active" data-p="year" onclick="setPeriod('year')">年</button>
        <button class="period-btn" data-p="month" onclick="setPeriod('month')">月</button>
      </div>
    </div>

    <div class="board-nav">
      <button class="board-nav-btn" onclick="stepBoard(-1)" aria-label="上一個排行榜">‹</button>
      <div class="board-title">
        <span class="t" id="boardTitleText"></span>
        <span class="n" id="boardUnitText"></span>
      </div>
      <button class="board-nav-btn" onclick="stepBoard(1)" aria-label="下一個排行榜">›</button>
    </div>
    <div class="podium" id="podium"></div>
    <div class="board-list glass" id="boardList"></div>

    <div class="wordmark-footer">WHONEXT</div>

  </div>

<script src="backend.js"></script>
<script src="auth.js"></script>
<script>
  const PERIOD_LABEL = { year: '年度', month: '當月' };

  const BOARDS = {
    friend: {
      title: '最常WHO朋引伴', unit: '單位：人次', valueSuffix: '',
      month: [],
      year: []
    },
    attend: {
      title: '最常出勤', unit: '單位：場次', valueSuffix: '',
      month: [],
      year: []
    },
    dropin: {
      title: '最常臨打', unit: '單位：場次', valueSuffix: '',
      month: [],
      year: []
    }
  };

  const BOARD_KEYS = ['friend', 'attend', 'dropin'];

  let currentKey = 'friend';
  let currentPeriod = 'year';

  function renderBoard(){
    const data = BOARDS[currentKey];
    const list = data[currentPeriod];
    const top3 = list.slice(0, 3);
    const rest = list.slice(3);

    document.getElementById('boardTitleText').textContent = PERIOD_LABEL[currentPeriod] + ' ' + data.title;
    document.getElementById('boardUnitText').textContent = data.unit;

    const podiumOrder = [top3[1], top3[0], top3[2]];
    const slots = ['p2', 'p1', 'p3'];
    const ranks = ['NO.2', 'NO.1', 'NO.3'];
    document.getElementById('podium').innerHTML = podiumOrder.map(function(p, i){
      if(!p) return '';
      return '<div class="podium-slot ' + slots[i] + '">' +
        '<div class="podium-rank">' + ranks[i] + '</div>' +
        '<div class="podium-avatar">' + p.name.slice(0,1) + '</div>' +
        '<div class="podium-name">' + p.name + '</div>' +
        '<div class="podium-value">' + p.value + data.valueSuffix + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('boardList').innerHTML = rest.map(function(p, i){
      return '<div class="row">' +
        '<div class="row-rank">' + (i + 4) + '</div>' +
        '<div class="row-avatar">' + p.name.slice(0,1) + '</div>' +
        '<div class="row-name">' + p.name + '</div>' +
        '<div class="row-value">' + p.value + data.valueSuffix + '</div>' +
      '</div>';
    }).join('');
  }

  function setBoard(key){
    currentKey = key;
    renderBoard();
  }

  function stepBoard(delta){
    const idx = BOARD_KEYS.indexOf(currentKey);
    const nextIdx = (idx + delta + BOARD_KEYS.length) % BOARD_KEYS.length;
    setBoard(BOARD_KEYS[nextIdx]);
  }

  function setPeriod(p){
    currentPeriod = p;
    document.querySelectorAll('#periodToggle .period-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.p === p);
    });
    renderBoard();
  }

  function splitNames(val){
    return String(val || '').split(',').map(s=>s.trim()).filter(Boolean);
  }
  function monthOfWeek(w){ return String(w.week_date || '').slice(0,7); }
  function parseDropinEntry(entry){
    const m = String(entry || '').match(/^(.*?)\(([^()]+)\)$/);
    return m ? { name: m[1].trim(), referrer: m[2].trim() } : { name: String(entry || '').trim(), referrer: '' };
  }
  function tally(names){
    const counts = {};
    names.forEach(n=>{ counts[n] = (counts[n] || 0) + 1; });
    return Object.keys(counts)
      .map(name=>({ name, value: counts[name] }))
      .sort((a,b)=> b.value - a.value || a.name.localeCompare(b.name));
  }
  function isPlaceholderName(name){
    return /^友\d*$/.test(name);
  }
  function computeFriendBoard(weeks){
    const referrers = [];
    weeks.forEach(w=>{
      splitNames(w.dropin_names).forEach(entry=>{
        const referrer = parseDropinEntry(entry).referrer;
        if(referrer && !isPlaceholderName(referrer)) referrers.push(referrer);
      });
    });
    return tally(referrers);
  }
  function computeAttendBoard(weeks){
    const names = [];
    weeks.forEach(w=> splitNames(w.present_names).forEach(n=> names.push(n)));
    return tally(names);
  }
  function computeDropinBoard(weeks){
    const names = [];
    weeks.forEach(w=> splitNames(w.dropin_names).forEach(entry=>{
      const name = parseDropinEntry(entry).name;
      if(!isPlaceholderName(name)) names.push(name);
    }));
    return tally(names);
  }

  function applyBoardData(weeks){
    const monthsSet = [...new Set(weeks.map(monthOfWeek))].sort();
    if(!monthsSet.length) return;
    const latestMonth = monthsSet[monthsSet.length - 1];
    const year = latestMonth.slice(0,4);
    const monthWeeks = weeks.filter(w=> monthOfWeek(w) === latestMonth);
    const yearWeeks = weeks.filter(w=> monthOfWeek(w).slice(0,4) === year);

    BOARDS.friend.month = computeFriendBoard(monthWeeks);
    BOARDS.friend.year = computeFriendBoard(yearWeeks).filter(p=> p.value >= 3);
    BOARDS.attend.month = computeAttendBoard(monthWeeks);
    BOARDS.attend.year = computeAttendBoard(yearWeeks);
    BOARDS.dropin.month = computeDropinBoard(monthWeeks);
    BOARDS.dropin.year = computeDropinBoard(yearWeeks);
    renderBoard();
  }

  async function loadBoards(){
    const params = { action:'getWeeks' };
    const cached = getApiCache(params);
    if(cached) applyBoardData(cached.weeks || []);
    try{
      const result = await apiGet(params);
      setApiCache(params, result);
      applyBoardData(result.weeks || []);
    } catch(e){
      // 讀取失敗就維持現有資料（快取或空清單）
    }
  }

  renderBoard();
  loadBoards();
</script>

</body>
</html>
