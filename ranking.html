<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>排名 — WHONEXT UNIVERSE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WHONEXT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="top-nav.css">
<link rel="stylesheet" href="bottom-nav.css">
<link rel="stylesheet" href="common.css">
<style>
  .hero{ padding: 4px 4px 10px; }

  .trophy-row{ display:flex; flex-direction:column; gap:10px; margin: 0 0 10px; }
  .trophy-card{
    width:100%; box-sizing:border-box;
    padding:26px 20px; text-align:center;
  }
  .trophy-card.n{ border-color: rgba(159,179,200,0.45); background: linear-gradient(180deg, rgba(159,179,200,0.12), rgba(159,179,200,0.03)); box-shadow: 0 8px 20px rgba(159,179,200,0.14); }
  .trophy-card.e{ border-color: rgba(201,183,155,0.45); background: linear-gradient(180deg, rgba(201,183,155,0.12), rgba(201,183,155,0.03)); box-shadow: 0 8px 20px rgba(201,183,155,0.14); }
  .trophy-card.x{ border-color: rgba(185,185,189,0.45); background: linear-gradient(180deg, rgba(185,185,189,0.12), rgba(185,185,189,0.03)); box-shadow: 0 8px 20px rgba(185,185,189,0.14); }
  .trophy-rank{
    font-family: var(--sf-mono); font-weight:700; font-size:12px; line-height:1;
    color: var(--tertiary); margin-bottom:18px;
  }
  .trophy-card.n .trophy-rank{ color: var(--n-accent); }
  .trophy-card.e .trophy-rank{ color: var(--e-accent); }
  .trophy-card.x .trophy-rank{ color: var(--x-accent); }
  .trophy-members{ display:flex; flex-wrap:wrap; justify-content:center; gap:18px 22px; }
  .trophy-member{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .trophy-member-avatar{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; line-height:1;
    background: var(--card-strong); border:1.5px solid var(--line); color:var(--label);
  }
  .trophy-card.n .trophy-member-avatar{ border-color: var(--n-accent); color: var(--n-accent); }
  .trophy-card.e .trophy-member-avatar{ border-color: var(--e-accent); color: var(--e-accent); }
  .trophy-card.x .trophy-member-avatar{ border-color: var(--x-accent); color: var(--x-accent); }
  .trophy-member-name{ font-size:13px; font-weight:700; line-height:1.3; }
  .trophy-empty{ font-size:12.5px; color:var(--tertiary); padding: 20px 4px; }

  .controls-row{ display:flex; align-items:center; gap:10px; margin: 0 0 18px; }

  .board-year-btn{
    display:inline-flex; align-items:center; font-size:12.5px; font-weight:700;
    padding:9px 18px; border-radius:999px;
    background: var(--card-strong); border:1px solid var(--line); color: var(--label);
  }

  .event-toggle{
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
    padding: 2px 2px 4px; margin: 0 0 16px;
  }
  .event-toggle::-webkit-scrollbar{ display:none; }
  .event-btn{
    flex-shrink:0; font-size:12.5px; font-weight:700; padding:9px 16px;
    border-radius:999px; background: var(--card); border:1px solid var(--line); color:var(--tertiary);
  }
  .event-btn.active{ background: var(--card-strong); color: var(--label); border-color: var(--line); }

  .board-unit{ font-size:11px; color:var(--tertiary); margin: -6px 4px 16px; }

  .rank-row{ display:flex; flex-direction:column; gap:10px; margin: 0 0 10px; }
  .rank-page{ display:flex; gap:10px; }
  .rank-card{
    flex:1; min-width:0; box-sizing:border-box;
    padding:20px 8px 18px; text-align:center;
  }
  .rank-card.n{ border-color: rgba(159,179,200,0.45); background: linear-gradient(180deg, rgba(159,179,200,0.12), rgba(159,179,200,0.03)); box-shadow: 0 8px 20px rgba(159,179,200,0.14); }
  .rank-card.e{ border-color: rgba(201,183,155,0.45); background: linear-gradient(180deg, rgba(201,183,155,0.12), rgba(201,183,155,0.03)); box-shadow: 0 8px 20px rgba(201,183,155,0.14); }
  .rank-card.x{ border-color: rgba(185,185,189,0.45); background: linear-gradient(180deg, rgba(185,185,189,0.12), rgba(185,185,189,0.03)); box-shadow: 0 8px 20px rgba(185,185,189,0.14); }
  .rank-no{
    font-family: var(--sf-mono); font-weight:700; font-size:11px; line-height:1;
    color: var(--tertiary); margin-bottom:10px;
  }
  .rank-card.n .rank-no{ color: var(--n-accent); }
  .rank-card.e .rank-no{ color: var(--e-accent); }
  .rank-card.x .rank-no{ color: var(--x-accent); }
  .rank-avatar{
    width:44px; height:44px; border-radius:50%; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; line-height:1;
    background: var(--card-strong); border:1.5px solid var(--line);
  }
  .rank-card.n .rank-avatar{ border-color: var(--n-accent); color: var(--n-accent); }
  .rank-card.e .rank-avatar{ border-color: var(--e-accent); color: var(--e-accent); }
  .rank-card.x .rank-avatar{ border-color: var(--x-accent); color: var(--x-accent); }
  .rank-person-name{ font-size:12.5px; font-weight:700; line-height:1.3; margin-bottom:2px; }
  .rank-value{ font-size:11px; line-height:1.3; color:var(--secondary); font-family: var(--sf-mono); }
  .rank-empty{ font-size:12.5px; color:var(--tertiary); padding: 28px 4px; }
  .more-btn{
    display:block; width:100%; text-align:center; font-size:12.5px; font-weight:700;
    color:var(--secondary); padding: 4px 0 22px;
  }

</style>
</head>
<body>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">WHONEXT BADMINTON CLUB</div>
      <div class="wordmark">排行榜</div>
    </div>

    <div class="section-label-row">
      <div class="section-label">歷屆賽事</div>
    </div>
    <div class="event-toggle" id="eventToggle"></div>
    <div class="trophy-row" id="trophyRow"></div>
    <button type="button" class="more-btn" id="trophyMore">查看更多 ↓</button>

    <div class="section-label-row">
      <div class="section-label">賽季排行</div>
    </div>
    <div class="controls-row">
      <button type="button" class="board-year-btn" id="boardYearBtn"></button>
    </div>

    <div class="board-unit" id="boardUnitText"></div>
    <div class="rank-row" id="rankRow"></div>
    <button type="button" class="more-btn" id="rankMore">查看更多 ↓</button>

  </div>

<script src="backend.js"></script>
<script src="tournaments.js"></script>
<script src="top-nav.js"></script>
<script src="auth.js"></script>
<script src="identity-picker.js"></script>
<script src="bottom-nav.js"></script>
<script>
  // 出勤MVP／臨打MVP 先移除，只留 WHO朋引伴這個榜（renderBoard 目前也
  // 只讀 BOARDS.friend，之後要復原榜單再把 attend/dropin 兩個 board
  // 定義＋ applyBoardData 裡對應的 computeAttendBoard/computeDropinBoard
  // 呼叫一起加回來）。
  const BOARDS = {
    friend: {
      title: 'WHO朋引伴', unit: 'WHO朋引伴累計人次', valueSuffix: '',
      month: [],
      year: []
    }
  };

  const EVENTS = TOURNAMENT_EVENTS;

  const TROPHY_PAGE_SIZE = 1;

  let currentEventIdx = 0;
  let trophyExpanded = false;

  function renderEvent(){
    const ev = EVENTS[currentEventIdx];
    document.getElementById('eventToggle').innerHTML = EVENTS.map(function(e, i){
      return '<button type="button" class="event-btn' + (i === currentEventIdx ? ' active' : '') + '" data-i="' + i + '">' + e.label + '</button>';
    }).join('');
    const row = document.getElementById('trophyRow');
    const moreBtn = document.getElementById('trophyMore');
    if(!ev.results.length){
      row.innerHTML = '<div class="trophy-card glass"><div class="trophy-empty">賽事資料尚未建立</div></div>';
      moreBtn.style.display = 'none';
      return;
    }
    const visibleResults = trophyExpanded ? ev.results : ev.results.slice(0, TROPHY_PAGE_SIZE);
    row.innerHTML = visibleResults.map(function(r){
      const membersHtml = r.members.map(function(name){
        return '<div class="trophy-member"><div class="trophy-member-avatar">' + avatarInitial(name) + '</div><div class="trophy-member-name">' + name + '</div></div>';
      }).join('');
      return '<div class="trophy-card ' + r.cls + ' glass">' +
        '<div class="trophy-rank">NO.' + r.rank + '</div>' +
        '<div class="trophy-members">' + membersHtml + '</div>' +
      '</div>';
    }).join('');
    moreBtn.style.display = ev.results.length > TROPHY_PAGE_SIZE ? '' : 'none';
    moreBtn.textContent = trophyExpanded ? '收合 ↑' : '查看更多 ↓';
  }

  document.getElementById('trophyMore').addEventListener('click', function(){
    trophyExpanded = !trophyExpanded;
    renderEvent();
  });

  document.getElementById('eventToggle').addEventListener('click', function(e){
    const btn = e.target.closest('.event-btn');
    if(!btn) return;
    currentEventIdx = Number(btn.dataset.i);
    trophyExpanded = false;
    renderEvent();
  });

  let currentYear = '2026';

  function computeRanks(list){
    const ranks = [];
    let rank = 0;
    let prevValue = null;
    list.forEach(function(p, i){
      if(p.value !== prevValue){
        rank = i + 1;
        prevValue = p.value;
      }
      ranks.push(rank);
    });
    return ranks;
  }

  const RANK_CLS = ['n', 'e', 'x'];
  const PAGE_SIZE = 3;

  function chunk(arr, size){
    const out = [];
    for(let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  let rankExpanded = false;

  function renderBoard(){
    const data = BOARDS.friend;
    const list = data.year;
    const rankNums = computeRanks(list);
    const top6 = list.slice(0, 6);
    const top6Ranks = rankNums.slice(0, 6);

    document.getElementById('boardYearBtn').textContent = currentYear + ' ' + data.title;
    document.getElementById('boardUnitText').textContent = data.unit;

    const row = document.getElementById('rankRow');
    const moreBtn = document.getElementById('rankMore');
    if(!top6.length){
      row.innerHTML = '<div class="rank-page"><div class="rank-card glass"><div class="rank-empty">尚無資料</div></div></div>';
      moreBtn.style.display = 'none';
      return;
    }
    const items = top6.map(function(p, i){ return { p: p, rank: top6Ranks[i], cls: RANK_CLS[i] || '' }; });
    const pages = chunk(items, PAGE_SIZE);
    if(pages[0] && pages[0].length === 3){
      pages[0] = [pages[0][1], pages[0][0], pages[0][2]];
    }
    const visiblePages = rankExpanded ? pages : pages.slice(0, 1);
    row.innerHTML = visiblePages.map(function(page){
      const cardsHtml = page.map(function(item){
        return '<div class="rank-card ' + item.cls + ' glass">' +
          '<div class="rank-no">NO.' + item.rank + '</div>' +
          '<div class="rank-avatar">' + avatarInitial(item.p.name) + '</div>' +
          '<div class="rank-person-name">' + item.p.name + '</div>' +
          '<div class="rank-value">' + item.p.value + data.valueSuffix + '</div>' +
        '</div>';
      }).join('');
      return '<div class="rank-page">' + cardsHtml + '</div>';
    }).join('');
    moreBtn.style.display = pages.length > 1 ? '' : 'none';
    moreBtn.textContent = rankExpanded ? '收合 ↑' : '查看更多 ↓';
  }

  document.getElementById('rankMore').addEventListener('click', function(){
    rankExpanded = !rankExpanded;
    renderBoard();
  });


  function splitNames(val){
    return String(val || '').split(',').map(s=>s.trim()).filter(Boolean);
  }
  function monthOfWeek(w){ return String(w.week_date || '').slice(0,7); }
  function parseDropinEntry(entry){
    const m = String(entry || '').match(/^(.*?)\(([^()]+)\)$/);
    return m ? { name: m[1].trim(), referrer: m[2].trim() } : { name: String(entry || '').trim(), referrer: '' };
  }
  function tally(names){
    const counts = {};
    names.forEach(n=>{ counts[n] = (counts[n] || 0) + 1; });
    return Object.keys(counts)
      .map(name=>({ name, value: counts[name] }))
      .sort((a,b)=> b.value - a.value || a.name.localeCompare(b.name));
  }
  // 訪客類佔位名字：純「友」「友1」，或「{邀請人}友{編號}」這種沒留真名的
  // 臨打訪客（例如「忠友1」「CC友」），一律排除在真實身份之外。
  function isPlaceholderName(name){
    return /友\d*$/.test(name);
  }
  function computeFriendBoard(weeks){
    const referrers = [];
    weeks.forEach(w=>{
      splitNames(w.dropin_names).forEach(entry=>{
        const referrer = parseDropinEntry(entry).referrer;
        if(referrer && !isPlaceholderName(referrer)) referrers.push(referrer);
      });
    });
    return tally(referrers);
  }
  function applyBoardData(weeks){
    const monthsSet = [...new Set(weeks.map(monthOfWeek))].sort();
    if(!monthsSet.length) return;
    const latestMonth = monthsSet[monthsSet.length - 1];
    const year = latestMonth.slice(0,4);
    currentYear = year;
    const monthWeeks = weeks.filter(w=> monthOfWeek(w) === latestMonth);
    const yearWeeks = weeks.filter(w=> monthOfWeek(w).slice(0,4) === year);

    BOARDS.friend.month = computeFriendBoard(monthWeeks);
    BOARDS.friend.year = computeFriendBoard(yearWeeks).filter(p=> p.value >= 3);
    renderBoard();
  }

  async function loadBoards(){
    const params = { action:'getWeeks' };
    const cached = getApiCache(params);
    if(cached) applyBoardData(cached.weeks || []);
    try{
      const result = await apiGet(params);
      setApiCache(params, result);
      applyBoardData(result.weeks || []);
    } catch(e){
      // 讀取失敗就維持現有資料（快取或空清單）
    }
  }

  renderEvent();
  renderBoard();
  loadBoards();
</script>

</body>
</html>
