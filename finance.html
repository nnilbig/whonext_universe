<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>帳務 — WHONEXT UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --n-accent:#9FB3C8; --n-glow:rgba(159,179,200,0.5);
    --e-accent:#C9B79B; --e-glow:rgba(201,183,155,0.5);
    --x-accent:#B9B9BD; --x-glow:rgba(185,185,189,0.5);
    --t-accent:#E9E9E4; --t-glow:rgba(233,233,228,0.5);
    --good:#7FD79A;   --good-bg:rgba(127,215,154,0.14);
    --warn:#E7A15A;   --warn-bg:rgba(231,161,90,0.14);
    --info:#7FA8D9;   --info-bg:rgba(127,168,217,0.14);
    --gold:#E4C97A;   --gold-bg:rgba(228,201,122,0.14);
    --silver:#C9CDD3; --silver-bg:rgba(201,205,211,0.12);
    --bronze:#C98A55; --bronze-bg:rgba(201,138,85,0.14);

    --bg:#000000;
    --card:rgba(255,255,255,0.07);
    --card-strong:rgba(255,255,255,0.13);
    --line:rgba(255,255,255,0.14);
    --label:#F5F5F7;
    --secondary:rgba(235,235,245,0.62);
    --tertiary:rgba(235,235,245,0.32);

    --sf: -apple-system, BlinkMacSystemFont, "PingFang TC", "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    --sf-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(228,201,122,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(159,179,200,0.07), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  .navbar{
    position:sticky; top:0; z-index:30;
    padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner{
    max-width: 640px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
    padding: 10px 16px 12px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .nav-title .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary); text-transform:uppercase; }
  .nav-title h1{ margin:1px 0 0; font-size:20px; font-weight:800; letter-spacing:-.01em; }

  .wrap{ max-width: 640px; margin:0 auto; padding: 20px 16px 8px; }

  .hero{ padding: 4px 4px 22px; }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.06em;
    font-size: clamp(24px,6.4vw,30px); margin-bottom:8px; color: var(--gold);
  }
  .hero p{ font-size: clamp(13px,3.2vw,14.5px); color:var(--secondary); line-height:1.6; max-width:440px; }

  /* ---- month nav ---- */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin: 0 4px 16px;
  }
  .month-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--gold);
  }
  .month-btn:disabled{ opacity:.25; }
  .month-label{ text-align:center; }
  .month-label .m{ margin:0; font-size:16px; font-weight:800; }
  .month-label .s{ margin:2px 0 0; font-size:10.5px; color:var(--tertiary); }

  /* ---- balance hero card ---- */
  .balance-card{ padding: 20px 20px 18px; margin-bottom:18px; }
  .balance-card .label{ margin:0 0 4px; font-size:12px; color:var(--secondary); }
  .balance-card .amount{ margin:0; font-size:32px; font-weight:800; letter-spacing:-.01em; font-family: var(--sf-mono); }
  .balance-sub{ display:flex; gap:20px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .balance-sub div p:first-child{ margin:0 0 2px; font-size:10.5px; color:var(--tertiary); }
  .balance-sub div p:last-child{ margin:0; font-size:14.5px; font-weight:700; font-family: var(--sf-mono); }

  .board-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin: 4px 4px 12px;
  }
  .board-title .t{ font-size:14px; font-weight:800; }
  .board-title .n{ font-size:11px; color:var(--tertiary); }

  /* ---- weekly list ---- */
  .board-list{ padding: 6px 6px; margin-bottom: 22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding: 13px 8px;
    border-top: 1px solid var(--line);
  }
  .row:first-child{ border-top:none; }
  .row:active{ background: rgba(255,255,255,0.04); border-radius:14px; }
  .row-date{
    width:32px; flex-shrink:0; text-align:center;
    font-family: var(--sf-mono); font-weight:700; font-size:14px; color:var(--secondary);
  }
  .row-body{ flex:1; min-width:0; }
  .row-body .rmeta{ margin:0; font-size:12px; color:var(--secondary); }
  .row-body .rnote{ margin:3px 0 0; font-size:10.5px; color:var(--tertiary); }
  .row-value{ font-size:14.5px; font-weight:700; font-family: var(--sf-mono); flex-shrink:0; }
  .chev{ color:var(--tertiary); font-size:15px; margin-left:2px; flex-shrink:0; }

  .wordmark-footer{
    text-align:center; margin: 24px 0 6px;
    font-family:'Archivo Black', var(--sf); font-size:12px; letter-spacing:.16em; color: var(--tertiary);
  }

  /* ---- detail sheet ---- */
  .sheet-overlay{
    display:none; position:fixed; inset:0; z-index:50;
    background: rgba(0,0,0,0.65);
    align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
    background: #0a0a0a;
    border:1px solid var(--line); border-bottom:none;
    border-radius: 24px 24px 0 0;
    padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-handle{ width:36px; height:5px; background:var(--line); border-radius:3px; margin:0 auto 14px; }
  .sheet-header{ display:flex; align-items:center; margin-bottom:14px; }
  .sheet-close{ font-size:14px; font-weight:700; color:var(--gold); padding:4px 0; }
  .sheet-title{ flex:1; text-align:center; margin:0; font-size:15px; font-weight:800; }
  .sheet-spacer{ width:44px; flex-shrink:0; }

  .sheet-hero{ text-align:center; padding: 6px 0 20px; }
  .sheet-hero .label{ margin:0 0 4px; font-size:11.5px; color:var(--secondary); }
  .sheet-hero .amount{ margin:0; font-size:28px; font-weight:800; font-family: var(--sf-mono); }

  .group-card{ margin-bottom:14px; padding: 14px 14px 12px; }
  .group-title{ display:flex; align-items:center; justify-content:space-between; margin:0 0 12px; font-size:12px; font-weight:800; }
  .group-title .cnt{ font-family: var(--sf-mono); font-weight:700; }
  .att-grid{ display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px 4px; }
  .att-cell{ text-align:center; }
  .att-avatar{
    width:38px; height:38px; border-radius:50%; margin:0 auto 4px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; line-height:1;
    border:1.5px solid var(--line); background: var(--card-strong);
  }
  .att-cell p{ margin:0; font-size:9.5px; color:var(--tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .att-empty{ margin:0; font-size:12px; color:var(--tertiary); }

  .detail-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 2px; border-top:1px solid var(--line);
    font-size:13px;
  }
  .detail-row:first-child{ border-top:none; }
  .detail-row .dlabel{ color:var(--secondary); }
  .detail-row .dvalue{ font-weight:700; font-family: var(--sf-mono); }
</style>
</head>
<body>

  <div class="navbar">
    <div class="nav-inner">
      <a class="back-btn" href="index.html" aria-label="返回首頁">‹</a>
      <div class="nav-title">
        <div class="eyebrow">WHONEXT</div>
        <h1>UNIVERSE</h1>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="hero">
      <div class="wordmark">帳務</div>
      <p></p>
    </div>

    <div class="month-nav">
      <button class="month-btn" id="prevBtn" onclick="stepMonth(-1)" aria-label="上一個月">‹</button>
      <div class="month-label">
        <p class="m" id="monthLabel">—</p>
        <p class="s">每月每週收支總覽</p>
      </div>
      <button class="month-btn" id="nextBtn" onclick="stepMonth(1)" aria-label="下一個月">›</button>
    </div>

    <div class="balance-card glass">
      <p class="label">本月合計</p>
      <p class="amount" id="netAmount">$0</p>
      <div class="balance-sub">
        <div><p>收入</p><p id="incomeAmount" style="color:var(--good);">$0</p></div>
        <div><p>支出</p><p id="expenseAmount" style="color:var(--warn);">$0</p></div>
        <div><p>平均出席</p><p id="avgAtt">0 人</p></div>
      </div>
    </div>

    <div class="board-title"><span class="t">每週紀錄</span><span class="n" id="weekCount">共 0 週</span></div>
    <div class="board-list glass" id="weekList"></div>

    <div class="wordmark-footer">WHONEXT</div>

  </div>

  <div class="sheet-overlay" id="detailOverlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button class="sheet-close" onclick="closeSheet()">‹ 返回</button>
        <p class="sheet-title" id="sheetTitle">週詳情</p>
        <span class="sheet-spacer"></span>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

<script>
// ---------------------------------------------------------------
// 靜態展示資料（尚未串接後台，僅供視覺呈現）
// ---------------------------------------------------------------
const BALLS_PER_TUBE = 12;
const MEMBERS = ['忠','安','Jessica','韶恩','孟翰','儒','扯翔','煒'];
const WEEKLY_FEE = 210;
const DROPIN_FEE = 210;

const WEEKS = [
  { date:'2026-07-05', present:['忠','安','Jessica','韶恩','孟翰','儒','扯翔','煒'], leave:[], dropins:['Vic','TonyH'], balls:10, tube:980, court:2200, actExp:0, actInc:0, note:'' },
  { date:'2026-07-12', present:['忠','安','韶恩','孟翰','儒','扯翔','煒'], leave:['Jessica'], dropins:['Vic'], balls:9, tube:980, court:2200, actExp:0, actInc:0, note:'' },
  { date:'2026-07-19', present:['忠','安','Jessica','韶恩','孟翰','儒','煒'], leave:['扯翔'], dropins:['TonyH','Tony','學承'], balls:11, tube:980, court:2200, actExp:800, actInc:0, note:'生日聚餐' },
  { date:'2026-07-26', present:['忠','安','Jessica','韶恩','孟翰','儒','扯翔','煒'], leave:[], dropins:['Vic','Tony'], balls:10, tube:980, court:2200, actExp:0, actInc:0, note:'' },
  { date:'2026-08-02', present:['忠','安','Jessica','韶恩','孟翰','儒','扯翔'], leave:['煒'], dropins:['TonyH'], balls:9, tube:980, court:2200, actExp:0, actInc:0, note:'' },
  { date:'2026-08-09', present:['忠','安','Jessica','韶恩','孟翰','儒','扯翔','煒'], leave:[], dropins:['Vic','TonyH','學承'], balls:12, tube:980, court:2200, actExp:0, actInc:0, note:'' },
];

let currentMonth = null;
let sheetWeek = null;

function fmt(n){ return (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString(); }
function monthOf(w){ return w.date.slice(0,7); }
function months(){ return [...new Set(WEEKS.map(monthOf))].sort(); }
function weeksOfMonth(m){ return WEEKS.filter(w => monthOf(w) === m).sort((a,b) => a.date.localeCompare(b.date)); }

function ballExpense(w){ return Math.round((w.balls / BALLS_PER_TUBE) * w.tube); }
function weekFinancials(w){
  const monthlyInc = (w.present.length + w.leave.length) * WEEKLY_FEE;
  const leaveDed = w.leave.length * WEEKLY_FEE;
  const dropinInc = w.dropins.length * DROPIN_FEE;
  const income = monthlyInc - leaveDed + dropinInc + w.actInc;
  const expense = ballExpense(w) + w.court + w.actExp;
  return { monthlyInc, leaveDed, dropinInc, income, expense, net: income - expense };
}

function initialOf(name){ return name.slice(0,1); }

function renderMonth(m){
  currentMonth = m;
  const weeks = weeksOfMonth(m);
  const ms = months();
  const idx = ms.indexOf(m);
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= ms.length - 1;
  document.getElementById('monthLabel').textContent = m.slice(0,4) + ' 年 ' + m.slice(5,7) + ' 月';

  let income = 0, expense = 0, att = 0;
  weeks.forEach(w => {
    const f = weekFinancials(w);
    income += f.income; expense += f.expense;
    att += w.present.length + w.dropins.length;
  });
  const net = income - expense;
  document.getElementById('netAmount').textContent = (net>=0?'+':'') + fmt(net);
  document.getElementById('netAmount').style.color = net>=0 ? 'var(--gold)' : 'var(--warn)';
  document.getElementById('incomeAmount').textContent = fmt(income);
  document.getElementById('expenseAmount').textContent = fmt(expense);
  document.getElementById('avgAtt').textContent = (weeks.length ? Math.round(att/weeks.length) : 0) + ' 人';
  document.getElementById('weekCount').textContent = '共 ' + weeks.length + ' 週';

  document.getElementById('weekList').innerHTML = weeks.map((w) => {
    const f = weekFinancials(w);
    const attCount = w.present.length + w.dropins.length;
    return `
    <div class="row" onclick="openWeek('${w.date}')">
      <div class="row-date">${w.date.slice(8,10)}</div>
      <div class="row-body">
        <p class="rmeta">出席 ${attCount} · 月繳 ${w.present.length} · 臨打 ${w.dropins.length}${w.leave.length ? ' · 請假 '+w.leave.length : ''}</p>
        ${w.note ? `<p class="rnote">${w.note}</p>` : ''}
      </div>
      <span class="row-value" style="color:${f.net>0?'var(--good)':f.net<0?'var(--warn)':'var(--secondary)'};">${f.net>=0?'+':''}${fmt(f.net)}</span>
      <span class="chev">›</span>
    </div>`;
  }).join('');
}

function stepMonth(dir){
  const ms = months();
  const idx = ms.indexOf(currentMonth) + dir;
  if (idx < 0 || idx >= ms.length) return;
  renderMonth(ms[idx]);
}

function attGroupHTML(names, colorVar, bgVar){
  if (!names.length) return '<p class="att-empty">無</p>';
  return `<div class="att-grid">${names.map(n => `
    <div class="att-cell">
      <div class="att-avatar" style="border-color:${colorVar};color:${colorVar};background:${bgVar};">${initialOf(n)}</div>
      <p>${n}</p>
    </div>`).join('')}</div>`;
}

function openWeek(date){
  sheetWeek = WEEKS.find(w => w.date === date);
  const f = weekFinancials(sheetWeek);
  document.getElementById('sheetTitle').textContent = sheetWeek.date.slice(5);

  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-hero">
      <p class="label">本週合計</p>
      <p class="amount" style="color:${f.net>=0?'var(--gold)':'var(--warn)'};">${f.net>=0?'+':''}${fmt(f.net)}</p>
    </div>

    <div class="group-card glass">
      <p class="group-title" style="color:var(--good);">月繳出席 <span class="cnt">${sheetWeek.present.length} 人</span></p>
      ${attGroupHTML(sheetWeek.present, 'var(--good)', 'var(--good-bg)')}
    </div>

    ${sheetWeek.leave.length ? `
    <div class="group-card glass">
      <p class="group-title" style="color:var(--warn);">請假 <span class="cnt">${sheetWeek.leave.length} 人</span></p>
      ${attGroupHTML(sheetWeek.leave, 'var(--warn)', 'var(--warn-bg)')}
    </div>` : ''}

    <div class="group-card glass">
      <p class="group-title" style="color:var(--info);">臨打 <span class="cnt">${sheetWeek.dropins.length} 人</span></p>
      ${attGroupHTML(sheetWeek.dropins, 'var(--info)', 'var(--info-bg)')}
    </div>

    <div class="group-card glass">
      <p class="group-title" style="color:var(--secondary);">財務明細</p>
      <div class="detail-row"><span class="dlabel">月繳收入</span><span class="dvalue">${fmt(f.monthlyInc)}</span></div>
      ${f.leaveDed > 0 ? `<div class="detail-row"><span class="dlabel">請假扣除</span><span class="dvalue" style="color:var(--warn);">-${fmt(f.leaveDed)}</span></div>` : ''}
      <div class="detail-row"><span class="dlabel">臨打收入</span><span class="dvalue">${fmt(f.dropinInc)}</span></div>
      ${sheetWeek.actInc > 0 ? `<div class="detail-row"><span class="dlabel">活動收入</span><span class="dvalue">${fmt(sheetWeek.actInc)}</span></div>` : ''}
      <div class="detail-row"><span class="dlabel">球費（${sheetWeek.balls} 顆）</span><span class="dvalue">${fmt(ballExpense(sheetWeek))}</span></div>
      <div class="detail-row"><span class="dlabel">場地費</span><span class="dvalue">${fmt(sheetWeek.court)}</span></div>
      ${sheetWeek.actExp > 0 ? `<div class="detail-row"><span class="dlabel">活動支出</span><span class="dvalue">${fmt(sheetWeek.actExp)}</span></div>` : ''}
      ${sheetWeek.note ? `<div class="detail-row"><span class="dlabel">活動備註</span><span class="dvalue">${sheetWeek.note}</span></div>` : ''}
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}
function closeSheet(){ document.getElementById('detailOverlay').classList.remove('show'); }

renderMonth(months()[months().length - 1]);
</script>

</body>
</html>
