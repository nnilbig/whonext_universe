<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>球隊錢包 — WHONEXT UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="top-nav.css">
<link rel="stylesheet" href="bottom-nav.css">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(228,201,122,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(159,179,200,0.07), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  .wrap{ max-width: 640px; margin:0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }

  .hero{ padding: 4px 4px 22px; }
  .hero .hero-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary);
    text-transform:uppercase; margin-bottom:8px;
  }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(26px,7vw,34px); margin-bottom:8px;
  }
  .hero p{ margin:0; font-size: clamp(13px,3.2vw,14.5px); color:var(--secondary); line-height:1.6; max-width:440px; }

  /* ---- period toggle ---- */
  .period-toggle{
    display:flex; background: var(--card); border:1px solid var(--line);
    border-radius:999px; padding:2px; width:fit-content; margin: 0 0 16px;
  }
  .period-btn{
    font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px; color:var(--tertiary);
  }
  .period-btn.active{ background: var(--card-strong); color: var(--label); }

  /* ---- month nav ---- */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin: 0 4px 16px;
  }
  .month-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--gold);
  }
  .month-btn:disabled{ opacity:.25; }
  .month-label{ text-align:center; }
  .month-label .m{ margin:0; font-size:16px; font-weight:800; }
  .month-label .s{ margin:2px 0 0; font-size:10.5px; color:var(--tertiary); }

  /* ---- balance hero card ---- */
  .balance-card{ padding: 20px 20px 18px; margin-bottom:18px; }
  .balance-card .label{ margin:0 0 4px; font-size:12px; color:var(--secondary); }
  .balance-card .amount{ margin:0; font-size:32px; font-weight:800; letter-spacing:-.01em; font-family: var(--sf-mono); }
  .balance-sub{ display:flex; gap:20px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .balance-sub div p:first-child{ margin:0 0 2px; font-size:10.5px; color:var(--tertiary); }
  .balance-sub div p:last-child{ margin:0; font-size:14.5px; font-weight:700; font-family: var(--sf-mono); }

  .board-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin: 4px 4px 12px;
  }
  .board-title .t{ font-size:14px; font-weight:800; }
  .board-title .n{ font-size:11px; color:var(--tertiary); }

  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.18em; color:var(--tertiary);
    text-transform:uppercase; margin: 4px 4px 12px;
  }

  /* ---- weekly list ---- */
  .board-list{ padding: 6px 6px; margin-bottom: 22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding: 13px 8px;
    border-top: 1px solid var(--line);
  }
  .row:first-child{ border-top:none; }
  .row:active{ background: rgba(255,255,255,0.04); border-radius:14px; }
  .row-date{
    width:32px; flex-shrink:0; text-align:center;
    font-family: var(--sf-mono); font-weight:700; font-size:14px; color:var(--secondary);
  }
  .row-body{ flex:1; min-width:0; }
  .row-body .rmeta{ margin:0; font-size:12px; color:var(--secondary); }
  .row-body .rnote{ margin:3px 0 0; font-size:10.5px; color:var(--tertiary); }
  .row-value{ font-size:14.5px; font-weight:700; font-family: var(--sf-mono); flex-shrink:0; }
  .chev{ color:var(--tertiary); font-size:15px; margin-left:2px; flex-shrink:0; }


  /* ---- detail sheet ---- */
  .sheet-overlay{
    display:none; position:fixed; inset:0; z-index:50;
    background: rgba(0,0,0,0.65);
    align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
    background: #0a0a0a;
    border:1px solid var(--line); border-bottom:none;
    border-radius: 24px 24px 0 0;
    padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-handle{ width:36px; height:5px; background:var(--line); border-radius:3px; margin:0 auto 14px; }
  .sheet-header{ display:flex; align-items:center; margin-bottom:14px; }
  .sheet-close{ font-size:14px; font-weight:700; color:var(--gold); padding:4px 0; }
  .sheet-title{ flex:1; text-align:center; margin:0; font-size:15px; font-weight:800; }
  .sheet-spacer{ width:44px; flex-shrink:0; }

  .sheet-hero{ text-align:center; padding: 6px 0 20px; }
  .sheet-hero .label{ margin:0 0 4px; font-size:11.5px; color:var(--secondary); }
  .sheet-hero .amount{ margin:0; font-size:28px; font-weight:800; font-family: var(--sf-mono); }

  .group-card{ margin-bottom:14px; padding: 14px 14px 12px; }
  .group-title{ display:flex; align-items:center; justify-content:space-between; margin:0 0 12px; font-size:12px; font-weight:800; }
  .group-title .cnt{ font-family: var(--sf-mono); font-weight:700; }
  .att-grid{ display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px 4px; }
  .att-cell{ text-align:center; }
  .att-avatar{
    width:38px; height:38px; border-radius:50%; margin:0 auto 4px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; line-height:1;
    border:1.5px solid var(--line); background: var(--card-strong);
  }
  .att-cell p{ margin:0; font-size:9.5px; color:var(--tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .att-empty{ margin:0; font-size:12px; color:var(--tertiary); }

  .detail-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 2px; border-top:1px solid var(--line);
    font-size:13px;
  }
  .detail-row:first-child{ border-top:none; }
  .detail-row .dlabel{ color:var(--secondary); }
  .detail-row .dvalue{ font-weight:700; font-family: var(--sf-mono); }

  /* ---------- ADMIN FINANCE EDIT ---------- */
  .attend-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:9px;
    padding: 10px 4px; border-top:1px solid var(--line);
    font-size:13px; cursor:pointer;
  }
  .attend-toggle-row:first-child{ border-top:none; }
  .attend-toggle-row:active{ background: rgba(255,255,255,0.04); border-radius:10px; }
  .attend-status{
    font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1px solid transparent; flex-shrink:0;
  }
  .edit-field-label{ font-size:11px; color:var(--tertiary); margin: 0 2px 6px; }
  .edit-input{
    width:100%; box-sizing:border-box;
    font-family: var(--sf-mono); font-size:16px; color: var(--label);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; margin-bottom:12px;
  }
  .edit-input:focus{ outline:none; border-color: rgba(255,255,255,0.32); }
  select.edit-input{ color: var(--label); }
  select.edit-input option{ color: var(--label); background:#1c1c1e; }
  .edit-save-btn{
    width:100%; font-size:13px; font-weight:700; padding:10px 0; border-radius:12px;
    background: var(--label); color:#000;
  }
  .row-remove-btn{
    font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px; flex-shrink:0;
    color: var(--warn); border:1px solid rgba(231,161,90,0.4); background: rgba(231,161,90,0.1);
  }
  .row-remove-btn.is-restore{
    color: var(--secondary); border-color: var(--line); background: rgba(255,255,255,0.05);
  }
  .dropin-edit-row.is-pending-remove .dropin-edit-name{ opacity:.4; text-decoration:line-through; }

  .toast{
    position:fixed; bottom: calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    max-width: calc(100vw - 32px);
    background: rgba(30,30,32,0.92);
    backdrop-filter: blur(16px);
    color: var(--label); font-size:13.5px; padding:11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px; opacity:0; transition: all .3s ease; pointer-events:none; z-index:200;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">WHONEXT BADMINTON CLUB</div>
      <div class="wordmark" id="walletTitle">球隊錢包</div>
    </div>

    <div id="teamWalletView">
      <div class="period-toggle" id="periodToggle">
        <button class="period-btn active" data-p="month" onclick="setPeriod('month')">月份</button>
        <button class="period-btn" data-p="year" onclick="setPeriod('year')">年度至今</button>
      </div>

      <div class="month-nav">
        <button class="month-btn" id="prevBtn" onclick="stepPeriod(-1)" aria-label="上一個">‹</button>
        <div class="month-label">
          <p class="m" id="monthLabel">—</p>
          <p class="s" id="monthSub">每月每週收支總覽</p>
        </div>
        <button class="month-btn" id="nextBtn" onclick="stepPeriod(1)" aria-label="下一個">›</button>
      </div>

      <div class="balance-card glass">
        <p class="label" id="balanceLabel">年度合計</p>
        <p class="amount" id="netAmount">$0</p>
        <div class="balance-sub">
          <div><p>收入</p><p id="incomeAmount" style="color:var(--warn);">$0</p></div>
          <div><p>支出</p><p id="expenseAmount" style="color:var(--good);">$0</p></div>
          <div><p>平均出席</p><p id="avgAtt">0</p></div>
        </div>
      </div>

      <div class="board-title"><span class="t">每週紀錄</span><span class="n" id="weekCount">共 0 週</span></div>
      <div class="board-list glass" id="weekList"></div>
    </div>

    <div id="myWalletLabel" class="section-label" style="display:none">目前餘額</div>
    <div id="myWalletView" class="balance-card glass" style="display:none">
      <p class="amount" id="myWalletAmount">$0</p>
      <p id="myWalletNote" style="margin:14px 0 0; font-size:12px; color:var(--tertiary); line-height:1.6; white-space:pre-line;">載入中…</p>
    </div>

    <div id="walletLoginRequired" style="display:none"></div>

  </div>

  <div class="sheet-overlay" id="detailOverlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button class="sheet-close" onclick="closeSheet()">‹ 返回</button>
        <p class="sheet-title" id="sheetTitle">週詳情</p>
        <span class="sheet-spacer"></span>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="backend.js"></script>
<script src="top-nav.js"></script>
<script src="auth.js"></script>
<script src="identity-picker.js"></script>
<script src="bottom-nav.js"></script>
<script>
const BALLS_PER_TUBE = 12;
let ALL_WEEKS = [];
let currentPeriod = 'month';
let currentMonth = null;
let currentYear = null;
let sheetWeek = null;

function fmt(n){ return (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString(); }

function splitNames(val){
  return String(val || '').split(',').map(s=>s.trim()).filter(Boolean);
}
function parseDropinEntry(entry){
  const m = String(entry || '').match(/^(.*?)\(([^()]+)\)$/);
  return m ? { name: m[1].trim(), referrer: m[2].trim() } : { name: String(entry || '').trim(), referrer: '' };
}
function formatDropinEntry(name, referrer){
  return referrer ? name + '(' + referrer + ')' : name;
}
function toWeekRecord(w){
  return {
    _raw: w,
    date: w.week_date,
    present: splitNames(w.present_names),
    leave: splitNames(w.leave_names),
    dropins: splitNames(w.dropin_names).map(entry=> parseDropinEntry(entry).name),
    weeklyFee: Number(w.monthly_fee) || 0,
    dropinFee: Number(w.dropin_fee) || 0,
    balls: Number(w.balls_used) || 0,
    tube: Number(w.price_per_tube) || 0,
    court: Number(w.court_expense) || 0,
    actInc: Number(w.activity_income) || 0,
    actExp: Number(w.activity_expense) || 0,
    note: w.activity_note || ''
  };
}

function monthOf(w){ return w.date.slice(0,7); }
function months(){ return [...new Set(ALL_WEEKS.map(monthOf))].sort(); }
function weeksOfMonth(m){ return ALL_WEEKS.filter(w => monthOf(w) === m).sort((a,b) => a.date.localeCompare(b.date)); }

function loadCachedWeeks(){
  const cached = getApiCache({ action:'getWeeks' });
  if(cached) ALL_WEEKS = (cached.weeks || []).map(toWeekRecord);
  return !!cached;
}

async function refreshWeeks(){
  const params = { action:'getWeeks' };
  try{
    const result = await apiGet(params);
    setApiCache(params, result);
    ALL_WEEKS = (result.weeks || []).map(toWeekRecord);
  } catch(e){
    // 讀取失敗就沿用快取（可能是空陣列）
  }
}

function ballExpense(w){ return Math.round((w.balls / BALLS_PER_TUBE) * w.tube); }
function weekFinancials(w){
  const monthlyInc = (w.present.length + w.leave.length) * w.weeklyFee;
  const leaveDed = w.leave.length * w.weeklyFee;
  const dropinInc = w.dropins.length * w.dropinFee;
  const income = monthlyInc - leaveDed + dropinInc + w.actInc;
  const expense = ballExpense(w) + w.court + w.actExp;
  return { monthlyInc, leaveDed, dropinInc, income, expense, net: income - expense };
}

function initialOf(name){ return name.slice(0,1); }

function years(){ return [...new Set(ALL_WEEKS.map(w=> monthOf(w).slice(0,4)))].sort(); }
function weeksOfYear(y){ return ALL_WEEKS.filter(w=> monthOf(w).slice(0,4) === y).sort((a,b) => a.date.localeCompare(b.date)); }

function renderSummary(weeks){
  let income = 0, expense = 0, att = 0;
  weeks.forEach(w => {
    const f = weekFinancials(w);
    income += f.income; expense += f.expense;
    att += w.present.length + w.dropins.length;
  });
  const net = income - expense;
  document.getElementById('netAmount').textContent = (net>=0?'+':'') + fmt(net);
  document.getElementById('netAmount').style.color = net>=0 ? 'var(--warn)' : 'var(--good)';
  document.getElementById('incomeAmount').textContent = fmt(income);
  document.getElementById('expenseAmount').textContent = fmt(expense);
  document.getElementById('avgAtt').textContent = (weeks.length ? Math.round(att/weeks.length) : 0) + '';
  document.getElementById('weekCount').textContent = '共 ' + weeks.length + ' 週';
}

function renderWeekList(weeks, dateFmt){
  document.getElementById('weekList').innerHTML = weeks.length ? weeks.map((w) => {
    const f = weekFinancials(w);
    const attCount = w.present.length + w.dropins.length;
    return `
    <div class="row" onclick="openWeek('${w.date}')">
      <div class="row-date">${dateFmt(w.date)}</div>
      <div class="row-body">
        <p class="rmeta">出席 ${attCount} · 月繳 ${w.present.length} · 臨打 ${w.dropins.length}${w.leave.length ? ' · 請假 '+w.leave.length : ''}</p>
        ${w.note ? `<p class="rnote">${w.note}</p>` : ''}
      </div>
      <span class="row-value" style="color:${f.net>0?'var(--warn)':f.net<0?'var(--good)':'var(--secondary)'};">${f.net>=0?'+':''}${fmt(f.net)}</span>
      <span class="chev">›</span>
    </div>`;
  }).join('') : '<div class="row"><div class="row-body"><p class="rmeta">尚無收支紀錄</p></div></div>';
}

function renderMonth(m){
  currentPeriod = 'month';
  currentMonth = m;
  const weeks = weeksOfMonth(m);
  const ms = months();
  const idx = ms.indexOf(m);
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= ms.length - 1;
  document.getElementById('monthLabel').textContent = m.slice(0,4) + ' 年 ' + m.slice(5,7) + ' 月';
  document.getElementById('monthSub').textContent = '每月每週收支總覽';
  document.getElementById('balanceLabel').textContent = '本月合計';

  renderSummary(weeks);
  renderWeekList(weeks, d=> d.slice(8,10));
}

function renderYear(y){
  currentPeriod = 'year';
  currentYear = y;
  const weeks = weeksOfYear(y);
  const ys = years();
  const idx = ys.indexOf(y);
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= ys.length - 1;
  document.getElementById('monthLabel').textContent = y + ' 年度至今';
  document.getElementById('monthSub').textContent = '年度累計收支總覽';
  document.getElementById('balanceLabel').textContent = '年度合計';

  renderSummary(weeks);
  renderWeekList(weeks, d=> d.slice(5,7) + '/' + d.slice(8,10));
}

function setPeriod(p){
  document.querySelectorAll('#periodToggle .period-btn').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.p === p);
  });
  if(p === 'year'){
    const ys = years();
    if(!ys.length) return;
    renderYear(ys.includes(currentYear) ? currentYear : ys[ys.length - 1]);
  } else {
    const ms = months();
    if(!ms.length) return;
    renderMonth(ms.includes(currentMonth) ? currentMonth : ms[ms.length - 1]);
  }
}

function stepPeriod(dir){
  if(currentPeriod === 'year'){
    const ys = years();
    const idx = ys.indexOf(currentYear) + dir;
    if (idx < 0 || idx >= ys.length) return;
    renderYear(ys[idx]);
  } else {
    const ms = months();
    const idx = ms.indexOf(currentMonth) + dir;
    if (idx < 0 || idx >= ms.length) return;
    renderMonth(ms[idx]);
  }
}

function attGroupHTML(names, colorVar, bgVar){
  if (!names.length) return '<p class="att-empty">無</p>';
  return `<div class="att-grid">${names.map(n => `
    <div class="att-cell">
      <div class="att-avatar" style="border-color:${colorVar};color:${colorVar};background:${bgVar};">${initialOf(n)}</div>
      <p>${n}</p>
    </div>`).join('')}</div>`;
}

function openWeek(date){
  sheetWeek = ALL_WEEKS.find(w => w.date === date);
  const f = weekFinancials(sheetWeek);
  document.getElementById('sheetTitle').textContent = sheetWeek.date.slice(5);

  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-hero">
      <p class="label">本週合計</p>
      <p class="amount" style="color:${f.net>=0?'var(--warn)':'var(--good)'};">${f.net>=0?'+':''}${fmt(f.net)}</p>
    </div>

    <div class="group-card glass">
      <p class="group-title" style="color:var(--warn);">月繳出席 <span class="cnt">${sheetWeek.present.length} 人</span></p>
      ${attGroupHTML(sheetWeek.present, 'var(--warn)', 'var(--warn-bg)')}
    </div>

    ${sheetWeek.leave.length ? `
    <div class="group-card glass">
      <p class="group-title" style="color:var(--good);">請假 <span class="cnt">${sheetWeek.leave.length} 人</span></p>
      ${attGroupHTML(sheetWeek.leave, 'var(--good)', 'var(--good-bg)')}
    </div>` : ''}

    <div class="group-card glass">
      <p class="group-title" style="color:var(--info);">臨打 <span class="cnt">${sheetWeek.dropins.length} 人</span></p>
      ${attGroupHTML(sheetWeek.dropins, 'var(--info)', 'var(--info-bg)')}
    </div>

    <div class="group-card glass">
      <p class="group-title" style="color:var(--secondary);">財務明細</p>
      <div class="detail-row"><span class="dlabel">月繳收入</span><span class="dvalue">${fmt(f.monthlyInc)}</span></div>
      ${f.leaveDed > 0 ? `<div class="detail-row"><span class="dlabel">請假扣除</span><span class="dvalue" style="color:var(--good);">-${fmt(f.leaveDed)}</span></div>` : ''}
      <div class="detail-row"><span class="dlabel">臨打收入</span><span class="dvalue">${fmt(f.dropinInc)}</span></div>
      ${sheetWeek.actInc > 0 ? `<div class="detail-row"><span class="dlabel">活動收入</span><span class="dvalue">${fmt(sheetWeek.actInc)}</span></div>` : ''}
      <div class="detail-row"><span class="dlabel">球費（${sheetWeek.balls} 顆）</span><span class="dvalue">${fmt(ballExpense(sheetWeek))}</span></div>
      <div class="detail-row"><span class="dlabel">場地費</span><span class="dvalue">${fmt(sheetWeek.court)}</span></div>
      ${sheetWeek.actExp > 0 ? `<div class="detail-row"><span class="dlabel">活動支出</span><span class="dvalue">${fmt(sheetWeek.actExp)}</span></div>` : ''}
      ${sheetWeek.note ? `<div class="detail-row"><span class="dlabel">活動備註</span><span class="dvalue">${sheetWeek.note}</span></div>` : ''}
    </div>

    <div class="group-card glass admin-only">
      <p class="group-title" style="color:var(--secondary);">編輯出席／請假</p>
      <div id="attendEditBody"><p class="att-empty">載入中…</p></div>
    </div>

    <div class="group-card glass admin-only">
      <p class="group-title" style="color:var(--secondary);">編輯臨打名單</p>
      <div id="dropinEditList">${dropinEditListHTML(sheetWeek)}</div>
      <div class="edit-field-label" style="margin-top:12px;">姓名</div>
      <input type="text" id="editDropinName" class="edit-input" placeholder="輸入姓名">
      <div class="edit-field-label">邀請人（選填）</div>
      <select id="editDropinReferrer" class="edit-input"><option value="">— 無 —</option></select>
      <button type="button" class="edit-save-btn" id="addDropinBtn" onclick="addDropinToWeek()">新增</button>
    </div>

    <div class="group-card glass admin-only">
      <p class="group-title" style="color:var(--secondary);">編輯用球數／場地費</p>
      <div class="edit-field-label">用球數（顆）</div>
      <input type="number" id="editBalls" class="edit-input" inputmode="numeric" value="${sheetWeek.balls}">
      <div class="edit-field-label">場地費（$）</div>
      <input type="number" id="editCourt" class="edit-input" inputmode="numeric" value="${sheetWeek.court}">
      <button type="button" class="edit-save-btn" id="saveFinanceBtn" onclick="saveFinanceEdit()">儲存</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
  document.querySelectorAll('#dropinEditList .row-remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('.dropin-edit-row');
      const nowRemoved = row.dataset.removed !== '1';
      row.dataset.removed = nowRemoved ? '1' : '0';
      row.classList.toggle('is-pending-remove', nowRemoved);
      btn.classList.toggle('is-restore', nowRemoved);
      btn.textContent = nowRemoved ? '恢復' : '取消';
    });
  });
  loadAttendEditCard(sheetWeek);
}
function closeSheet(){ document.getElementById('detailOverlay').classList.remove('show'); }

function dropinEditListHTML(week){
  if(!week.dropins.length) return '<p class="att-empty">本週尚無臨打</p>';
  return week.dropins.map(n=> `
    <div class="detail-row dropin-edit-row" data-name="${n}" data-removed="0">
      <span class="dlabel dropin-edit-name">${n}</span>
      <button type="button" class="row-remove-btn" data-name="${n}">移除</button>
    </div>
  `).join('') + `<button type="button" class="edit-save-btn" id="saveDropinBtn" onclick="saveDropinEdit()" style="margin-top:12px;">儲存臨打名單</button>`;
}

async function saveDropinEdit(){
  if(!sheetWeek) return;
  const rows = document.querySelectorAll('#dropinEditList .dropin-edit-row');
  const removedNames = new Set();
  rows.forEach(row=>{ if(row.dataset.removed === '1') removedNames.add(row.dataset.name); });

  const remainingEntries = splitNames(sheetWeek._raw.dropin_names).filter(entry=> !removedNames.has(parseDropinEntry(entry).name));

  const updatedRaw = Object.assign({}, sheetWeek._raw, {
    dropin_names: remainingEntries.join(','),
    original_week_date: sheetWeek._raw.week_date
  });

  const btn = document.getElementById('saveDropinBtn');
  btn.disabled = true;
  btn.textContent = '儲存中…';
  try{
    await apiPost('saveWeek', updatedRaw);
    sheetWeek._raw = updatedRaw;
    sheetWeek.dropins = remainingEntries.map(entry=> parseDropinEntry(entry).name);
    const idx = ALL_WEEKS.findIndex(w=> w.date === sheetWeek.date);
    if(idx >= 0) ALL_WEEKS[idx] = sheetWeek;
    setApiCache({ action:'getWeeks' }, { weeks: ALL_WEEKS.map(w=> w._raw) });

    openWeek(sheetWeek.date);
    if(currentPeriod === 'year') renderYear(currentYear); else renderMonth(currentMonth);
    showToast('已更新臨打名單');
  } catch(e){
    showToast('儲存失敗，請稍後再試');
  } finally{
    const b = document.getElementById('saveDropinBtn');
    if(b){ b.disabled = false; b.textContent = '儲存臨打名單'; }
  }
}

async function loadAttendEditCard(week){
  const params = { action:'getMembers', month: monthOf(week) };
  const cached = getApiCache(params);
  let members = cached ? (cached.members || []) : null;
  if(members) renderAttendEditUI(week, members);
  try{
    const result = await apiGet(params);
    setApiCache(params, result);
    if(sheetWeek !== week) return; // 使用者已經切到別週，這個結果過期就丟棄
    members = result.members || [];
    renderAttendEditUI(week, members);
  } catch(e){
    if(!members){
      const body = document.getElementById('attendEditBody');
      if(body) body.innerHTML = '<p class="att-empty">載入會員名單失敗</p>';
    }
  }
}

function attendStatusStyle(present){
  return present
    ? 'color:var(--warn); border-color:rgba(231,161,90,0.4); background:var(--warn-bg);'
    : 'color:var(--good); border-color:rgba(127,215,154,0.4); background:var(--good-bg);';
}

function renderAttendEditUI(week, members){
  const body = document.getElementById('attendEditBody');
  if(body){
    const presentSet = new Set(week.present);
    body.innerHTML = (members.length ? members.map(m=>{
      const present = presentSet.has(m.name);
      return `<div class="attend-toggle-row" data-name="${m.name}" data-present="${present ? '1' : '0'}">
        <span>${m.name}</span>
        <span class="attend-status" style="${attendStatusStyle(present)}">${present ? '出席' : '請假'}</span>
      </div>`;
    }).join('') + `<button type="button" class="edit-save-btn" id="saveAttendBtn" onclick="saveAttendEdit()" style="margin-top:12px;">儲存出席</button>`
    : '<p class="att-empty">本月尚無月繳成員</p>');

    body.querySelectorAll('.attend-toggle-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const nowPresent = row.dataset.present !== '1';
        row.dataset.present = nowPresent ? '1' : '0';
        const statusEl = row.querySelector('.attend-status');
        statusEl.textContent = nowPresent ? '出席' : '請假';
        statusEl.setAttribute('style', attendStatusStyle(nowPresent));
      });
    });
  }

  const referrerSelect = document.getElementById('editDropinReferrer');
  if(referrerSelect){
    const referrerNames = [...new Set(members.map(m=>m.name).concat(week.dropins))].sort((a,b)=>a.localeCompare(b));
    referrerSelect.innerHTML = '<option value="">— 無 —</option>' + referrerNames.map(n=>`<option value="${n}">${n}</option>`).join('');
  }
}

async function saveAttendEdit(){
  if(!sheetWeek) return;
  const rows = document.querySelectorAll('#attendEditBody .attend-toggle-row');
  const present = [];
  const leave = [];
  rows.forEach(row=>{
    if(row.dataset.present === '1') present.push(row.dataset.name); else leave.push(row.dataset.name);
  });

  const updatedRaw = Object.assign({}, sheetWeek._raw, {
    present_names: present.join(','),
    leave_names: leave.join(','),
    original_week_date: sheetWeek._raw.week_date
  });

  const btn = document.getElementById('saveAttendBtn');
  btn.disabled = true;
  btn.textContent = '儲存中…';
  try{
    await apiPost('saveWeek', updatedRaw);
    sheetWeek._raw = updatedRaw;
    sheetWeek.present = present;
    sheetWeek.leave = leave;
    const idx = ALL_WEEKS.findIndex(w=> w.date === sheetWeek.date);
    if(idx >= 0) ALL_WEEKS[idx] = sheetWeek;
    setApiCache({ action:'getWeeks' }, { weeks: ALL_WEEKS.map(w=> w._raw) });

    openWeek(sheetWeek.date);
    if(currentPeriod === 'year') renderYear(currentYear); else renderMonth(currentMonth);
    showToast('已更新出席與請假名單');
  } catch(e){
    showToast('儲存失敗，請稍後再試');
  } finally{
    const b = document.getElementById('saveAttendBtn');
    if(b){ b.disabled = false; b.textContent = '儲存出席'; }
  }
}

async function addDropinToWeek(){
  if(!sheetWeek) return;
  const name = document.getElementById('editDropinName').value.trim();
  if(!name){ showToast('請輸入姓名'); return; }
  const referrer = document.getElementById('editDropinReferrer').value;

  const existingEntries = splitNames(sheetWeek._raw.dropin_names);
  if(existingEntries.some(entry=> parseDropinEntry(entry).name === name)){
    showToast(name + ' 已經在這週的臨打名單裡');
    return;
  }

  const updatedRaw = Object.assign({}, sheetWeek._raw, {
    dropin_names: existingEntries.concat([formatDropinEntry(name, referrer)]).join(','),
    original_week_date: sheetWeek._raw.week_date
  });

  const btn = document.getElementById('addDropinBtn');
  btn.disabled = true;
  btn.textContent = '新增中…';
  try{
    await apiPost('saveWeek', updatedRaw);
    sheetWeek._raw = updatedRaw;
    sheetWeek.dropins = splitNames(updatedRaw.dropin_names).map(entry=> parseDropinEntry(entry).name);
    const idx = ALL_WEEKS.findIndex(w=> w.date === sheetWeek.date);
    if(idx >= 0) ALL_WEEKS[idx] = sheetWeek;
    setApiCache({ action:'getWeeks' }, { weeks: ALL_WEEKS.map(w=> w._raw) });

    openWeek(sheetWeek.date);
    if(currentPeriod === 'year') renderYear(currentYear); else renderMonth(currentMonth);
    showToast('已新增 ' + name + ' 為臨打');
  } catch(e){
    showToast('新增失敗，請稍後再試');
  } finally{
    const b = document.getElementById('addDropinBtn');
    if(b){ b.disabled = false; b.textContent = '新增'; }
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

async function saveFinanceEdit(){
  if(!sheetWeek) return;
  const balls = Math.max(0, Number(document.getElementById('editBalls').value) || 0);
  const court = Math.max(0, Number(document.getElementById('editCourt').value) || 0);

  const updatedRaw = Object.assign({}, sheetWeek._raw, {
    balls_used: balls,
    court_expense: court,
    original_week_date: sheetWeek._raw.week_date
  });

  const saveBtn = document.getElementById('saveFinanceBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '儲存中…';
  try{
    await apiPost('saveWeek', updatedRaw);
    sheetWeek.balls = balls;
    sheetWeek.court = court;
    sheetWeek._raw = updatedRaw;
    const idx = ALL_WEEKS.findIndex(w=> w.date === sheetWeek.date);
    if(idx >= 0) ALL_WEEKS[idx] = sheetWeek;
    setApiCache({ action:'getWeeks' }, { weeks: ALL_WEEKS.map(w=> w._raw) });

    openWeek(sheetWeek.date);
    if(currentPeriod === 'year') renderYear(currentYear); else renderMonth(currentMonth);
    showToast('已更新用球數與場地費');
  } catch(e){
    showToast('儲存失敗，請稍後再試');
  } finally{
    const btn = document.getElementById('saveFinanceBtn');
    if(btn){ btn.disabled = false; btn.textContent = '儲存'; }
  }
}

function setWalletNote(text, alert){
  const noteEl = document.getElementById('myWalletNote');
  noteEl.textContent = text;
  noteEl.style.color = alert ? 'var(--warn)' : 'var(--tertiary)';
  noteEl.style.fontWeight = alert ? '700' : '400';
}

// 還沒綁定身分（whonext_player_name 是空的）就不算登入，錢包餘額要先擋起來。
// 登入畫面跟「我的活動」共用同一份 identity-picker.js，選完身分後
// whonext:playername-change 事件會讓這裡重新渲染成真正的餘額。
async function updateMyWallet(){
  const role = WhonextAuth.getRole();
  const name = WhonextAuth.getPlayerName();
  const needsLogin = role !== 'admin' && !name;
  const loginEl = document.getElementById('walletLoginRequired');
  loginEl.style.display = needsLogin ? '' : 'none';
  document.getElementById('myWalletLabel').style.display = needsLogin ? 'none' : '';
  document.getElementById('myWalletView').style.display = needsLogin ? 'none' : '';
  if(needsLogin){
    WhonextIdentityPicker.render(loginEl);
    return;
  }

  const amountEl = document.getElementById('myWalletAmount');
  const status = await getWalletStatus(role, name);
  amountEl.textContent = '$' + status.amount.toLocaleString();
  setWalletNote(status.note, status.alert);
}

// 管理員看「球隊錢包」（完整每週收支），其他人看「我的錢包」（暫定餘額規則見上）。
function updateWalletMode(){
  const isAdmin = document.body.classList.contains('is-admin');
  document.getElementById('walletTitle').textContent = isAdmin ? '球隊錢包' : '我的錢包';
  document.getElementById('teamWalletView').style.display = isAdmin ? '' : 'none';
  if(isAdmin){
    document.getElementById('myWalletLabel').style.display = 'none';
    document.getElementById('myWalletView').style.display = 'none';
    document.getElementById('walletLoginRequired').style.display = 'none';
  } else {
    updateMyWallet();
  }
}
document.addEventListener('DOMContentLoaded', updateWalletMode);
document.addEventListener('whonext:playername-change', updateWalletMode);
new MutationObserver(updateWalletMode).observe(document.body, { attributes:true, attributeFilter:['class'] });

(async function init(){
  if(loadCachedWeeks()){
    const cachedMs = months();
    if(cachedMs.length) renderMonth(cachedMs[cachedMs.length - 1]);
  }

  await refreshWeeks();
  const ms = months();
  if(!ms.length){
    document.getElementById('monthLabel').textContent = '無資料';
    document.getElementById('weekList').innerHTML = '<div class="row"><div class="row-body"><p class="rmeta">尚無收支紀錄</p></div></div>';
    return;
  }
  if(currentPeriod === 'year'){
    const ys = years();
    renderYear(ys.includes(currentYear) ? currentYear : ys[ys.length - 1]);
  } else {
    renderMonth(ms.includes(currentMonth) ? currentMonth : ms[ms.length - 1]);
  }
})();
</script>
