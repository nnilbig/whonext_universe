<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>球員列表 — WHONEXT UNIVERSE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WHONEXT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="top-nav.css">
<link rel="stylesheet" href="bottom-nav.css">
<link rel="stylesheet" href="common.css">
<style>
  :root{ --bg-glow-1: rgba(159,179,200,0.09); --bg-glow-2: rgba(201,183,155,0.07); }

  .member-list{ padding: 6px 6px; margin-bottom: 22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding: 12px 6px;
    border-top: 1px solid var(--line);
  }
  .row:first-child{ border-top:none; }
  .row-clickable{ cursor:pointer; }
  .row-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13.5px; font-weight:700; line-height:1;
    background: rgba(255,255,255,0.05); border:1px solid var(--line);
  }
  .row-main{ flex:1; min-width:0; }
  .row-top{ display:flex; align-items:center; gap:8px; }
  .row-name{ flex:1; font-size:14.5px; font-weight:700; line-height:1.3; min-width:0; }
  .row-tag{
    font-size:10.5px; font-weight:600; color:var(--secondary);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; flex-shrink:0;
  }
  .row-tag.good{ color: var(--good); border-color: rgba(127,215,154,0.4); background: var(--good-bg); }
  .row-tag.warn{ color: var(--warn); border-color: rgba(231,161,90,0.4); background: var(--warn-bg); }
  .row-tag.info{ color: var(--info); border-color: rgba(127,168,217,0.4); background: var(--info-bg); }
  .row-stat{ font-size:11px; color:var(--tertiary); flex-shrink:0; margin-top:3px; }
  .chev{ color:var(--tertiary); font-size:15px; margin-left:2px; flex-shrink:0; }

  @keyframes skeletonPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:.75; }
  }
  .skel{ background: rgba(255,255,255,0.09); border-radius:6px; animation: skeletonPulse 1.4s ease-in-out infinite; }
  .skel-avatar{ width:36px; height:36px; border-radius:50%; flex-shrink:0; }
  .skel-line{ height:10px; border-radius:5px; }
  .skel-name{ width:110px; margin-bottom:8px; }
  .skel-stat{ width:70px; }

  /* ---------- 球員資料編輯面板：是否月繳／錢包餘額，跟人綁定不跟月份綁定 ---------- */
  .edit-static-name{ font-size:14.5px; font-weight:700; margin: 0 0 16px; }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:9px;
    padding: 10px 4px; margin-bottom:14px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    font-size:13px; cursor:pointer;
  }
  .toggle-row:active{ background: rgba(255,255,255,0.04); border-radius:10px; }
  .toggle-status{
    font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1px solid transparent; flex-shrink:0;
  }
  .wallet-balance-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 4px 16px; font-size:13px; color:var(--secondary);
  }
  .wallet-balance-amount{ font-size:16px; font-weight:800; color:var(--label); font-family: var(--sf-mono); }
  .edit-save-btn{
    width:100%; font-size:13px; font-weight:700; padding:10px 0; border-radius:12px;
    background: var(--label); color:#000; margin-top:4px;
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="list-header"><span class="t">球員清單</span><span class="n" id="rosterCount">共 0 位</span></div>
    <div class="member-list glass" id="rosterList"></div>

  </div>

  <div class="auth-overlay" id="editOverlay">
    <div class="auth-box">
      <div class="edit-title" id="editTitle">球員資料</div>

      <div class="edit-field-label">姓名</div>
      <div class="edit-static-name" id="editNameDisplay"></div>

      <div class="toggle-row" id="editMonthlyToggle" data-monthly="0">
        <span>是否月繳</span>
        <span class="toggle-status" id="editMonthlyStatus">未月繳</span>
      </div>

      <div class="wallet-balance-row">
        <span>目前餘額</span>
        <span class="wallet-balance-amount" id="editBalanceDisplay">$0</span>
      </div>

      <div class="edit-field-label">交易金額（$，扣款請輸入負數）</div>
      <input type="number" id="editTxAmount" class="edit-input" inputmode="numeric" placeholder="例如 500 或 -210">
      <div class="edit-field-label">備註（選填）</div>
      <input type="text" id="editTxNote" class="edit-input" placeholder="例如 現金儲值 / 8/13 練習費">
      <button type="button" class="edit-save-btn" id="addTxBtn">記一筆</button>

      <div class="edit-actions" style="margin-top:16px;">
        <button type="button" class="edit-cancel" id="editCancel" style="width:100%;">關閉</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="backend.js"></script>
<script src="top-nav.js"></script>
<script src="auth.js"></script>
<script src="identity-picker.js"></script>
<script src="bottom-nav.js"></script>
<script>
  let ALL_ROSTER = [];
  let editingRosterName = null;
  const PREVIEW_COUNT = 4;
  let rosterExpanded = false;

  function skeletonRowsHTML(count){
    return Array.from({ length: count }).map(()=> `
      <div class="row">
        <div class="skel skel-avatar"></div>
        <div class="row-main">
          <div class="skel skel-line skel-name"></div>
          <div class="skel skel-line skel-stat"></div>
        </div>
      </div>
    `).join('');
  }

  function loadCachedRoster(){
    const cached = getApiCache({ action:'getRoster' });
    if(cached) ALL_ROSTER = cached.roster || [];
    return !!cached;
  }

  async function refreshRoster(){
    try{
      const result = await apiGet({ action:'getRoster' });
      setApiCache({ action:'getRoster' }, result);
      ALL_ROSTER = result.roster || [];
    } catch(e){
      // 讀取失敗就沿用快取（可能是空陣列），畫面稍後仍會顯示載入失敗的空狀態
    }
  }

  // 已註冊（真人登入過）優先顯示，同一組內再照姓名排序。
  function renderRoster(){
    const list = document.getElementById('rosterList');
    if(!list) return;
    const rows = ALL_ROSTER.slice().sort((a, b)=>{
      const reg = (b.is_bound ? 1 : 0) - (a.is_bound ? 1 : 0);
      if(reg) return reg;
      return String(a.name).localeCompare(String(b.name));
    });
    document.getElementById('rosterCount').textContent = '共 ' + rows.length + ' 位';

    if(!rows.length){
      list.innerHTML = '<div class="row"><div class="row-stat">尚無球員資料</div></div>';
      return;
    }

    const visible = rosterExpanded ? rows : rows.slice(0, PREVIEW_COUNT);
    const moreBtnHtml = rows.length > PREVIEW_COUNT
      ? '<button type="button" class="more-row" id="rosterMoreBtn">' + (rosterExpanded ? '收合' : '顯示更多（還有 ' + (rows.length - PREVIEW_COUNT) + ' 位）') + '</button>'
      : '';

    const rowsHtml = visible.map(function(p){
      const registered = p.is_bound;
      const isAdmin = p.is_admin === true || p.is_admin === 'TRUE';
      const balance = Number(p.wallet_balance) || 0;
      return '<div class="row row-clickable" data-name="' + p.name + '">' +
        '<div class="row-avatar">' + avatarInitial(p.name) + '</div>' +
        '<div class="row-main">' +
          '<div class="row-top">' +
            '<div class="row-name">' + p.name + '</div>' +
            '<div class="row-tag ' + (registered ? 'good' : 'warn') + '">' + (registered ? '已註冊' : '未註冊') + '</div>' +
            (p.is_monthly_member ? '<div class="row-tag info">月繳</div>' : '') +
            (isAdmin ? '<div class="row-tag info">管理員</div>' : '') +
          '</div>' +
          '<div class="row-stat">' + (p.is_monthly_member ? '錢包餘額 $' + balance.toLocaleString() : '非月繳成員') + '</div>' +
        '</div>' +
        '<span class="chev admin-only">›</span>' +
      '</div>';
    }).join('');

    list.innerHTML = rowsHtml + moreBtnHtml;
    const moreBtn = document.getElementById('rosterMoreBtn');
    if(moreBtn) moreBtn.addEventListener('click', function(){ rosterExpanded = !rosterExpanded; renderRoster(); });

    list.querySelectorAll('.row-clickable').forEach(function(row){
      row.addEventListener('click', function(){ openRosterEdit(row.dataset.name); });
    });
  }

  function setMonthlyToggleUI(isMonthly){
    const statusEl = document.getElementById('editMonthlyStatus');
    statusEl.textContent = isMonthly ? '月繳中' : '未月繳';
    statusEl.setAttribute('style', isMonthly
      ? 'color:var(--good); border-color:rgba(127,215,154,0.4); background:var(--good-bg);'
      : 'color:var(--secondary); border-color:var(--line); background:rgba(255,255,255,0.08);');
    document.getElementById('editMonthlyToggle').dataset.monthly = isMonthly ? '1' : '0';
  }

  // 是否月繳是單純開關，點了就直接存，不用另外按儲存；失敗就把畫面
  // 切回去，不留使用者以為存到了、其實沒有的狀態。
  async function toggleMonthly(){
    if(!editingRosterName) return;
    const next = document.getElementById('editMonthlyToggle').dataset.monthly !== '1';
    setMonthlyToggleUI(next);
    try{
      await apiPost('updatePlayerProfile', { name: editingRosterName, is_monthly_member: next });
      const idx = ALL_ROSTER.findIndex(x=> x.name === editingRosterName);
      if(idx >= 0){
        ALL_ROSTER[idx] = Object.assign({}, ALL_ROSTER[idx], { is_monthly_member: next });
        setApiCache({ action:'getRoster' }, { roster: ALL_ROSTER });
      }
      renderRoster();
      showToast(next ? '已設定為月繳' : '已取消月繳');
    } catch(e){
      setMonthlyToggleUI(!next);
      showToast('更新失敗，請稍後再試');
    }
  }
  document.getElementById('editMonthlyToggle').addEventListener('click', toggleMonthly);

  function openRosterEdit(name){
    if(!document.body.classList.contains('is-admin')) return;
    const p = ALL_ROSTER.find(x=> x.name === name);
    if(!p) return;
    editingRosterName = name;
    document.getElementById('editNameDisplay').textContent = p.name;
    setMonthlyToggleUI(!!p.is_monthly_member);
    document.getElementById('editBalanceDisplay').textContent = '$' + (Number(p.wallet_balance) || 0).toLocaleString();
    document.getElementById('editTxAmount').value = '';
    document.getElementById('editTxNote').value = '';
    document.getElementById('editOverlay').classList.add('open');
  }
  function closeRosterEdit(){
    document.getElementById('editOverlay').classList.remove('open');
    editingRosterName = null;
  }

  // 錢包餘額不能直接改數字——是寫進 wallet_ledger 的一筆交易（正數儲值／
  // 負數扣款＋備註），餘額是伺服器那邊從交易明細算出來的，存好回傳新
  // 餘額後才更新畫面。
  async function addWalletTransaction(){
    if(!editingRosterName) return;
    const amount = Number(document.getElementById('editTxAmount').value);
    if(!amount){ showToast('請輸入交易金額'); return; }
    const note = document.getElementById('editTxNote').value.trim();
    const createdBy = (window.WhonextAuth && WhonextAuth.getPlayerName && WhonextAuth.getPlayerName()) || '管理員';

    const btn = document.getElementById('addTxBtn');
    btn.disabled = true;
    btn.textContent = '記錄中…';
    try{
      const result = await apiPost('addWalletLedgerEntry', { name: editingRosterName, amount: amount, note: note, created_by: createdBy });
      const newBalance = Number(result.balance) || 0;
      const idx = ALL_ROSTER.findIndex(x=> x.name === editingRosterName);
      if(idx >= 0){
        ALL_ROSTER[idx] = Object.assign({}, ALL_ROSTER[idx], { wallet_balance: newBalance });
        setApiCache({ action:'getRoster' }, { roster: ALL_ROSTER });
      }
      document.getElementById('editBalanceDisplay').textContent = '$' + newBalance.toLocaleString();
      document.getElementById('editTxAmount').value = '';
      document.getElementById('editTxNote').value = '';
      renderRoster();
      showToast('已記錄一筆交易');
    } catch(e){
      showToast('記錄失敗，請稍後再試');
    } finally{
      btn.disabled = false;
      btn.textContent = '記一筆';
    }
  }
  document.getElementById('addTxBtn').addEventListener('click', addWalletTransaction);

  document.getElementById('editCancel').addEventListener('click', closeRosterEdit);
  document.getElementById('editOverlay').addEventListener('click', e=>{
    if(e.target.id === 'editOverlay') closeRosterEdit();
  });

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  (async function init(){
    document.getElementById('rosterList').innerHTML = skeletonRowsHTML(5);
    if(loadCachedRoster()) renderRoster();
    await refreshRoster();
    renderRoster();
  })();
</script>
</body>
</html>
