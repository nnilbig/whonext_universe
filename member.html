<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>當月球員 — WHONEXT UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
  :root{
    --n-accent:#9FB3C8; --n-glow:rgba(159,179,200,0.5);
    --e-accent:#C9B79B; --e-glow:rgba(201,183,155,0.5);
    --x-accent:#B9B9BD; --x-glow:rgba(185,185,189,0.5);
    --t-accent:#E9E9E4; --t-glow:rgba(233,233,228,0.5);
    --gold:#E4C97A;

    --bg:#000000;
    --card:rgba(255,255,255,0.07);
    --card-strong:rgba(255,255,255,0.13);
    --line:rgba(255,255,255,0.14);
    --label:#F5F5F7;
    --secondary:rgba(235,235,245,0.62);
    --tertiary:rgba(235,235,245,0.32);

    --sf: -apple-system, BlinkMacSystemFont, "PingFang TC", "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    --sf-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(159,179,200,0.09), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(201,183,155,0.07), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  .navbar{
    position:sticky; top:0; z-index:30;
    padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner{
    max-width: 640px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
    padding: 10px 16px 12px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .nav-title .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary); text-transform:uppercase; }
  .nav-title h1{ margin:1px 0 0; font-size:20px; font-weight:800; letter-spacing:-.01em; }

  .wrap{ max-width: 640px; margin:0 auto; padding: 20px 16px 8px; }

  .hero{ padding: 4px 4px 22px; }
  .hero .hero-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary);
    text-transform:uppercase; margin-bottom:8px;
  }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(26px,7vw,34px); margin-bottom:8px;
  }
  .hero p{ font-size: clamp(13px,3.2vw,14.5px); color:var(--secondary); line-height:1.6; max-width:440px; }

  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin: 0 4px 20px;
  }
  .month-btn{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--gold);
  }
  .month-btn:disabled{ opacity:.25; }
  .month-label{ text-align:center; }
  .month-label .m{ margin:0; font-size:16px; font-weight:800; }
  .month-label .s{ margin:2px 0 0; font-size:10.5px; color:var(--tertiary); }

  .section-label{
    display:flex; align-items:baseline; justify-content:space-between;
    margin: 4px 4px 12px;
  }
  .section-label .t{ font-size:14px; font-weight:800; }
  .section-label .n{ font-size:11px; color:var(--tertiary); }

  .member-list{ padding: 6px 6px; margin-bottom: 22px; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding: 12px 6px;
    border-top: 1px solid var(--line);
  }
  .row:first-child{ border-top:none; }
  .row-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13.5px; font-weight:700; line-height:1;
    background: rgba(255,255,255,0.05); border:1px solid var(--line);
  }
  .row-main{ flex:1; min-width:0; }
  .row-top{ display:flex; align-items:center; gap:8px; }
  .row-name{ flex:1; font-size:14.5px; font-weight:700; line-height:1.3; min-width:0; }
  .row-tag{
    font-size:10.5px; font-weight:600; color:var(--secondary);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; flex-shrink:0;
  }
  .row-stat{ font-size:11px; color:var(--tertiary); flex-shrink:0; }

  .row-admin{
    flex-direction:row; align-items:center; justify-content:space-between; gap:10px;
    margin-top:9px; padding-top:9px; border-top:1px dashed var(--line);
  }
  .row-fee{
    font-size:11.5px; color:var(--secondary); font-family: var(--sf-mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .row-fee .fee-sep{ color:var(--tertiary); margin:0 6px; }
  .row-admin-actions{ display:flex; gap:8px; flex-shrink:0; }
  .row-btn{
    font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line); color: var(--label); background: rgba(255,255,255,0.05);
    white-space:nowrap;
  }
  .row-btn-ghost{ color: var(--secondary); background:none; }
  .row-btn-danger{ color: var(--warn, #E7A15A); border-color: rgba(231,161,90,0.4); background: rgba(231,161,90,0.1); }

  .add-row{
    width:100%; text-align:center;
    padding:14px 6px; margin-top:2px;
    border-top:1px dashed var(--line);
    font-size:13px; font-weight:700; color:var(--secondary);
  }
  .add-row:active{ color:var(--label); }

  .wordmark-footer{
    text-align:center; margin: 24px 0 6px;
    font-family:'Archivo Black', var(--sf); font-size:12px; letter-spacing:.16em; color: var(--tertiary);
  }

  /* ---------- EDIT SHEET ---------- */
  .edit-title{ font-size:16px; font-weight:800; margin-bottom:16px; color:var(--label); }
  .edit-field-label{ font-size:11px; color:var(--tertiary); margin: 0 2px 6px; }
  .edit-input{
    width:100%; box-sizing:border-box;
    font-family: var(--sf-mono); font-size:14px; color: var(--label);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; margin-bottom:14px;
  }
  .edit-input:focus{ outline:none; border-color: rgba(255,255,255,0.32); }
  .edit-input[readonly]{ color: var(--secondary); background: rgba(255,255,255,0.03); }
  .edit-actions{ display:flex; gap:8px; margin-top:2px; }
  .edit-actions button{
    flex:1; font-size:13px; font-weight:700; padding:10px 0; border-radius:12px;
  }
  .edit-cancel{ background: rgba(255,255,255,0.05); border:1px solid var(--line); color: var(--secondary); }
  .edit-save{ background: var(--label); color:#000; }
  .edit-checkbox-row{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--label); margin-bottom:16px; cursor:pointer;
  }
  .edit-checkbox-row input{ width:16px; height:16px; }

  .toast{
    position:fixed; bottom: max(24px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    max-width: calc(100vw - 32px);
    background: rgba(30,30,32,0.92);
    backdrop-filter: blur(16px);
    color: var(--label); font-size:13.5px; padding:11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px; opacity:0; transition: all .3s ease; pointer-events:none; z-index:200;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="navbar">
    <div class="nav-inner">
      <a class="back-btn" href="index.html" aria-label="返回首頁">‹</a>
      <div class="nav-title">
        <div class="eyebrow">WHONEXT</div>
        <h1>UNIVERSE</h1>
      </div>
      <div class="nav-role">
        <div class="role-toggle">
          <button class="active" data-role="player">球員</button>
          <button data-role="admin">管理員</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">WHONEXT BADMINTON CLUB</div>
      <div class="wordmark">球員名冊</div>
      <p>當月的月繳球員與臨打出席球員。</p>
    </div>

    <div class="month-nav">
      <button class="month-btn" id="prevBtn" onclick="stepMonth(-1)" aria-label="上一個月">‹</button>
      <div class="month-label">
        <p class="m" id="monthLabel">—</p>
        <p class="s">當月球員名單</p>
      </div>
      <button class="month-btn" id="nextBtn" onclick="stepMonth(1)" aria-label="下一個月">›</button>
    </div>

    <div class="section-label"><span class="t">月繳成員</span><span class="n" id="monthlyCount">共 0 位</span></div>
    <div class="member-list glass" id="monthlyList"></div>

    <div class="section-label"><span class="t">臨打球員</span><span class="n" id="dropinCount">共 0 位</span></div>
    <div class="member-list glass" id="dropinList"></div>

    <div class="wordmark-footer">WHONEXT</div>

  </div>

  <div class="auth-overlay" id="editOverlay">
    <div class="auth-box">
      <div class="edit-title" id="editTitle">月繳管理</div>

      <div class="edit-field-label">姓名</div>
      <input type="text" id="editName" class="edit-input" placeholder="輸入姓名">

      <div class="edit-field-label">單週費用（$）</div>
      <input type="number" id="editWeekly" class="edit-input" inputmode="numeric">
      <div class="edit-field-label">本月應繳金額（$）</div>
      <input type="number" id="editTotal" class="edit-input" inputmode="numeric">
      <label class="edit-checkbox-row">
        <input type="checkbox" id="editPaid">
        <span>已繳費</span>
      </label>

      <div class="edit-actions">
        <button type="button" class="edit-cancel" id="editCancel">取消</button>
        <button type="button" class="edit-save" id="editSave">儲存</button>
      </div>
    </div>
  </div>

  <div class="auth-overlay" id="dropinOverlay">
    <div class="auth-box">
      <div class="edit-title">新增臨打人員</div>

      <div class="edit-field-label">姓名</div>
      <input type="text" id="dropinName" class="edit-input" placeholder="輸入姓名">

      <div class="edit-field-label">邀請人（選填）</div>
      <select id="dropinReferrer" class="edit-input">
        <option value="">— 無 —</option>
      </select>

      <div class="edit-field-label" id="dropinWeekHint"></div>

      <div class="edit-actions">
        <button type="button" class="edit-cancel" id="dropinCancel">取消</button>
        <button type="button" class="edit-save" id="dropinSave">新增</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="backend.js"></script>
<script src="auth.js"></script>
<script>
  const DEFAULT_WEEKLY = 210;
  let currentMembers = [];
  let editingName = null;
  let sheetMode = 'edit';
  let currentMonth = null;
  let ALL_WEEKS = [];

  function splitNames(val){
    return String(val || '').split(',').map(s=>s.trim()).filter(Boolean);
  }
  function parseDropinEntry(entry){
    const m = String(entry || '').match(/^(.*?)\(([^()]+)\)$/);
    return m ? { name: m[1].trim(), referrer: m[2].trim() } : { name: String(entry || '').trim(), referrer: '' };
  }
  function formatDropinEntry(name, referrer){
    return referrer ? name + '(' + referrer + ')' : name;
  }
  function monthOfWeek(w){ return String(w.week_date || '').slice(0,7); }
  function months(){ return [...new Set(ALL_WEEKS.map(monthOfWeek))].sort(); }
  function weeksOfMonth(m){ return ALL_WEEKS.filter(w=> monthOfWeek(w) === m); }

  async function loadAllWeeks(){
    const params = { action:'getWeeks' };
    const cached = getApiCache(params);
    if(cached) ALL_WEEKS = cached.weeks || [];
    try{
      const result = await apiGet(params);
      setApiCache(params, result);
      ALL_WEEKS = result.weeks || [];
    } catch(e){
      // 讀取失敗就沿用快取（可能是空陣列），畫面稍後仍會顯示載入失敗的空狀態
    }
  }

  function attendCountsFor(m){
    const counts = {};
    weeksOfMonth(m).forEach(w=>{
      splitNames(w.present_names).forEach(n=>{ counts[n] = (counts[n] || 0) + 1; });
    });
    return counts;
  }
  function dropinCountsFor(m){
    const counts = {};
    weeksOfMonth(m).forEach(w=>{
      splitNames(w.dropin_names).forEach(entry=>{
        const name = parseDropinEntry(entry).name;
        counts[name] = (counts[name] || 0) + 1;
      });
    });
    return counts;
  }
  function dropinReferrersFor(m){
    const referrers = {};
    weeksOfMonth(m).forEach(w=>{
      splitNames(w.dropin_names).forEach(entry=>{
        const { name, referrer } = parseDropinEntry(entry);
        if(referrer && !referrers[name]) referrers[name] = referrer;
      });
    });
    return referrers;
  }

  async function loadMonthlyMembers(m){
    const params = { action:'getMembers', month:m };
    const list = document.getElementById('monthlyList');
    const cached = getApiCache(params);

    if(cached){
      currentMembers = cached.members || [];
      renderMonthlyMembers();
    } else {
      list.innerHTML = '<div class="row"><div class="row-stat">載入中…</div></div>';
    }

    try{
      const result = await apiGet(params);
      setApiCache(params, result);
      if(currentMonth !== m) return; // 使用者已經切到別的月份，結果過期就丟棄
      currentMembers = result.members || [];
      renderMonthlyMembers();
    } catch(e){
      if(!cached){
        currentMembers = [];
        list.innerHTML = '<div class="row"><div class="row-stat">載入失敗，請檢查網路連線</div></div>';
        document.getElementById('monthlyCount').textContent = '共 0 位';
      }
    }
  }

  async function removeMember(name){
    const updated = currentMembers.filter(x=>x.name !== name);
    try{
      await apiPost('saveMembers', updated);
      currentMembers = updated;
      setApiCache({ action:'getMembers', month:currentMonth }, { members:updated });
      renderMonthlyMembers();
      showToast('已將 ' + name + ' 移出月繳名單');
    } catch(e){
      showToast('移除失敗，請稍後再試');
    }
  }

  function renderMonthlyMembers(){
    document.getElementById('monthlyCount').textContent = '共 ' + currentMembers.length + ' 位';
    const attend = attendCountsFor(currentMonth);
    const list = document.getElementById('monthlyList');
    list.innerHTML = currentMembers.map(m=>{
      const total = Number(m.monthly_total_fee) || 0;
      const paid = !!m.paid;
      return `
      <div class="row">
        <div class="row-avatar">${m.name.slice(0,1)}</div>
        <div class="row-main">
          <div class="row-top">
            <div class="row-name">${m.name}</div>
            <div class="row-stat">本月出席 ${attend[m.name] || 0} 次</div>
          </div>
          <div class="row-admin admin-only flex">
            <div class="row-fee">應繳 $${total.toLocaleString()}<span class="fee-sep">・</span><span style="color:${paid ? 'var(--secondary)' : 'var(--warn,#E7A15A)'}">${paid ? '已繳費' : '未繳費'}</span></div>
            <div class="row-admin-actions">
              <button type="button" class="row-btn row-btn-ghost" data-action="edit" data-name="${m.name}">修改</button>
              <button type="button" class="row-btn row-btn-danger" data-action="remove" data-name="${m.name}">移除</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('') + `<button type="button" class="add-row admin-only" id="addMemberBtn">＋ 新增月繳成員</button>`;

    list.querySelectorAll('[data-action="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=> openEdit(btn.dataset.name));
    });
    list.querySelectorAll('[data-action="remove"]').forEach(btn=>{
      btn.addEventListener('click', ()=> removeMember(btn.dataset.name));
    });
    document.getElementById('addMemberBtn').addEventListener('click', openNew);
  }

  function openEdit(name){
    const m = currentMembers.find(x=>x.name === name);
    if(!m) return;
    sheetMode = 'edit';
    editingName = name;
    document.getElementById('editTitle').textContent = '月繳管理';
    document.getElementById('editName').value = m.name;
    document.getElementById('editWeekly').value = m.weekly_fee != null ? m.weekly_fee : DEFAULT_WEEKLY;
    document.getElementById('editTotal').value = m.monthly_total_fee != null ? m.monthly_total_fee : 0;
    document.getElementById('editPaid').checked = !!m.paid;
    document.getElementById('editSave').textContent = '儲存';
    document.getElementById('editOverlay').classList.add('open');
  }
  function openNew(){
    sheetMode = 'new';
    editingName = null;
    document.getElementById('editTitle').textContent = '新增月繳成員';
    document.getElementById('editName').value = '';
    document.getElementById('editWeekly').value = DEFAULT_WEEKLY;
    document.getElementById('editTotal').value = 0;
    document.getElementById('editPaid').checked = false;
    document.getElementById('editSave').textContent = '新增';
    document.getElementById('editOverlay').classList.add('open');
    setTimeout(()=> document.getElementById('editName').focus(), 50);
  }
  function closeEdit(){
    document.getElementById('editOverlay').classList.remove('open');
    editingName = null;
  }
  async function saveEdit(){
    const name = document.getElementById('editName').value.trim();
    if(!name){ showToast('請輸入姓名'); return; }
    if(sheetMode === 'new' && currentMembers.some(x=>x.name === name)){
      showToast('已有同名成員'); return;
    }
    const weekly = Math.max(0, Number(document.getElementById('editWeekly').value) || 0);
    const total = Math.max(0, Number(document.getElementById('editTotal').value) || 0);
    const paid = document.getElementById('editPaid').checked;
    const record = { month: currentMonth, name, weekly_fee: weekly, monthly_total_fee: total, paid };

    const updated = sheetMode === 'new'
      ? currentMembers.concat([record])
      : currentMembers.map(m=> m.name === editingName ? record : m);

    const saveBtn = document.getElementById('editSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    try{
      await apiPost('saveMembers', updated);
      currentMembers = updated;
      setApiCache({ action:'getMembers', month:currentMonth }, { members:updated });
      renderMonthlyMembers();
      closeEdit();
      showToast(sheetMode === 'new' ? ('已新增 ' + name + ' 為月繳成員') : ('已更新 ' + name + ' 的月繳資料'));
    } catch(e){
      showToast('儲存失敗，請稍後再試');
    } finally{
      saveBtn.disabled = false;
      saveBtn.textContent = sheetMode === 'new' ? '新增' : '儲存';
    }
  }

  document.getElementById('editCancel').addEventListener('click', closeEdit);
  document.getElementById('editSave').addEventListener('click', saveEdit);
  document.getElementById('editOverlay').addEventListener('click', e=>{
    if(e.target.id === 'editOverlay') closeEdit();
  });

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function renderDropinMembers(){
    const counts = dropinCountsFor(currentMonth);
    const referrers = dropinReferrersFor(currentMonth);
    const names = Object.keys(counts).sort((a,b)=> counts[b] - counts[a] || a.localeCompare(b));
    document.getElementById('dropinCount').textContent = '共 ' + names.length + ' 位';
    const list = document.getElementById('dropinList');
    const rowsHtml = names.length ? names.map(n=>`
      <div class="row">
        <div class="row-avatar">${n.slice(0,1)}</div>
        <div class="row-main">
          <div class="row-top">
            <div class="row-name">${n}</div>
            <div class="row-stat">本月出席 ${counts[n]} 次${referrers[n] ? '・由 ' + referrers[n] + ' 邀請' : ''}</div>
          </div>
        </div>
      </div>
    `).join('') : '<div class="row"><div class="row-stat">本月尚無臨打紀錄</div></div>';
    list.innerHTML = rowsHtml + `<button type="button" class="add-row admin-only" id="addDropinBtn">＋ 新增臨打人員</button>`;

    const addBtn = document.getElementById('addDropinBtn');
    if(addBtn) addBtn.addEventListener('click', openAddDropin);
  }

  function latestWeekOfMonth(m){
    const weeks = weeksOfMonth(m).slice().sort((a,b)=> String(a.week_date).localeCompare(String(b.week_date)));
    return weeks.length ? weeks[weeks.length - 1] : null;
  }

  function openAddDropin(){
    const target = latestWeekOfMonth(currentMonth);
    if(!target){
      showToast('本月尚無出席紀錄，無法新增臨打');
      return;
    }
    document.getElementById('dropinName').value = '';
    const referrerSelect = document.getElementById('dropinReferrer');
    const referrerNames = [...new Set(
      currentMembers.map(m=>m.name).concat(Object.keys(dropinCountsFor(currentMonth)))
    )].sort((a,b)=>a.localeCompare(b));
    referrerSelect.innerHTML = '<option value="">— 無 —</option>' + referrerNames.map(n=>`<option value="${n}">${n}</option>`).join('');
    document.getElementById('dropinWeekHint').textContent = '將加入 ' + target.week_date + ' 這週的紀錄';
    document.getElementById('dropinOverlay').classList.add('open');
    setTimeout(()=> document.getElementById('dropinName').focus(), 50);
  }
  function closeAddDropin(){
    document.getElementById('dropinOverlay').classList.remove('open');
  }
  async function saveAddDropin(){
    const name = document.getElementById('dropinName').value.trim();
    if(!name){ showToast('請輸入姓名'); return; }
    const referrer = document.getElementById('dropinReferrer').value;
    const target = latestWeekOfMonth(currentMonth);
    if(!target){ showToast('本月尚無出席紀錄，無法新增臨打'); return; }

    const existingEntries = splitNames(target.dropin_names);
    if(existingEntries.some(entry=> parseDropinEntry(entry).name === name)){
      showToast(name + ' 已經在這週的臨打名單裡');
      return;
    }
    const updatedWeek = Object.assign({}, target, {
      dropin_names: existingEntries.concat([formatDropinEntry(name, referrer)]).join(','),
      original_week_date: target.week_date
    });

    const saveBtn = document.getElementById('dropinSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '新增中…';
    try{
      await apiPost('saveWeek', updatedWeek);
      const idx = ALL_WEEKS.findIndex(w=> w.week_date === target.week_date);
      if(idx >= 0) ALL_WEEKS[idx] = updatedWeek;
      setApiCache({ action:'getWeeks' }, { weeks: ALL_WEEKS });
      renderDropinMembers();
      closeAddDropin();
      showToast('已新增 ' + name + ' 為臨打');
    } catch(e){
      showToast('新增失敗，請稍後再試');
    } finally{
      saveBtn.disabled = false;
      saveBtn.textContent = '新增';
    }
  }

  document.getElementById('dropinCancel').addEventListener('click', closeAddDropin);
  document.getElementById('dropinSave').addEventListener('click', saveAddDropin);
  document.getElementById('dropinOverlay').addEventListener('click', e=>{
    if(e.target.id === 'dropinOverlay') closeAddDropin();
  });

  function renderMonth(m){
    currentMonth = m;
    const ms = months();
    const idx = ms.indexOf(m);
    document.getElementById('prevBtn').disabled = idx <= 0;
    document.getElementById('nextBtn').disabled = idx >= ms.length - 1;
    document.getElementById('monthLabel').textContent = m.slice(0,4) + ' 年 ' + m.slice(5,7) + ' 月';
    renderDropinMembers();
    loadMonthlyMembers(m);
  }

  function stepMonth(dir){
    const ms = months();
    const idx = ms.indexOf(currentMonth) + dir;
    if (idx < 0 || idx >= ms.length) return;
    renderMonth(ms[idx]);
  }

  (async function init(){
    await loadAllWeeks();
    const ms = months();
    if(!ms.length){
      document.getElementById('monthLabel').textContent = '無資料';
      document.getElementById('dropinList').innerHTML = '<div class="row"><div class="row-stat">尚無出席紀錄</div></div>';
      document.getElementById('monthlyList').innerHTML = '<div class="row"><div class="row-stat">尚無出席紀錄，無法載入球員名單</div></div>';
      return;
    }
    renderMonth(ms[ms.length - 1]);
  })();
</script>
</body>
</html>
