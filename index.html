  // 背景遮罩／× 關閉才擋（手滑誤觸的主要來源）；「取消」按鈕本身字面上
  // 就是要放棄變更，不用再多問一次。
  function confirmCloseEventEdit(){
    if(isEventEditDirty() && !confirm('確定要離開嗎？未儲存的內容將會遺失')) return;
    closeEventEdit();
  }

  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function nextFridayISO(){
    const d = new Date();
    const diff = (5 - d.getDay() + 7) % 7; // 0 = 今天就是週五
    d.setDate(d.getDate() + diff);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // 從 startISO 起，找同一個月內、每隔 7 天出現一次的後續日期（同星期幾），
  // 用於「自動產生當月剩餘週次」，最多回傳 maxExtra 筆。
  function sameWeekdayDatesInMonth(startISO, maxExtra){
    const start = new Date(startISO + 'T00:00:00');
    const month = start.getMonth();
    const dates = [];
    const d = new Date(start);
    while(dates.length < maxExtra){
      d.setDate(d.getDate() + 7);
      if(d.getMonth() !== month) break;
      dates.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    return dates;
  }

  const EVENT_TEMPLATES = {
    whonext_badminton: {
      title: 'WHONEXT 羽球',
      type: 'practice',
      location: '大墩大慶羽球館',
      time: '20:00-22:00',
      capacity: 16,
      overflow_mode: 'waitlist'
    }
  };

  // 手動新增（非範本）時，出席名單從完整球員名單（getRoster：members 歷史
  // 姓名 + players 綁定狀態）勾選，預設全部未選，由發起人自己挑誰出席；
  // 也能在下面手動加訪客姓名。
  async function loadAttendRosterPicker(){
    document.getElementById('eventEditAttendLabel').textContent = '出席名單';
    document.getElementById('eventEditRecurringWrap').style.display = 'none';
    document.getElementById('eventEditRecurring').checked = false;
    document.getElementById('eventEditAttendWrap').style.display = '';
    const listEl = document.getElementById('eventEditAttendList');
    listEl.innerHTML = '<div class="signup-empty">載入球員名單中…</div>';
    try{
      const roster = await getRoster();
      const byName = new Map();
      roster.forEach(function(p){ if(p.name && !byName.has(p.name)) byName.set(p.name, p); });
      const counts = attendanceCounts();
      const people = [...byName.values()].sort(function(a, b){
        const diff = (counts[b.name] || 0) - (counts[a.name] || 0);
        return diff !== 0 ? diff : a.name.localeCompare(b.name);
      });
      listEl.innerHTML = people.length
        ? people.map(function(p, idx){ return avatarPickItemHTML(p, false, idx); }).join('')
        : '<div class="signup-empty">尚無球員名單</div>';
      if(people.length) wireAvatarPickItems('eventEditAttendList');
    } catch(e){
      listEl.innerHTML = '<div class="signup-empty">讀取球員名單失敗，請稍後再試</div>';
    }
  }

  function addGuestAttendRow(){
    const input = document.getElementById('eventEditGuestName');
    const name = input.value.trim();
    if(!name) return;
    const listEl = document.getElementById('eventEditAttendList');
    const existing = [...listEl.querySelectorAll('.avatar-pick-item')]
      .find(function(item){ return item.dataset.name === name; });
    if(existing){
      existing.dataset.present = '1';
    } else {
      const empty = listEl.querySelector('.signup-empty');
      if(empty) empty.remove();
      // 手動新增的訪客不算在出場次數排序裡，固定插在名單最前面，
      // 讓發起人一眼就找得到剛打的名字，不用往下滑去找。
      listEl.insertAdjacentHTML('afterbegin', avatarPickItemHTML(name, true, 0));
      attachAvatarPickItem(listEl.firstElementChild);
    }
    input.value = '';
    input.focus();
  }
  document.getElementById('eventEditGuestAdd').addEventListener('click', addGuestAttendRow);
  document.getElementById('eventEditGuestName').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); addGuestAttendRow(); }
  });

  // 選範本時順便把本月月繳名單抓進來排好「出席」預設值,存檔時一起送出去,
  // 不用另外再開一次匯入面板。
  async function applyEventTemplate(key){
    if(key !== 'whonext_badminton'){
      await loadAttendRosterPicker();
      return;
    }
    const tpl = EVENT_TEMPLATES[key];
    document.getElementById('eventEditTitle').value = tpl.title;
    document.getElementById('eventEditType').value = tpl.type;
    document.getElementById('eventEditLocation').value = tpl.location;
    const tplTime = parseTimeRange(tpl.time);
    setTimeSelects(tplTime.start, tplTime.end);
    document.getElementById('eventEditDate').value = nextFridayISO();
    document.getElementById('eventEditCapacity').value = tpl.capacity;
    document.getElementById('eventEditOverflow').value = tpl.overflow_mode;

    // 名單還在抓的時候先鎖住儲存鈕，避免手速太快在清單填好前就存檔，
    // 導致賽事建立成功但月繳名單沒有一起匯入、卻完全沒有提示。
    const saveBtn = document.getElementById('eventEditSave');
    saveBtn.disabled = true;
    document.getElementById('eventEditAttendWrap').style.display = '';
    document.getElementById('eventEditAttendList').innerHTML = '<div class="signup-empty">載入月繳名單中…</div>';

    try{
      const rosterResult = await apiGet({ action:'getRoster' });
      const byName = new Map();
      (rosterResult.roster || []).filter(function(p){ return p.is_monthly_member; }).forEach(function(p){
        if(p.name && !byName.has(p.name)) byName.set(p.name, p);
      });
      const counts = attendanceCounts();
      const people = [...byName.values()].sort(function(a, b){
        const diff = (counts[b.name] || 0) - (counts[a.name] || 0);
        return diff !== 0 ? diff : a.name.localeCompare(b.name);
      });
      document.getElementById('eventEditAttendLabel').textContent = '確認出席名單';
      document.getElementById('eventEditAttendList').innerHTML = people.length
        ? people.map(function(p, idx){ return avatarPickItemHTML(p, true, idx); }).join('')
        : '<div class="signup-empty">目前尚無月繳名單</div>';
      if(people.length) wireAvatarPickItems('eventEditAttendList');
      document.getElementById('eventEditAttendWrap').style.display = '';
      document.getElementById('eventEditRecurringWrap').style.display = '';
      document.getElementById('eventEditRecurring').checked = false;
    } catch(e){
      document.getElementById('eventEditAttendWrap').style.display = 'none';
      document.getElementById('eventEditRecurringWrap').style.display = 'none';
      showToast('讀取月繳名單失敗，請稍後再試');
    } finally {
      saveBtn.disabled = false;
    }
  }

  // 發起人頭像只信任「目前登入的這個人」自己的頭像 URL，不去猜別人的
  // 照片：改成別的名字（例如代別人建活動）就沒有照片來源，退回姓名縮寫；
  // 沒改名字則沿用原本存的頭像（可能是先前登入者留下的），不會平白被清空。
  function resolveHostAvatar(hostName, prevName, prevAvatar){
    if(!hostName) return '';
    if(window.WhonextAuth && hostName === WhonextAuth.getPlayerName()) return WhonextAuth.getPlayerPhoto() || '';
    if(hostName === prevName) return prevAvatar || '';
    return '';
  }

  async function saveEventEdit(){
    if(editingIndex === null) return;
    const title = document.getElementById('eventEditTitle').value.trim();
    const hostName = document.getElementById('eventEditHost').value.trim();
    const type = document.getElementById('eventEditType').value;
    const sport = document.getElementById('eventEditSport').value;
    const date = document.getElementById('eventEditDate').value;
    const timeStart = document.getElementById('eventEditTimeStart').value;
    const timeEnd = document.getElementById('eventEditTimeEnd').value;
    const location = document.getElementById('eventEditLocation').value.trim();
    const capacityRaw = document.getElementById('eventEditCapacity').value.trim();
    const overflowMode = document.getElementById('eventEditOverflow').value;
    if(!title || !date || !timeStart || !timeEnd || !location){ showToast('請填寫完整資訊'); return; }
    if(timeEnd <= timeStart){ showToast('結束時間需晚於開始時間'); return; }
    const time = timeStart + '-' + timeEnd;

    const isNew = editingIndex === 'new';
    const capacity = capacityRaw === '' ? '' : Number(capacityRaw);
    let ev, backup;
    let createdCount = 1;

    if(isNew){
      const hostAvatar = resolveHostAvatar(hostName, '', '');
      ev = { title, host_name: hostName, host_avatar: hostAvatar, type, sport, date, time, location, status:'open', capacity, overflow_mode: overflowMode };
      EVENTS.push(ev);
      if(document.getElementById('eventEditRecurringWrap').style.display !== 'none'
        && document.getElementById('eventEditRecurring').checked){
        sameWeekdayDatesInMonth(date, 3).forEach(function(d){
          EVENTS.push({ title, host_name: hostName, host_avatar: hostAvatar, type, sport, date: d, time, location, status:'open', capacity, overflow_mode: overflowMode });
          createdCount++;
        });
      }
    } else {
      ev = EVENTS[editingIndex];
      backup = Object.assign({}, ev);
      ev.host_avatar = resolveHostAvatar(hostName, ev.host_name, ev.host_avatar);
      ev.title = title;
      ev.host_name = hostName;
      ev.type = type;
      ev.sport = sport;
      ev.date = date;
      ev.time = time;
      ev.location = location;
      ev.capacity = capacity;
      ev.overflow_mode = overflowMode;
    }

    const attendNames = [];
    if(isNew){
      document.querySelectorAll('#eventEditAttendList .avatar-pick-item').forEach(function(row){
        if(row.dataset.present === '1') attendNames.push(row.dataset.name);
      });
    }

    const saveBtn = document.getElementById('eventEditSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    const ok = await persistEvents();

    if(ok){
      await refreshEvents(); // 重抓一次同步回來，更新 signup_count 等欄位
      let importMsg = '';
      if(isNew && attendNames.length){
        // 用後端這次寫入實際回傳的 events（已含新產生的 id），
        // 而不是靠「本地陣列最後一筆」去猜，避免順序假設錯了就找錯賽事。
        // 週期賽事會一次新增多筆，取陣列最後 createdCount 筆逐一匯入名單。
        const createdEvents = ok.events || [];
        const newEvents = createdEvents.slice(createdEvents.length - createdCount).filter(function(e){ return e && e.id; });
        if(newEvents.length === createdCount){
          try{
            const bulkResults = await Promise.all(newEvents.map(function(newEv){
              return apiPost('bulkSignupEvent', { event_id: newEv.id, names: attendNames });
            }));
            const failed = bulkResults.some(function(r){ return !r || !r.success; });
            if(!failed){
              const confirmed = bulkResults.reduce(function(s, r){ return s + (r.confirmed || 0); }, 0);
              const waitlist = bulkResults.reduce(function(s, r){ return s + (r.waitlist || 0); }, 0);
              const parts = [];
              if(confirmed) parts.push('確認 ' + confirmed + ' 人次');
              if(waitlist) parts.push('候補 ' + waitlist + ' 人次');
              if(parts.length) importMsg = '，' + parts.join('、');
              await refreshEvents();
            } else {
              importMsg = '，但出席名單匯入失敗，請稍後手動匯入';
            }
          } catch(e){
            importMsg = '，但出席名單匯入失敗，請稍後手動匯入';
          }
        } else {
          importMsg = '，但出席名單匯入失敗，請稍後手動匯入';
        }
      }
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      closeEventEdit();
      const createdMsg = isNew && createdCount > 1 ? ('已新增 ' + createdCount + ' 場賽事') : (isNew ? '已新增賽事' : '已更新賽事資訊');
      showToast(createdMsg + importMsg);
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      if(isNew) EVENTS.splice(EVENTS.length - createdCount, createdCount);
      else Object.assign(ev, backup);
      showToast('儲存失敗，請稍後再試');
    }
  }

  // saveEvents 是整份陣列覆寫寫回表單，所以刪除只要先把這筆從本地
  // EVENTS 陣列拿掉再存檔即可，不用另外開一個刪除用的後端 action。
  async function deleteCurrentEvent(){
    if(editingIndex === null || editingIndex === 'new') return;
    const ev = EVENTS[editingIndex];
    if(!confirm('確定要刪除「' + ev.title + '」（' + String(ev.date).slice(0, 10) + '）這場賽事嗎？此動作無法復原，已報名的人也會一起消失。')) return;

    const btn = document.getElementById('eventEditDelete');
    btn.disabled = true;
    btn.textContent = '刪除中…';

    const backup = EVENTS.slice();
    EVENTS.splice(editingIndex, 1);
    const ok = await persistEvents();

    if(ok){
      closeEventEdit();
      await refreshEvents();
      showToast('已刪除賽事');
    } else {
      EVENTS = backup;
      showToast('刪除失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '刪除賽事';
  }

  // 暫時隱藏「訪客報名」入口（球員登入／訪客報名分頁的訪客那個分頁）：
  // 只影響 UI 是否顯示分頁切換，底下的訪客報名/取消邏輯完全沒動，
  // 之後要復原只要把這個開關改回 true 就好。
  const GUEST_SIGNUP_ENABLED = false;
  let detailIndex = null;
  let signupMode = 'member';
  // 已報名者「推薦球友報名」的暫存名單：逐一輸入、加進清單，最後一次
  // 送出（每筆各自打 signupEvent，因為要帶 referrer，跟 bulkSignupEvent
  // 不同）。只在切換到不同賽事時重置，同一場重繪（例如身分變動）不清空。
  let helpGuestQueue = [];
  let helpGuestQueueIndex = null;

  function currentMemberNames(){
    const cached = getApiCache({ action:'getRoster' });
    const roster = (cached && cached.roster) || [];
    return [...new Set(roster.map(function(p){ return p.name; }).filter(Boolean))]
      .sort(function(a, b){ return a.localeCompare(b); });
  }

  // 報名頭像＋名單，欄位塞得下就直接全部列出來，不用再多一層展開收合。
  function detailAttendeesHTML(ev){
    const names = Array.isArray(ev.signup_names) ? ev.signup_names : [];
    if(!names.length) return '<div class="detail-attendees-empty">尚無人報名</div>';
    return '<div class="detail-attendees-grid">' + names.map(function(n, idx){
      return '<div class="avatar ' + AVATAR_COLORS[idx % AVATAR_COLORS.length] + '" title="' + escapeHtml(n) + '" data-name="' + escapeHtml(n) + '">' + avatarInitial(n) + '</div>';
    }).join('') + '</div>';
  }

  // 已報名時要取消，需要這筆報名紀錄的 id（getEvents 的 signup_names
  // 只是名字快照，沒有 id），開詳情時順便查一次，取消按鈕先鎖住等查到才能按。
  let detailSelfSignupId = null;
  async function loadDetailSelfSignup(ev, name){
    detailSelfSignupId = null;
    const cancelBtn = document.getElementById('signupCancelBtn');
    cancelBtn.disabled = true;
    try{
      const result = await apiGet({ action:'getEventSignups', event_id: ev.id });
      const match = (result.signups || []).find(function(s){
        return s.type === 'member' && s.member_name === name && (s.status === 'confirmed' || s.status === 'waitlist');
      });
      if(match){
        detailSelfSignupId = match.id;
        cancelBtn.disabled = false;
      }
    } catch(e){
      // 查不到就讓取消按鈕維持鎖住，避免打一個沒有 id 的取消請求
    }
  }

  // 球員模式一定要登入才能報名，而且只能替自己報名（沒有下拉選單可以
  // 選別人）；沒登入就在表單裡直接放登入流程。
  // 訪客模式不需要登入，輸入姓名＋選推薦人（目前的會員名單）就能報名。
  function signupAsSelfHTML(name){
    if(name) return '<div class="signup-self-note">以 <b>' + name + '</b> 身份報名</div>';
    return '<div id="signupWhoami"></div>';
  }

  // 點頭像顯示全名（touch 裝置沒有 hover，title 這時候看不到）。
  document.getElementById('detailAttendees').addEventListener('click', function(e){
    const el = e.target.closest('[data-name]');
    if(el) showToast(el.dataset.name);
  });

  function renderMemberFields(currentName){
    document.getElementById('signupAsSelf').innerHTML = signupAsSelfHTML(currentName);
    if(!currentName && window.WhonextIdentityPicker){
      const whoamiEl = document.getElementById('signupWhoami');
      if(whoamiEl) WhonextIdentityPicker.render(whoamiEl);
    }
  }

  // 未登入、還在「訪客報名」分頁選擇畫面時用的 tab 切換（球員報名／訪客報名）。
  // 已登入的人不會看到這組 tab，直接跳過這一步。
  function setSignupTab(mode){
    signupMode = mode;
    document.getElementById('signupModeMemberBtn').classList.toggle('active', mode === 'member');
    document.getElementById('signupModeGuestBtn').classList.toggle('active', mode === 'guest');
    document.getElementById('signupMemberFields').style.display = mode === 'member' ? '' : 'none';
    document.getElementById('signupGuestFields').style.display = mode === 'guest' ? '' : 'none';
    if(mode === 'member') renderMemberFields('');
    else document.getElementById('signupGuestName').classList.remove('invalid');
    updateSubmitGate();
  }
  document.getElementById('signupModeMemberBtn').addEventListener('click', function(){ setSignupTab('member'); });
  document.getElementById('signupModeGuestBtn').addEventListener('click', function(){ setSignupTab('guest'); });

  document.getElementById('signupEntryBtn').addEventListener('click', function(){
    document.getElementById('signupEntryRow').style.display = 'none';
    document.getElementById('eventSignupSection').style.display = '';
    document.getElementById('signupModeToggle').style.display = GUEST_SIGNUP_ENABLED ? '' : 'none';
    setSignupTab('member');
  });

  // 未登入時直接在報名表單裡放登入流程，選完身份留在原本這個賽事的
  // 詳情彈窗繼續報名，不用跳去 profile.html 再繞回來。
  // 卡片列表的「已報名／我要報名」也是靠目前綁定身分算出來的，nav 那邊
  // 登出/切換身分（不重新整理頁面）時同樣要重繪整個列表，不然會沿用
  // 切換前那個身分算出來的標籤，變成別人登出/登入都不會更新。
  document.addEventListener('whonext:playername-change', function(){
    if(detailIndex !== null) openEventDetail(detailIndex);
    if(eventsLoaded) renderEvents();
    updateEventAddBtn();
  });

  // 報名按鈕的狀態跟賽事開放狀態綁定，不要等使用者填完資料送出才用 toast
  // 告知已額滿／已截止 —— 開卡片當下就直接反映在按鈕上。
  function signupButtonMeta(statusMeta){
    if(statusMeta.cls === 'waitlist') return { disabled:false, label:'加入候補名單' };
    if(statusMeta.cls === 'full') return { disabled:true, label:'已額滿' };
    if(statusMeta.cls === 'upcoming') return { disabled:true, label:'尚未開放報名' };
    if(statusMeta.cls === 'closed' || statusMeta.cls === 'ongoing' || statusMeta.cls === 'ended'){
      return { disabled:true, label:'報名已截止' };
    }
    return { disabled:false, label:'送出報名' };
  }

  // 「送出報名」是否能按，除了賽事本身的名額/開放狀態，還要看目前選的
  // 分頁：球員模式沒登入的話，表單裡顯示的是登入/註冊流程，不是報名
  // 欄位，這時候按鈕要鎖住＋換字，不能讓人點了才用 toast 說「請先登入」。
  function updateSubmitGate(statusMeta){
    if(detailIndex === null) return;
    const submitBtn = document.getElementById('signupSubmit');
    const signupState = signupButtonMeta(statusMeta || eventStatusMeta(EVENTS[detailIndex]));
    if(signupState.disabled){
      submitBtn.style.display = '';
      submitBtn.disabled = true;
      submitBtn.textContent = signupState.label;
      submitBtn.classList.remove('verified');
      return;
    }
    const currentName = window.WhonextAuth ? WhonextAuth.getPlayerName() : '';
    if(signupMode === 'member' && !currentName){
      // 球員模式沒登入時整個按鈕藏起來（表單裡本來就顯示登入/註冊流程了，
      // 不需要一個鎖住的按鈕再提示一次要先登入）。
      submitBtn.style.display = 'none';
    } else {
      submitBtn.style.display = '';
      submitBtn.disabled = false;
      submitBtn.textContent = signupMode === 'member' ? '確認送出報名' : '送出報名';
      submitBtn.classList.toggle('verified', signupMode === 'member');
    }
  }

  function renderHelpGuestQueue(){
    const listEl = document.getElementById('helpGuestList');
    const submitBtn = document.getElementById('helpGuestSubmit');
    listEl.innerHTML = helpGuestQueue.length
      ? helpGuestQueue.map(function(name, i){
          return '<div class="guest-queue-row">' +
            '<span>' + escapeHtml(name) + '</span>' +
            '<button type="button" class="guest-queue-remove" data-remove="' + i + '">移除</button>' +
          '</div>';
        }).join('')
      : '';
    submitBtn.disabled = false;
    submitBtn.textContent = '送出球友報名';
  }

  function addHelpGuest(){
    const input = document.getElementById('helpGuestName');
    const name = input.value.trim();
    if(!name) return;
    if(helpGuestQueue.indexOf(name) === -1) helpGuestQueue.push(name);
    input.value = '';
    input.focus();
    renderHelpGuestQueue();
  }
  document.getElementById('helpGuestAdd').addEventListener('click', addHelpGuest);
  document.getElementById('helpGuestName').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); addHelpGuest(); }
  });
  document.getElementById('helpGuestList').addEventListener('click', function(e){
    const btn = e.target.closest('[data-remove]');
    if(!btn) return;
    helpGuestQueue.splice(Number(btn.dataset.remove), 1);
    renderHelpGuestQueue();
  });

  // 逐一 signupEvent（而不是 bulkSignupEvent）是因為推薦球友報名要帶
  // referrer（自動 = 自己），bulkSignupEvent 只認 member 型別、沒有
  // referrer 欄位，不適合這裡的訪客報名情境。
  async function submitHelpGuests(){
    if(detailIndex === null) return;
    // 沒點過「+」也能直接送出：輸入框裡還沒加進名單的名字，送出時
    // 自動一併算進去，不用強迫使用者先點「+」才能送。
    const input = document.getElementById('helpGuestName');
    const pending = input.value.trim();
    if(pending && helpGuestQueue.indexOf(pending) === -1) helpGuestQueue.push(pending);
    if(!helpGuestQueue.length){ showToast('請輸入球友姓名'); return; }
    input.value = '';
    const ev = EVENTS[detailIndex];
    const currentName = window.WhonextAuth ? WhonextAuth.getPlayerName() : '';
    const btn = document.getElementById('helpGuestSubmit');
    btn.disabled = true;
    btn.textContent = '送出中…';
    try{
      const results = await Promise.all(helpGuestQueue.map(function(name){
        return apiPost('signupEvent', { event_id: ev.id, type:'guest', guest_name: name, referrer: currentName });
      }));
      const okCount = results.filter(function(r){ return r && r.success; }).length;
      const failCount = results.length - okCount;
      showToast(okCount
        ? '已推薦 ' + okCount + ' 位球友報名' + (failCount ? '，' + failCount + ' 位失敗' : '')
        : '推薦球友報名失敗，請稍後再試');
      helpGuestQueue = [];
      await refreshEvents();
      if(detailIndex !== null) openEventDetail(detailIndex);
      return;
    } catch(e){
      showToast('推薦球友報名失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '送出球友報名';
  }
  document.getElementById('helpGuestSubmit').addEventListener('click', submitHelpGuests);

  // 列出「這個人推薦報名」的球友，讓已報名的球員自己就能取消推薦報名的
  // 球友，不用麻煩管理員。只認 type:'guest' 且 referrer 是自己，不會動到
  // 任何球員（member 型別）的報名紀錄。
  async function loadHelpGuestSignups(ev, currentName){
    const section = document.getElementById('myReferredGuestsSection');
    const listEl = document.getElementById('helpGuestReferredList');
    section.style.display = '';
    listEl.innerHTML = '<div class="signup-empty">載入中…</div>';
    try{
      const result = await apiGet({ action:'getEventSignups', event_id: ev.id });
      const referred = (result.signups || []).filter(function(s){
        return s.type === 'guest' && s.referrer === currentName && (s.status === 'confirmed' || s.status === 'waitlist');
      });
      // 這場沒有推薦任何球友的話整塊收起來，不留一個空的「你推薦報名的
      // 球友」標題卡在那裡（尤其是自己沒報名這場時，不然畫面會很空洞）。
      section.style.display = referred.length ? '' : 'none';
      listEl.innerHTML = referred.length
        ? referred.map(function(s){
            return '<div class="guest-queue-row">' +
              '<span>' + escapeHtml(s.guest_name) + (s.status === 'waitlist' ? '（候補）' : '') + '</span>' +
              '<button type="button" class="guest-queue-remove" data-cancel-id="' + escapeHtml(s.id) + '">取消</button>' +
            '</div>';
          }).join('')
        : '';
    } catch(e){
      section.style.display = '';
      listEl.innerHTML = '<div class="signup-empty">讀取失敗，請稍後再試</div>';
    }
  }
  document.getElementById('helpGuestReferredList').addEventListener('click', async function(e){
    const btn = e.target.closest('[data-cancel-id]');
    if(!btn || detailIndex === null) return;
    btn.disabled = true;
    btn.textContent = '取消中…';
    try{
      const result = await apiPost('cancelSignup', { id: btn.dataset.cancelId });
      if(result && result.success){
        showToast('已取消該球友報名');
        await refreshEvents();
        if(detailIndex !== null) openEventDetail(detailIndex);
        return;
      }
      showToast('取消失敗，請稍後再試');
    } catch(err){
      showToast('取消失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '取消';
  });

  // ---------------------------------------------------------------
  // 管理員：卡片點進去直接管理這場的報名名單（取消任何人／幫球員手動
  // 報名），跟球員自己的報名流程完全分開，見 openEventDetail。
  // ---------------------------------------------------------------
  // 已報名名單改用跟「建立活動」出席名單同一份頭像格點選元件
  // （avatarPickItemHTML／attachAvatarPickItem／wireAvatarPickItems），
  // 點頭像直接切換：從沒報名點成報名＝立刻幫他報名，反過來點掉＝立刻
  // 取消。跟建立活動不同的是這裡管理的是已經存在的賽事，沒有「存檔時
  // 才一次送出」這個緩衝，每次點擊都要馬上打對應的 API，失敗要把頭像
  // 點回原本的狀態，不能留在使用者剛點出來、但後端其實沒成功的樣子。
  // adminSignupMap 記每個目前有效報名的人對應的 signup id／type，取消
  // 要用 id，補報名時如果他本來是用訪客身分報的則沿用 type:'guest'。
  let adminSignupMap = {};
  async function loadAdminSignupList(ev){
    const listEl = document.getElementById('adminSignupList');
    listEl.innerHTML = '<div class="signup-empty">載入中…</div>';
    try{
      const [roster, result] = await Promise.all([
        getRoster(),
        apiGet({ action:'getEventSignups', event_id: ev.id })
      ]);
      const active = (result.signups || []).filter(function(s){ return s.status === 'confirmed' || s.status === 'waitlist'; });
      adminSignupMap = {};
      active.forEach(function(s){
        const name = s.type === 'guest' ? s.guest_name : s.member_name;
        if(name) adminSignupMap[name] = { id: s.id, type: s.type, status: s.status };
      });

      // 名單來源＝完整球員名單 ∪ 目前有效報名（含不在球員名單裡的訪客），
      // 不然訪客報名點不到、也取消不了。
      const byName = new Map();
      roster.forEach(function(p){ if(p.name && !byName.has(p.name)) byName.set(p.name, p); });
      active.forEach(function(s){
        const name = s.type === 'guest' ? s.guest_name : s.member_name;
        if(name && !byName.has(name)) byName.set(name, name);
      });

      const counts = attendanceCounts();
      const people = [...byName.values()].sort(function(a, b){
        const an = (a && typeof a === 'object') ? a.name : a;
        const bn = (b && typeof b === 'object') ? b.name : b;
        const diff = (counts[bn] || 0) - (counts[an] || 0);
        return diff !== 0 ? diff : an.localeCompare(bn);
      });

      listEl.innerHTML = people.length
        ? people.map(function(p, idx){
            const name = (p && typeof p === 'object') ? p.name : p;
            const entry = adminSignupMap[name];
            const tag = entry && entry.status === 'waitlist' ? '候補' : '';
            return avatarPickItemHTML(p, !!entry, idx, tag);
          }).join('')
        : '<div class="signup-empty">尚無球員名單</div>';
      if(people.length) wireAvatarPickItems('adminSignupList', handleAdminSignupToggle);
    } catch(e){
      listEl.innerHTML = '<div class="signup-empty">讀取失敗，請稍後再試</div>';
    }
  }

  async function handleAdminSignupToggle(item, present){
    if(detailIndex === null) return;
    const ev = EVENTS[detailIndex];
    const name = item.dataset.name;
    item.style.pointerEvents = 'none';
    try{
      if(present){
        const asGuest = adminSignupMap[name] && adminSignupMap[name].type === 'guest';
        const payload = asGuest
          ? { event_id: ev.id, type:'guest', guest_name: name }
          : { event_id: ev.id, type:'member', member_name: name };
        const result = await apiPost('signupEvent', payload);
        if(!(result && result.success)){
          item.dataset.present = '0';
          showToast(SIGNUP_FAIL_MSG[result && result.reason] || '報名失敗，請稍後再試');
          item.style.pointerEvents = '';
          return;
        }
        showToast(result.status === 'waitlist' ? '已加入候補名單' : '已幫 ' + name + ' 報名');
      } else {
        const existing = adminSignupMap[name];
        if(!existing){ item.dataset.present = '1'; item.style.pointerEvents = ''; return; }
        const result = await apiPost('cancelSignup', { id: existing.id });
        if(!(result && result.success)){
          item.dataset.present = '1';
          showToast('取消失敗，請稍後再試');
          item.style.pointerEvents = '';
          return;
        }
        showToast('已取消報名');
      }
      await refreshEvents();
      if(detailIndex !== null) openEventDetail(detailIndex);
    } catch(e){
      item.dataset.present = present ? '0' : '1';
      showToast('操作失敗，請稍後再試');
      item.style.pointerEvents = '';
    }
  }

  async function loadAdminAddPlayerOptions(){
    const roster = await getRoster();
    const names = [...new Set(roster.map(function(p){ return p.name; }).filter(Boolean))]
      .sort(function(a, b){ return a.localeCompare(b); });
    document.getElementById('adminAddPlayerList').innerHTML = names.map(function(n){ return '<option value="' + n + '">'; }).join('');
  }

  async function adminAddPlayerSignup(){
    if(detailIndex === null) return;
    const input = document.getElementById('adminAddPlayerName');
    const name = input.value.trim();
    if(!name) return;
    const ev = EVENTS[detailIndex];
    const btn = document.getElementById('adminAddPlayerBtn');
    btn.disabled = true;
    btn.textContent = '新增中…';
    try{
      const result = await apiPost('signupEvent', { event_id: ev.id, type:'member', member_name: name });
      if(result && result.success){
        showToast(result.status === 'waitlist' ? '已加入候補名單' : '已幫 ' + name + ' 報名');
        input.value = '';
        await refreshEvents();
        if(detailIndex !== null) openEventDetail(detailIndex);
        return;
      }
      showToast(SIGNUP_FAIL_MSG[result && result.reason] || '報名失敗，請稍後再試');
    } catch(e){
      showToast('報名失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '新增';
  }
  document.getElementById('adminAddPlayerBtn').addEventListener('click', adminAddPlayerSignup);
  document.getElementById('adminAddPlayerName').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); adminAddPlayerSignup(); }
  });

  // 訪客報名不用登入，取消時只能靠自己輸入姓名去比對，安全起見一定要
  // 只認 type:'guest' 的紀錄——不然有人輸入某個球員的姓名，就能把
  // 那個球員（member 型別）已經確認的報名取消掉，這是絕對不能發生的。
  async function cancelGuestByName(){
    const nameInput = document.getElementById('signupGuestName');
    const name = nameInput.value.trim();
    if(!name){
      nameInput.classList.add('invalid');
      nameInput.focus();
      showToast('請先輸入姓名');
      return;
    }
    nameInput.classList.remove('invalid');
    if(detailIndex === null) return;
    const ev = EVENTS[detailIndex];
    const btn = document.getElementById('signupGuestCancelBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '查詢中…';
    try{
      const result = await apiGet({ action:'getEventSignups', event_id: ev.id });
      const match = (result.signups || []).find(function(s){
        return s.type === 'guest' && s.guest_name === name && (s.status === 'confirmed' || s.status === 'waitlist');
      });
      if(!match){
        showToast('找不到這個姓名的訪客報名紀錄');
      } else {
        const cancelResult = await apiPost('cancelSignup', { id: match.id });
        if(cancelResult && cancelResult.success){
          showToast('已取消報名');
          nameInput.value = '';
          await refreshEvents();
          if(detailIndex !== null) openEventDetail(detailIndex);
          return;
        }
        showToast('取消失敗，請稍後再試');
      }
    } catch(e){
      showToast('取消失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = originalText;
  }
  document.getElementById('signupGuestCancelBtn').addEventListener('click', cancelGuestByName);

  function openEventDetail(index, skipEntry){
    detailIndex = index;
    const ev = EVENTS[index];
    const statusMeta = eventStatusMeta(ev);
    document.getElementById('detailTitle').textContent = ev.title;
    document.getElementById('detailMeta').textContent = (ev.type ? eventTypeLabel(ev.type) + '　' : '') + String(ev.date).slice(0, 10) + '　' + ev.time + '　' + ev.location;
    document.getElementById('detailProgress').innerHTML = progressHTML(ev, statusMeta);
    document.getElementById('detailAttendees').innerHTML = detailAttendeesHTML(ev);

    // 管理員點卡片是管理報名名單（取消/幫球員報名），不走下面球員自己
    // 報名的步驟，兩邊完全分開顯示。
    if(document.body.classList.contains('is-admin')){
      document.getElementById('selfSignedSection').style.display = 'none';
      document.getElementById('signupEntryRow').style.display = 'none';
      document.getElementById('eventSignupSection').style.display = 'none';
      document.getElementById('adminManageSection').style.display = '';
      document.getElementById('adminAddPlayerName').value = '';
      document.getElementById('myReferredGuestsSection').style.display = 'none';
      loadAdminSignupList(ev);
      loadAdminAddPlayerOptions();
      document.getElementById('eventDetailOverlay').classList.add('open');
      return;
    }
    document.getElementById('adminManageSection').style.display = 'none';

    const currentName = window.WhonextAuth ? WhonextAuth.getPlayerName() : '';
    document.getElementById('signupGuestName').value = '';
    document.getElementById('signupGuestName').classList.remove('invalid');
    const signupState = signupButtonMeta(statusMeta);
    const entryBtn = document.getElementById('signupEntryBtn');
    entryBtn.disabled = signupState.disabled;
    entryBtn.textContent = signupState.disabled ? signupState.label : '我要報名';

    // 推薦人（訪客模式）預設可以從目前的會員名單挑，但清單裡沒有的人
    // 也能直接輸入（用 input+datalist，不是只能選的下拉選單）。
    document.getElementById('signupReferrerList').innerHTML = currentMemberNames().map(function(n){
      return '<option value="' + n + '">';
    }).join('');
    document.getElementById('signupReferrer').value = currentName || '';

    const selfSigned = currentPlayerSignedUp(ev);
    document.getElementById('selfSignedSection').style.display = selfSigned ? '' : 'none';
    // 「你推薦報名的球友」跟自己這場有沒有報名是兩件事——即使沒報名
    // （或報名後取消了），只要之前推薦過球友，還是要看得到、能取消，
    // 先收起來，下面兩個「已登入」分支各自呼叫 loadHelpGuestSignups
    // 決定要不要打開（沒有登入就沒有身份可以比對 referrer，維持收起）。
    document.getElementById('myReferredGuestsSection').style.display = 'none';

    if(selfSigned){
      // 每次重新打開都把按鈕文字重置成「取消報名」，不要沿用上一次
      // 點擊留下的「取消中…」，查到 id 前先鎖住避免打沒有 id 的請求。
      document.getElementById('signupEntryRow').style.display = 'none';
      document.getElementById('eventSignupSection').style.display = 'none';
      const cancelBtn = document.getElementById('signupCancelBtn');
      cancelBtn.textContent = '取消報名';
      cancelBtn.disabled = true;
      loadDetailSelfSignup(ev, currentName);
      if(helpGuestQueueIndex !== index){ helpGuestQueue = []; helpGuestQueueIndex = index; }
      document.getElementById('helpGuestName').value = '';
      renderHelpGuestQueue();
      loadHelpGuestSignups(ev, currentName);
    } else if(currentName){
      // 已登入、還沒報名這場：跳過選按鈕的步驟，直接顯示「以 X 身份報名」
      // ＋送出按鈕，開卡片後點一下就能報名完成。
      signupMode = 'member';
      document.getElementById('signupEntryRow').style.display = 'none';
      document.getElementById('eventSignupSection').style.display = '';
      document.getElementById('signupModeToggle').style.display = 'none';
      document.getElementById('signupMemberFields').style.display = '';
      document.getElementById('signupGuestFields').style.display = 'none';
      renderMemberFields(currentName);
      loadHelpGuestSignups(ev, currentName);
    } else if(skipEntry && !signupState.disabled){
      // 從卡片上的「我要報名」標籤點進來：跳過中間的入口按鈕，
      // 直接展開球員報名／訪客報名的選擇。
      document.getElementById('signupEntryRow').style.display = 'none';
      document.getElementById('eventSignupSection').style.display = '';
      document.getElementById('signupModeToggle').style.display = GUEST_SIGNUP_ENABLED ? '' : 'none';
      setSignupTab('member');
    } else {
      // 未登入：先顯示單一「我要報名」按鈕，點了才展開球員報名／訪客報名的選擇。
      document.getElementById('signupEntryRow').style.display = '';
      document.getElementById('eventSignupSection').style.display = 'none';
    }

    updateSubmitGate(statusMeta);
    document.getElementById('eventDetailOverlay').classList.add('open');
  }

  function closeEventDetail(){
    document.getElementById('eventDetailOverlay').classList.remove('open');
    detailIndex = null;
  }

  async function cancelCurrentSignup(){
    if(!detailSelfSignupId) return;
    const btn = document.getElementById('signupCancelBtn');
    btn.disabled = true;
    btn.textContent = '取消中…';
    try{
      const result = await apiPost('cancelSignup', { id: detailSelfSignupId });
      if(result && result.success){
        showToast('已取消報名');
        await refreshEvents();
        if(detailIndex !== null) openEventDetail(detailIndex);
        return;
      }
      showToast('取消失敗，請稍後再試');
    } catch(e){
      showToast('取消失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '取消報名';
  }
  document.getElementById('signupCancelBtn').addEventListener('click', cancelCurrentSignup);

  const SIGNUP_FAIL_MSG = {
    full: '報名已額滿',
    duplicate: '您已經報名過了',
    event_not_found: '找不到這筆賽事',
    not_open: '報名尚未開放',
    closed: '報名已截止'
  };

  async function submitSignup(){
    if(detailIndex === null) return;
    const ev = EVENTS[detailIndex];
    const payload = { event_id: ev.id, type: signupMode };
    if(signupMode === 'member'){
      const name = window.WhonextAuth ? WhonextAuth.getPlayerName() : '';
      if(!name){ showToast('請先登入才能以球員身份報名'); return; }
      payload.member_name = name;
    } else {
      const guestNameInput = document.getElementById('signupGuestName');
      const guestName = guestNameInput.value.trim();
      if(!guestName){
        guestNameInput.classList.add('invalid');
        guestNameInput.focus();
        showToast('請輸入姓名');
        return;
      }
      guestNameInput.classList.remove('invalid');
      payload.guest_name = guestName;
      payload.referrer = document.getElementById('signupReferrer').value;
    }

    const btn = document.getElementById('signupSubmit');
    btn.disabled = true;
    btn.textContent = '送出中…';
    try{
      const result = await apiPost('signupEvent', payload);
      if(result.success){
        showToast(result.status === 'waitlist' ? '已加入候補名單' : '已報名成功');
        const signedUpIndex = detailIndex;
        await refreshEvents();
        if(signedUpIndex !== null) openEventDetail(signedUpIndex);
        return;
      } else {
        showToast(SIGNUP_FAIL_MSG[result.reason] || '報名失敗，請稍後再試');
      }
    } catch(e){
      showToast('報名失敗，請稍後再試');
    }
    const signupState = signupButtonMeta(eventStatusMeta(ev));
    btn.disabled = signupState.disabled;
    btn.textContent = signupState.label;
  }

  function currentCalendarMonth(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function importStatusStyle(present){
    return present
      ? 'color:var(--warn); background:rgba(231,161,90,0.15);'
      : 'color:var(--good); background:rgba(127,215,154,0.15);';
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // present 預設 true（月繳名單匯入情境：預設出席，點掉才變未選）；
  // 球員名單挑選／手動新增訪客則明確傳 present，各自符合預期的預設值。
  function importRowHTML(name, present){
    const isPresent = present !== false;
    const safeName = escapeHtml(name);
    return '<div class="import-toggle-row" data-name="' + safeName + '" data-present="' + (isPresent ? '1' : '0') + '">' +
      '<span>' + safeName + '</span>' +
      '<span class="import-toggle-status" style="' + importStatusStyle(isPresent) + '">' + (isPresent ? '出席' : '未選') + '</span>' +
    '</div>';
  }

  function attachToggleRow(row){
    row.addEventListener('click', function(){
      const nowPresent = row.dataset.present !== '1';
      row.dataset.present = nowPresent ? '1' : '0';
      const statusEl = row.querySelector('.import-toggle-status');
      statusEl.textContent = nowPresent ? '出席' : '未選';
      statusEl.setAttribute('style', importStatusStyle(nowPresent));
    });
  }

  function wireImportToggleRows(containerId){
    document.querySelectorAll('#' + containerId + ' .import-toggle-row').forEach(attachToggleRow);
  }

  // 出席名單挑人改成頭像＋名字點選（原本是文字列勾選）。person 可以是
  // 純姓名字串（手動新增的訪客，沒有頭像），也可以是 getRoster 回來的
  // 物件（有 avatar_url 就顯示真人頭像，沒有就退回姓名縮寫色塊）。
  // tag 是可選的小標籤（目前只有管理員名單的「候補」在用），建立活動
  // 那邊的呼叫方沒有傳就不會印出來，行為不變。
  function avatarPickItemHTML(person, present, idx, tag){
    const isObj = person && typeof person === 'object';
    const name = isObj ? person.name : person;
    const avatarUrl = isObj ? person.avatar_url : '';
    const isPresent = present !== false;
    const safeName = escapeHtml(name);
    const colorClass = AVATAR_COLORS[(idx || 0) % AVATAR_COLORS.length];
    const avatarInner = avatarUrl
      ? '<img src="' + escapeHtml(avatarUrl) + '" referrerpolicy="no-referrer" alt="">'
      : avatarInitial(name);
    return '<div class="avatar-pick-item" data-name="' + safeName + '" data-present="' + (isPresent ? '1' : '0') + '">' +
      '<div class="avatar-pick-avatar' + (avatarUrl ? '' : ' ' + colorClass) + '">' + avatarInner +
        '<span class="avatar-pick-badge">✓</span>' +
      '</div>' +
      '<div class="avatar-pick-name">' + safeName + (tag ? ' <span class="avatar-pick-tag">' + escapeHtml(tag) + '</span>' : '') + '</div>' +
    '</div>';
  }

  // onToggle 是可選的非同步 callback，管理員名單（既有賽事）點一下要
  // 立刻打 API；建立活動那邊沒有傳，維持原本「只改本地 dataset，存檔
  // 時才一次讀出來」的行為。
  function attachAvatarPickItem(item, onToggle){
    item.addEventListener('click', function(){
      const next = item.dataset.present === '1' ? '0' : '1';
      item.dataset.present = next;
      if(onToggle) onToggle(item, next === '1');
    });
  }

  function wireAvatarPickItems(containerId, onToggle){
    document.querySelectorAll('#' + containerId + ' .avatar-pick-item').forEach(function(item){
      attachAvatarPickItem(item, onToggle);
    });
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  document.getElementById('eventAddBtn').addEventListener('click', openEventCreate);
  updateEventAddBtn();
  // 管理員視角切換（不重新整理頁面）也要跟著更新按鈕顯示，不能只靠
  // playername-change（那個只在登入/登出/換人時觸發）。
  new MutationObserver(updateEventAddBtn).observe(document.body, { attributes:true, attributeFilter:['class'] });

  document.getElementById('eventEditTemplate').addEventListener('change', function(){
    applyEventTemplate(this.value);
  });
  document.getElementById('eventEditCancel').addEventListener('click', closeEventEdit);
  document.getElementById('eventEditSave').addEventListener('click', saveEventEdit);
  document.getElementById('eventEditDelete').addEventListener('click', deleteCurrentEvent);
  document.getElementById('eventEditCloseBtn').addEventListener('click', confirmCloseEventEdit);
  document.getElementById('eventEditOverlay').addEventListener('click', function(e){
    if(e.target.id === 'eventEditOverlay') confirmCloseEventEdit();
  });

  document.getElementById('signupSubmit').addEventListener('click', submitSignup);
  document.getElementById('eventDetailCloseBtn').addEventListener('click', closeEventDetail);
  document.getElementById('eventDetailOverlay').addEventListener('click', function(e){
    if(e.target.id === 'eventDetailOverlay') closeEventDetail();
  });

  // 遮罩至少停留 1.5 秒再淡出，快取秒開時也不會一閃而過。
  const BRAND_MASK_MIN_MS = 1500;
  const brandMaskShownAt = Date.now();
  function hideBrandMask(){
    const mask = document.getElementById('brandMask');
    if(!mask || mask.classList.contains('hide') || mask.dataset.hiding) return;
    mask.dataset.hiding = '1';
    const wait = Math.max(0, BRAND_MASK_MIN_MS - (Date.now() - brandMaskShownAt));
    setTimeout(function(){
      mask.classList.add('hide');
      if(window.WhonextIntroModal) WhonextIntroModal.maybeShow();
      setTimeout(function(){ mask.remove(); }, 400);
    }, wait);
  }

  (async function initialLoad(){
    const hadCache = loadCachedEvents();
    loadCachedWeeksForEvents();
    renderEvents();
    if(hadCache) hideBrandMask();

    await refreshEvents();
    hideBrandMask();
  })();

  // 賽事是首頁第一眼看到的內容，先讓它的請求送出去，
  // 再暖機其他子頁面用的資料，避免跟 GAS 執行配額擠在一起拖慢賽事回應。
  // getWeeks 額外拿來算「進行中／已結束」賽事卡片的實際出席人數，所以讀完要重繪一次。
  refreshWeeksForEvents();
  apiPrefetch({ action:'getRoster' });
</script>
</body>
