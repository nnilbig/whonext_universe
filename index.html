<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WHONEXT UNIVERSE — 首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="top-nav.css">
<link rel="stylesheet" href="bottom-nav.css">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(159,179,200,0.09), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(228,201,122,0.06), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  /* ---------- BRAND MASK ---------- */
  .brand-mask{
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(159,179,200,0.09), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(228,201,122,0.06), transparent 50%),
      var(--bg);
    transition: opacity .4s ease;
  }
  .brand-mask.hide{ opacity:0; pointer-events:none; }
  .brand-mask-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--gold);
    text-transform:uppercase; margin-bottom:10px;
  }
  .brand-mask-title{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(30px,8vw,40px);
  }
  .wrap{
    max-width: 640px; margin:0 auto; width:100%;
    padding: 20px 16px calc(96px + env(safe-area-inset-bottom));
  }

  /* ---------- HERO ---------- */
  .hero{ padding: 2px 4px 10px; }
  .hero .hero-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--gold);
    text-transform:uppercase; margin-bottom:10px;
  }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(26px,7vw,34px); margin-bottom:8px;
  }

  /* ---------- EVENTS ---------- */
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.18em; color:var(--tertiary);
    text-transform:uppercase; margin: 0 4px 12px;
  }
  .section-label-row{ display:flex; align-items:center; justify-content:space-between; margin: 0 4px 12px; }
  .section-label-row .section-label{ margin:0; }
  .event-add-btn{
    font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px;
    border:1px solid var(--line); color: var(--secondary); background: rgba(255,255,255,0.03);
  }

  .event-tabs{ display:flex; gap:6px; }
  .event-tab{
    font-size:12px; font-weight:700; padding:6px 13px; border-radius:999px;
    border:1px solid var(--line); color: var(--tertiary); background: rgba(255,255,255,0.03);
  }
  .event-tab.active{ color:#000; background: var(--label); border-color: var(--label); }

  .event-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:26px; }
  .event-card{
    display:flex; gap:14px; padding:16px;
  }
  /* 賽事／企劃／練習用很淡的底色漸層做低調區分，不搶走狀態標籤的視覺重點。 */
  .event-card.et-practice{ background: linear-gradient(180deg, rgba(159,179,200,0.10), var(--card)); }
  .event-card.et-project{ background: linear-gradient(180deg, rgba(201,183,155,0.10), var(--card)); }
  .event-card.et-match{ background: linear-gradient(180deg, rgba(242,196,85,0.12), var(--card)); }
  .event-date{
    width:52px; flex-shrink:0; text-align:center;
    padding: 8px 0; border-radius:14px;
    background: rgba(255,255,255,0.05); border:1px solid var(--line);
    font-family: var(--sf-mono);
  }
  .event-date .ed-month{ font-size:10px; font-weight:700; color:var(--tertiary); letter-spacing:.05em; }
  .event-date .ed-day{ font-size:22px; font-weight:800; line-height:1.2; }
  .event-date .ed-weekday{ font-size:10px; color:var(--secondary); }

  .event-body{ flex:1; min-width:0; }
  .event-title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .event-title{ font-size:15px; font-weight:800; letter-spacing:-.005em; }
  .event-title-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .event-status{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; flex-shrink:0; white-space:nowrap;
    cursor:default;
  }
  .event-status.upcoming{ background: rgba(255,255,255,0.08); color: var(--secondary); }
  .event-status.open{ background: rgba(127,215,154,0.15); color: var(--good); }
  .event-status.waitlist{ background: rgba(228,201,122,0.15); color: var(--gold); }
  .event-status.full{ background: rgba(231,161,90,0.15); color: var(--warn); }
  .event-status.closed{ background: rgba(255,255,255,0.05); color: var(--tertiary); }
  .event-status.ongoing{ background: rgba(159,179,200,0.18); color: var(--n-accent); }
  .event-status.ended{ background: rgba(255,255,255,0.05); color: var(--tertiary); }
  body.is-admin .event-status{ cursor:pointer; box-shadow: inset 0 0 0 1px currentColor; }
  body.is-admin .event-status:active{ opacity:.7; }
  .event-self-tag{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; flex-shrink:0; white-space:nowrap;
    color: var(--gold); background: var(--gold-bg); border:1px solid rgba(242,196,85,0.35);
  }
  .event-meta{ font-size:12.5px; color:var(--secondary); line-height:1.5; font-family: var(--sf-mono); }
  .event-meta .sep{ color:var(--tertiary); margin:0 6px; }

  .event-edit-btn{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line); color: var(--secondary); background: rgba(255,255,255,0.03);
  }

  .event-card{ cursor:pointer; }

  .event-progress{ margin-top:10px; }
  .event-progress-track{
    height:5px; border-radius:999px; background: rgba(255,255,255,0.08); overflow:hidden;
  }
  .event-progress-fill{
    height:100%; border-radius:999px; background: var(--gold); transition: width .2s ease;
  }
  .event-progress-fill.full{ background: var(--warn); }
  .event-progress-label{
    margin-top:5px; font-size:11px; color:var(--tertiary); font-family: var(--sf-mono);
  }

  .event-empty{
    display:flex; align-items:center; justify-content:center;
    min-height:100px; padding:16px 18px; text-align:center; font-size:13px; color:var(--tertiary);
  }

  .event-attendees{ display:flex; align-items:center; gap:8px; margin-top:10px; min-height:26px; }
  .avatar-host{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:800; color:#000;
    background: var(--gold); border:2px solid #0a0a0a;
  }
  .event-host-sep{ width:1px; height:14px; background:var(--line); flex-shrink:0; }
  .avatar-stack{ display:flex; }
  .avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:800; color:#000;
    border:2px solid #0a0a0a; margin-left:-8px;
  }
  .avatar:first-child{ margin-left:0; }
  .avatar.n{ background: var(--n-accent); }
  .avatar.e{ background: var(--e-accent); }
  .avatar.x{ background: var(--x-accent); }
  .avatar.t{ background: var(--t-accent); }
  .avatar-more{
    width:26px; height:26px; border-radius:50%; flex-shrink:0; margin-left:-8px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:var(--secondary);
    background: rgba(255,255,255,0.08); border:2px solid #0a0a0a;
  }
  .event-attendees-label{ font-size:11.5px; color:var(--tertiary); font-family: var(--sf-mono); }

  /* ---------- EDIT SHEET ---------- */
  .edit-title{ font-size:16px; font-weight:800; margin-bottom:16px; color:var(--label); }
  .edit-field-label{ font-size:11px; color:var(--tertiary); margin: 0 2px 6px; }
  .edit-input{
    width:100%; box-sizing:border-box;
    font-family: var(--sf-mono); font-size:16px; color: var(--label);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; margin-bottom:14px;
  }
  .edit-input:focus{ outline:none; border-color: rgba(255,255,255,0.32); }
  select.edit-input{ color: var(--label); }
  select.edit-input option{ color: var(--label); background:#1c1c1e; }
  .time-range-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .time-range-row .edit-input{ flex:1; min-width:0; margin-bottom:0; }
  .time-range-sep{ color:var(--tertiary); flex-shrink:0; }
  .edit-actions{ display:flex; gap:8px; margin-top:2px; }
  .edit-actions button{
    flex:1; font-size:13px; font-weight:700; padding:10px 0; border-radius:12px;
  }
  .edit-cancel{ background: rgba(255,255,255,0.05); border:1px solid var(--line); color: var(--secondary); }
  .edit-save{ background: var(--label); color:#000; }

  /* ---------- EVENT DETAIL / SIGNUP ---------- */
  /* 固定高度先把文字跟報名欄位的空間留好，展開表單時內容不會整個跳動，
     「我要報名」按鈕（跟展開後表單裡的送出按鈕）都貼齊底部。 */
  .detail-box{
    max-width:420px; max-height:85vh; min-height:420px;
    overflow-y:auto; display:flex; flex-direction:column; justify-content:space-between;
  }
  .detail-meta{ font-size:12.5px; color:var(--secondary); line-height:1.6; font-family: var(--sf-mono); margin-bottom:14px; }
  #eventSignupSection{ display:flex; flex-direction:column; flex:1; }

  .detail-attendees{ margin-top:12px; }
  .detail-attendees-empty{ font-size:12px; color:var(--tertiary); }
  .detail-attendees-list{
    display:flex; flex-direction:column;
    max-height:180px; overflow-y:auto;
  }
  .detail-attendee-row{
    display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:var(--secondary); padding:7px 2px; border-top:1px solid var(--line);
  }
  .detail-attendee-row:first-child{ border-top:none; }
  .detail-attendee-row .avatar{ margin-left:0; width:22px; height:22px; font-size:9.5px; }

  .self-signed-note{
    font-size:12.5px; font-weight:700; color:var(--gold); text-align:center; margin-bottom:10px;
  }
  .signup-cancel-btn{
    width:100%; font-size:13px; font-weight:700; padding:11px 0; border-radius:12px;
    color: var(--warn); border:1px solid rgba(231,161,90,0.4); background: rgba(231,161,90,0.1);
  }

  .signup-self-note{ font-size:13px; color:var(--secondary); padding: 4px 2px; margin-bottom:2px; }
  .signup-self-note b{ color:var(--label); font-weight:800; }
  .signup-self-note.warn{ color: var(--warn); }
  .signup-login-link{
    display:inline-block; margin: 6px 2px 2px; font-size:12.5px; font-weight:700; color:var(--gold);
  }
  .signup-cancel-btn:disabled{ opacity:.5; }

  .signup-mode-toggle{
    display:flex; background: rgba(255,255,255,0.05); border:1px solid var(--line);
    border-radius:999px; padding:2px; margin-bottom:14px;
  }
  .signup-mode-toggle button{
    flex:1; font-size:12px; font-weight:700; padding:8px 0; border-radius:999px; color:var(--tertiary);
  }
  .signup-mode-toggle button.active{ background: var(--card-strong); color: var(--label); }

  .signup-submit{
    width:100%; font-size:13px; font-weight:700; padding:11px 0; border-radius:12px;
    background: var(--label); color:#000; margin-top:2px;
  }
  .signup-submit:disabled{ opacity:.5; }

  .signup-list{ display:flex; flex-direction:column; gap:6px; }
  .signup-empty{ font-size:12.5px; color:var(--tertiary); padding: 4px 2px; }

  .import-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; border-radius:12px; background: rgba(255,255,255,0.04); border:1px solid var(--line);
    cursor:pointer;
  }
  .import-toggle-row:active{ background: rgba(255,255,255,0.07); }
  .import-toggle-status{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; flex-shrink:0; }

  .toast{
    position:fixed; bottom: max(24px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    max-width: calc(100vw - 32px);
    background: rgba(30,30,32,0.92);
    backdrop-filter: blur(16px);
    color: var(--label); font-size:13.5px; padding:11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px; opacity:0; transition: all .3s ease; pointer-events:none; z-index:200;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="brand-mask" id="brandMask">
    <div class="brand-mask-eyebrow">WHONEXT</div>
    <div class="brand-mask-title">UNIVERSE</div>
  </div>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">WHONEXT BADMINTON CLUB</div>
      <div class="wordmark">WHONEXT B.C.</div>
    </div>

    <div class="section-label-row">
      <div class="event-tabs" id="eventTabs">
        <button type="button" class="event-tab active" data-filter="own">本月活動</button>
        <button type="button" class="event-tab" data-filter="friend">友團活動</button>
      </div>
      <button type="button" class="event-add-btn admin-only" id="eventAddBtn">＋ 新增賽事</button>
    </div>
    <div class="event-list" id="eventList"></div>

  </div>

  <div class="auth-overlay" id="eventEditOverlay">
    <div class="auth-box detail-box">
      <div class="edit-title" id="eventEditTitleLabel">編輯賽事</div>

      <div id="eventEditTemplateWrap">
        <div class="edit-field-label">賽事範本</div>
        <select id="eventEditTemplate" class="edit-input">
          <option value="manual">手動新增</option>
          <option value="whonext_badminton">WHONEXT 羽球</option>
        </select>
      </div>

      <div class="edit-field-label">標題</div>
      <input type="text" id="eventEditTitle" class="edit-input" placeholder="例如 例行練習賽">

      <div class="edit-field-label">類型</div>
      <select id="eventEditType" class="edit-input">
        <option value="練習">練習</option>
        <option value="企劃">企劃</option>
        <option value="賽事">賽事</option>
      </select>

      <div class="edit-field-label">日期</div>
      <input type="date" id="eventEditDate" class="edit-input">

      <div class="edit-field-label">時間</div>
      <div class="time-range-row">
        <select id="eventEditTimeStart" class="edit-input"></select>
        <span class="time-range-sep">–</span>
        <select id="eventEditTimeEnd" class="edit-input"></select>
      </div>

      <div class="edit-field-label">地點</div>
      <input type="text" id="eventEditLocation" class="edit-input" placeholder="例如 林口高中體育館">

      <div class="edit-field-label">報名人數上限</div>
      <input type="number" id="eventEditCapacity" class="edit-input" placeholder="留空代表不限" min="0">

      <div class="edit-field-label">超過上限後</div>
      <select id="eventEditOverflow" class="edit-input">

      <div id="eventEditAttendWrap" style="display:none">

      <div id="eventEditRecurringWrap" style="display:none; margin-bottom:14px;">
        <label class="import-toggle-row" style="cursor:pointer;">
          <span>自動產生當月剩餘週次（最多 4 週，套用同一份月繳名單）</span>
          <input type="checkbox" id="eventEditRecurring" style="width:18px;height:18px;flex-shrink:0;">
        </label>
      </div>

      <div class="edit-actions">
        <button type="button" class="edit-cancel" id="eventEditCancel">取消</button>
        <button type="button" class="edit-save" id="eventEditSave">儲存</button>

  <div class="auth-overlay" id="eventDetailOverlay">
    <div class="auth-box detail-box">
      <div>
        <div class="edit-title" id="detailTitle"></div>
        <div class="detail-meta" id="detailMeta"></div>
        <div id="detailProgress"></div>
        <div id="detailAttendees"></div>
      </div>

      <div id="selfSignedSection" style="display:none">

          <button type="button" data-mode="guest" id="signupModeGuest">訪客</button>

        <div id="signupMemberFields">
          <div id="signupAsSelf"></div>
        </div>
        <div id="signupGuestFields" style="display:none">
          <input type="text" id="signupGuestName" class="edit-input" placeholder="輸入姓名">
          <div class="edit-field-label">推薦人（選填）</div>
          <select id="signupReferrer" class="edit-input">
            <option value="">— 無 —</option>

        <button type="button" class="signup-submit" id="signupSubmit">送出報名</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 賽事資料存在後端 events 分頁。status 是管理員手動控制的三段式：
  // upcoming（即將開放）／open（報名中，實際名額狀態由系統判斷）／closed（已截止），
  // 管理員點擊狀態標籤依序切換。open 底下的顯示文字再依報名人數/上限/候補設定
  // 自動判斷成「報名中」「已額滿」「開放候補」三種，不用手動選。
  // 舊資料的 status 若是 full 或空值，一律當成 open 處理（走自動判斷）。
  // 「進行中」「已結束」是額外依賽事日期＋時間自動判斷，時間到了就蓋過上述顯示，
  // 底層 ev.status 不受影響，事後時間往前捲動時仍會回到原本的報名狀態顯示。
  let EVENTS = [];
  let eventsLoaded = false;
  let eventFilter = 'own';

  // 賽事標題含友團隊伍關鍵字，就歸類為「友團活動」。目前只有黑狗隊，
  // 之後如有其他友團合作，把隊名加進這個陣列即可，不用動篩選邏輯。
  const FRIEND_CLUB_KEYWORDS = ['黑狗'];
  function isFriendEvent(title){
    const t = String(title || '');
    return FRIEND_CLUB_KEYWORDS.some(function(k){ return t.indexOf(k) !== -1; });
  }

  function eventTypeClass(type){
    return type === '賽事' ? 'et-match' : type === '企劃' ? 'et-project' : type === '練習' ? 'et-practice' : '';
  }

  // 判斷目前登入的球員是否已經報名這場賽事，卡片狀態標籤旁邊顯示「已報名」。
  function currentPlayerSignedUp(ev){
    if(!window.WhonextAuth || WhonextAuth.getRole() !== 'player') return false;
    const name = WhonextAuth.getPlayerName();
    return !!name && Array.isArray(ev.signup_names) && ev.signup_names.indexOf(name) !== -1;
  }

  // 卡片狀態標籤旁邊的行動標籤：已報名就顯示「已報名」；還沒報名、
  // 賽事還沒結束就顯示「我要報名」邀請點進去報名；已結束就不顯示。
  function eventActionTagHTML(ev, statusMeta){
    if(currentPlayerSignedUp(ev)) return '<span class="event-self-tag">已報名</span>';
    const isPast = statusMeta.cls === 'ongoing' || statusMeta.cls === 'ended';
    if(isPast) return '';
    return '<span class="event-self-tag">我要報名</span>';
  }

  // 賽事標題關鍵字對應主辦人，卡片頭像用這份資料顯示。
  const HOST_MAP = [
    { keywords: ['WHONEXT'], name: '儒' },
    { keywords: ['黑狗'], name: 'Eden' }
  ];
  function eventHostInfo(title){
    const t = String(title || '');
    return HOST_MAP.find(function(h){ return h.keywords.some(function(k){ return t.indexOf(k) !== -1; }); }) || null;
  }
  function isThisCalendarMonth(dateStr){
    return String(dateStr || '').slice(0, 7) === currentCalendarMonth();
  }
  const WEEKDAYS = ['日','一','二','三','四','五','六'];
  const STATUS_CYCLE = ['upcoming', 'open', 'closed'];
  const STATUS_MANUAL_META = {
    upcoming: { label: '即將開放', cls: 'upcoming' },
    closed:   { label: '已截止',   cls: 'closed' }
  };

  function normalizeStatus(status){
    return STATUS_CYCLE.includes(status) ? status : 'open';
  }

  function getEventTimeRange(ev){
    const isoDate = String(ev.date || '').slice(0, 10);
    const range = parseTimeRange(ev.time);
    if(!isoDate || !range.start || !range.end) return { start: null, end: null };
    return { start: new Date(isoDate + 'T' + range.start), end: new Date(isoDate + 'T' + range.end) };
  }

  function eventStatusMeta(ev){
    const { start, end } = getEventTimeRange(ev);
    if(start && end && !isNaN(start) && !isNaN(end)){
      const now = new Date();
      if(now >= end) return { label: '已結束', cls: 'ended' };
      if(now >= start) return { label: '進行中', cls: 'ongoing' };
    }
    const status = normalizeStatus(ev.status);
    if(STATUS_MANUAL_META[status]) return STATUS_MANUAL_META[status];
    const capacity = Number(ev.capacity) || 0;
    const count = Number(ev.signup_count) || 0;
    if(capacity && count >= capacity){
      return ev.overflow_mode === 'waitlist'
        ? { label: '開放候補', cls: 'waitlist' }
        : { label: '已額滿', cls: 'full' };
    }
    return { label: '報名中', cls: 'open' };
  }

  function loadCachedEvents(){
    const cached = getApiCache({ action:'getEvents' });
    if(cached){ EVENTS = cached.events || []; eventsLoaded = true; }
    return !!cached;
  }

  // 賽事「進行中／已結束」時，卡片人數改顯示錢包那邊記錄的實際出席人數
  // （weeks 分頁，依日期比對），取代賽事開始前使用的報名人數。
  let ALL_WEEKS = [];
  function splitNames(val){
    return String(val || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function weekAttendanceCount(isoDate){
    const week = ALL_WEEKS.find(function(w){ return String(w.week_date).slice(0, 10) === isoDate; });
    if(!week) return null;
    return splitNames(week.present_names).length + splitNames(week.dropin_names).length;
  }
  function loadCachedWeeksForEvents(){
    const cached = getApiCache({ action:'getWeeks' });
    if(cached) ALL_WEEKS = cached.weeks || [];
    return !!cached;
  }
  async function refreshWeeksForEvents(){
    try{
      const result = await apiGet({ action:'getWeeks' });
      setApiCache({ action:'getWeeks' }, result);
      ALL_WEEKS = result.weeks || [];
      renderEvents();
    } catch(e){}
  }

  async function refreshEvents(){
    try{
      const result = await apiGet({ action:'getEvents' });
      setApiCache({ action:'getEvents' }, result);
      EVENTS = result.events || [];
      eventsLoaded = true;
      renderEvents();
    } catch(e){
      if(!eventsLoaded){
        eventsLoaded = true; // 沒快取又讀取失敗，還是要跳出「載入中」狀態
        renderEvents();
      }
    }
  }

  async function persistEvents(){
    try{
      const result = await apiPost('saveEvents', EVENTS);
      if(!result || !result.success) return null;
      setApiCache({ action:'getEvents' }, { events: EVENTS });
      return result;
    } catch(e){
      return null;
    }
  }

  function progressHTML(ev, statusMeta){
    const capacity = Number(ev.capacity) || 0;
    const hasCapacity = capacity > 0;
    const isPast = statusMeta.cls === 'ongoing' || statusMeta.cls === 'ended';
    const attendance = isPast ? weekAttendanceCount(String(ev.date).slice(0, 10)) : null;
    const count = attendance !== null ? attendance : (Number(ev.signup_count) || 0);
    const waitlist = Number(ev.waitlist_count) || 0;
    const pct = hasCapacity ? Math.min(100, Math.round(count / capacity * 100)) : 0;
    const full = hasCapacity && count >= capacity;
    let label = hasCapacity ? (count + ' / ' + capacity + (attendance !== null ? ' 人出席' : ' 人報名')) : ' ';
    if(attendance === null && hasCapacity && waitlist > 0) label += '・候補 ' + waitlist;
    // 沒設上限時還是把容器印出來(用 visibility:hidden 隱藏),讓卡片不管有沒有
    // 上限，高度都一致，避免清單裡卡片高低不一。
    return '<div class="event-progress"' + (hasCapacity ? '' : ' style="visibility:hidden"') + '>' +
      '<div class="event-progress-track"><div class="event-progress-fill' + (full ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="event-progress-label">' + label + '</div>' +
    '</div>';
  }

  const AVATAR_COLORS = ['n', 'e', 'x', 't'];

  // 友團活動不走我們的報名系統，人數/名單沒有真實資料可抓，先寫死顯示。
  const FRIEND_ATTENDEE_OVERRIDE = [
    { keywords: ['黑狗'], count: 15, names: ['韶恩', '學承', '安', '育誠'] }
  ];
  function friendAttendeeOverride(title){
    const t = String(title || '');
    return FRIEND_ATTENDEE_OVERRIDE.find(function(h){ return h.keywords.some(function(k){ return t.indexOf(k) !== -1; }); }) || null;
  }

  // 卡片列表用頭像疊圖取代長條進度圖，最多顯示 4 個頭像 + 剩餘人數。
  // ev.signup_names 是後端 getEvents 才會回傳的名單快照，舊快取或後端還沒
  // 部署新版時會是 undefined，這裡退回只顯示人數，不會整張卡片壞掉。
  function attendeesHTML(ev, statusMeta){
    const isPast = statusMeta.cls === 'ongoing' || statusMeta.cls === 'ended';
    const attendance = isPast ? weekAttendanceCount(String(ev.date).slice(0, 10)) : null;
    const override = friendAttendeeOverride(ev.title);
    const names = override ? override.names : (Array.isArray(ev.signup_names) ? ev.signup_names : []);
    const count = attendance !== null ? attendance : (override ? override.count : (names.length || Number(ev.signup_count) || 0));
    const waitlist = Number(ev.waitlist_count) || 0;

    const hostInfo = eventHostInfo(ev.title);
    const hostHTML = hostInfo
      ? '<div class="avatar-host" title="發起人：' + hostInfo.name + '">' + hostInfo.name.slice(0, 1) + '</div>' +
        '<div class="event-host-sep"></div>'
      : '';

    if(!count){
      return '<div class="event-attendees">' + hostHTML + '<div class="event-attendees-label">尚無人報名</div></div>';
    }

    const shown = names.slice(0, 4);
    const extra = count - shown.length;
    const avatarsHTML = shown.map(function(n, idx){
      return '<div class="avatar ' + AVATAR_COLORS[idx % AVATAR_COLORS.length] + '">' + String(n).trim().slice(0, 1) + '</div>';
    }).join('') + (extra > 0 ? '<div class="avatar-more">+' + extra + '</div>' : '');

    let label = count + (attendance !== null ? ' 人出席' : ' 人已報名');
    if(attendance === null && waitlist > 0) label += '・候補 ' + waitlist;

    return '<div class="event-attendees">' +
      hostHTML +
      (avatarsHTML ? '<div class="avatar-stack">' + avatarsHTML + '</div>' : '') +
      '<div class="event-attendees-label">' + label + '</div>' +
    '</div>';
  }

  function renderEvents(){
    const list = document.getElementById('eventList');
    if(!eventsLoaded){
      list.innerHTML = '<div class="event-empty glass">載入賽事中…</div>';
      return;
    }
    const order = EVENTS.map(function(ev, i){ return i; })
      .filter(function(i){
        const ev = EVENTS[i];
        return eventFilter === 'friend' ? isFriendEvent(ev.title) : (!isFriendEvent(ev.title) && isThisCalendarMonth(ev.date));
      })
      .sort(function(a, b){
        const aEnded = eventStatusMeta(EVENTS[a]).cls === 'ended' ? 1 : 0;
        const bEnded = eventStatusMeta(EVENTS[b]).cls === 'ended' ? 1 : 0;
        if(aEnded !== bEnded) return aEnded - bEnded;
        return String(EVENTS[a].date).slice(0,10).localeCompare(String(EVENTS[b].date).slice(0,10));
      });

    if(!order.length){
      list.innerHTML = '<div class="event-empty glass">' + (eventFilter === 'friend' ? '目前沒有友團活動' : '本月目前沒有排定的活動') + '</div>';
      return;
    }

    list.innerHTML = order.map(function(i){
      const ev = EVENTS[i];
      const isoDate = String(ev.date).slice(0, 10);
      const mm = isoDate.slice(5,7);
      const dd = isoDate.slice(8,10);
      const wd = WEEKDAYS[new Date(isoDate + 'T00:00:00').getDay()];
      const statusMeta = eventStatusMeta(ev);
      return '<div class="event-card glass ' + eventTypeClass(ev.type) + '" data-index="' + i + '">' +
        '<div class="event-date">' +
          '<div class="ed-month">' + mm + '月</div>' +
          '<div class="ed-day">' + dd + '</div>' +
          '<div class="ed-weekday">週' + wd + '</div>' +
        '</div>' +
        '<div class="event-body">' +
          '<div class="event-title-row">' +
            '<div class="event-title">' + ev.title + '</div>' +
            '<div class="event-title-actions">' +
              '<button type="button" class="event-status ' + statusMeta.cls + '" data-index="' + i + '">' + statusMeta.label + '</button>' +
              eventActionTagHTML(ev, statusMeta) +
              '<button type="button" class="event-edit-btn admin-only" data-index="' + i + '">編輯</button>' +
            '</div>' +
          '</div>' +
          '<div class="event-meta">' + (ev.type ? ev.type + '<span class="sep">・</span>' : '') + ev.time + '<span class="sep">・</span>' + ev.location + '</div>' +
          attendeesHTML(ev, statusMeta) +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.event-card').forEach(function(card){
      card.addEventListener('click', function(e){
        if(e.target.closest('.event-status') || e.target.closest('.event-edit-btn')) return;
        openEventDetail(Number(card.dataset.index));
      });
    });

    list.querySelectorAll('.event-status').forEach(function(btn){
      btn.addEventListener('click', async function(){
        if(!document.body.classList.contains('is-admin')) return;
        const ev = EVENTS[Number(btn.dataset.index)];
        const prevStatus = ev.status;
        const cur = normalizeStatus(ev.status);
        ev.status = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur) + 1) % STATUS_CYCLE.length];
        renderEvents();
        const ok = await persistEvents();
        if(!ok){
          ev.status = prevStatus;
          renderEvents();
          showToast('狀態更新失敗，請稍後再試');
        }
      });
    });

    list.querySelectorAll('.event-edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        openEventEdit(Number(btn.dataset.index));
      });
    });
  }

  let editingIndex = null;

  // 每 30 分鐘一個選項，06:00～23:30，涵蓋大部分活動時段。
  const TIME_OPTIONS = (function(){
    const opts = [];
    for(let mins = 6 * 60; mins <= 23 * 60 + 30; mins += 30){
      opts.push(String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'));
    }
    return opts;
  })();

  function timeSelectOptionsHTML(extraValue){
    const values = new Set(TIME_OPTIONS);
    if(extraValue) values.add(extraValue); // 舊資料的時間若不在半點上，補一個選項讓它顯示得出來
    return [...values].sort().map(function(t){ return '<option value="' + t + '">' + t + '</option>'; }).join('');
  }

  function setTimeSelects(startVal, endVal){
    const startEl = document.getElementById('eventEditTimeStart');
    const endEl = document.getElementById('eventEditTimeEnd');
    startEl.innerHTML = timeSelectOptionsHTML(startVal);
    endEl.innerHTML = timeSelectOptionsHTML(endVal);
    startEl.value = startVal || TIME_OPTIONS[0];
    endEl.value = endVal || TIME_OPTIONS[0];
  }

  function parseTimeRange(str){
    const parts = String(str || '').split(/[-–]/).map(function(s){ return s.trim(); });
    return { start: parts[0] || '', end: parts[1] || '' };
  }

  function openEventEdit(index){
    editingIndex = index;
    const ev = EVENTS[index];
    document.getElementById('eventEditTitleLabel').textContent = '編輯賽事';
    document.getElementById('eventEditTemplateWrap').style.display = 'none';
    document.getElementById('eventEditAttendWrap').style.display = 'none';
    document.getElementById('eventEditAttendList').innerHTML = '';
    document.getElementById('eventEditRecurringWrap').style.display = 'none';
    document.getElementById('eventEditRecurring').checked = false;
    document.getElementById('eventEditTitle').value = ev.title;
    document.getElementById('eventEditType').value = ev.type || '練習';
    document.getElementById('eventEditDate').value = String(ev.date).slice(0, 10);
    const parsedTime = parseTimeRange(ev.time);
    setTimeSelects(parsedTime.start, parsedTime.end);
    document.getElementById('eventEditLocation').value = ev.location;
    document.getElementById('eventEditCapacity').value = ev.capacity || '';
    document.getElementById('eventEditOverflow').value = ev.overflow_mode === 'waitlist' ? 'waitlist' : 'reject';
    document.getElementById('eventEditOverlay').classList.add('open');
  }

  function openEventCreate(){
    editingIndex = 'new';
    document.getElementById('eventEditTitleLabel').textContent = '新增賽事';
    document.getElementById('eventEditTemplateWrap').style.display = '';
    document.getElementById('eventEditTemplate').value = 'manual';
    document.getElementById('eventEditTitle').value = '';
    document.getElementById('eventEditType').value = '練習';
    document.getElementById('eventEditDate').value = '';
    setTimeSelects('20:00', '22:00');
    document.getElementById('eventEditLocation').value = '';
    document.getElementById('eventEditCapacity').value = '';
    document.getElementById('eventEditOverflow').value = 'reject';
    document.getElementById('eventEditAttendWrap').style.display = 'none';
    document.getElementById('eventEditAttendList').innerHTML = '';
    document.getElementById('eventEditRecurringWrap').style.display = 'none';
    document.getElementById('eventEditRecurring').checked = false;
    document.getElementById('eventEditOverlay').classList.add('open');
  }

  function closeEventEdit(){
    document.getElementById('eventEditOverlay').classList.remove('open');
    editingIndex = null;
  }

  function nextFridayISO(){
    const d = new Date();
    const diff = (5 - d.getDay() + 7) % 7; // 0 = 今天就是週五
    d.setDate(d.getDate() + diff);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // 從 startISO 起，找同一個月內、每隔 7 天出現一次的後續日期（同星期幾），
  // 用於「自動產生當月剩餘週次」，最多回傳 maxExtra 筆。
  function sameWeekdayDatesInMonth(startISO, maxExtra){
    const start = new Date(startISO + 'T00:00:00');
    const month = start.getMonth();
    const dates = [];
    const d = new Date(start);
    while(dates.length < maxExtra){
      d.setDate(d.getDate() + 7);
      if(d.getMonth() !== month) break;
      dates.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }
    return dates;
  }

  const EVENT_TEMPLATES = {
    whonext_badminton: {
      title: 'WHONEXT 羽球',
      type: '練習',
      location: '大墩大慶羽球館',
      time: '20:00-22:00',
      capacity: 16,
      overflow_mode: 'waitlist'
    }
  };

  // 選範本時順便把本月月繳名單抓進來排好「出席」預設值,存檔時一起送出去,
  // 不用另外再開一次匯入面板。
  async function applyEventTemplate(key){
    if(key !== 'whonext_badminton'){
      document.getElementById('eventEditAttendWrap').style.display = 'none';
      document.getElementById('eventEditAttendList').innerHTML = '';
      document.getElementById('eventEditRecurringWrap').style.display = 'none';
      document.getElementById('eventEditRecurring').checked = false;
      return;
    }
    const tpl = EVENT_TEMPLATES[key];
    document.getElementById('eventEditTitle').value = tpl.title;
    document.getElementById('eventEditType').value = tpl.type;
    document.getElementById('eventEditLocation').value = tpl.location;
    const tplTime = parseTimeRange(tpl.time);
    setTimeSelects(tplTime.start, tplTime.end);
    document.getElementById('eventEditDate').value = nextFridayISO();
    document.getElementById('eventEditCapacity').value = tpl.capacity;
    document.getElementById('eventEditOverflow').value = tpl.overflow_mode;

    // 名單還在抓的時候先鎖住儲存鈕，避免手速太快在清單填好前就存檔，
    // 導致賽事建立成功但月繳名單沒有一起匯入、卻完全沒有提示。
    const saveBtn = document.getElementById('eventEditSave');
    saveBtn.disabled = true;
    document.getElementById('eventEditAttendWrap').style.display = '';
    document.getElementById('eventEditAttendList').innerHTML = '<div class="signup-empty">載入月繳名單中…</div>';

    const month = currentCalendarMonth();
    try{
      const memberResult = await apiGet({ action:'getMembers', month: month });
      const names = [...new Set((memberResult.members || []).map(function(m){ return m.name; }).filter(Boolean))]
        .sort(function(a, b){ return a.localeCompare(b); });
      document.getElementById('eventEditAttendMonth').textContent = month;
      document.getElementById('eventEditAttendList').innerHTML = names.length
        ? names.map(importRowHTML).join('')
        : '<div class="signup-empty">本月尚無月繳名單</div>';
      if(names.length) wireImportToggleRows('eventEditAttendList');
      document.getElementById('eventEditAttendWrap').style.display = '';
      document.getElementById('eventEditRecurringWrap').style.display = '';
      document.getElementById('eventEditRecurring').checked = false;
    } catch(e){
      document.getElementById('eventEditAttendWrap').style.display = 'none';
      document.getElementById('eventEditRecurringWrap').style.display = 'none';
      showToast('讀取月繳名單失敗，請稍後再試');
    } finally {
      saveBtn.disabled = false;
    }
  }

  async function saveEventEdit(){
    if(editingIndex === null) return;
    const title = document.getElementById('eventEditTitle').value.trim();
    const type = document.getElementById('eventEditType').value;
    const date = document.getElementById('eventEditDate').value;
    const timeStart = document.getElementById('eventEditTimeStart').value;
    const timeEnd = document.getElementById('eventEditTimeEnd').value;
    const location = document.getElementById('eventEditLocation').value.trim();
    const capacityRaw = document.getElementById('eventEditCapacity').value.trim();
    const overflowMode = document.getElementById('eventEditOverflow').value;
    if(!title || !date || !timeStart || !timeEnd || !location){ showToast('請填寫完整資訊'); return; }
    if(timeEnd <= timeStart){ showToast('結束時間需晚於開始時間'); return; }
    const time = timeStart + '-' + timeEnd;

    const isNew = editingIndex === 'new';
    const capacity = capacityRaw === '' ? '' : Number(capacityRaw);
    let ev, backup;
    let createdCount = 1;

    if(isNew){
      ev = { title, type, date, time, location, status:'open', capacity, overflow_mode: overflowMode };
      EVENTS.push(ev);
      if(document.getElementById('eventEditRecurringWrap').style.display !== 'none'
        && document.getElementById('eventEditRecurring').checked){
        sameWeekdayDatesInMonth(date, 3).forEach(function(d){
          EVENTS.push({ title, type, date: d, time, location, status:'open', capacity, overflow_mode: overflowMode });
          createdCount++;
        });
      }
    } else {
      ev = EVENTS[editingIndex];
      backup = Object.assign({}, ev);
      ev.title = title;
      ev.type = type;
      ev.date = date;
      ev.time = time;
      ev.location = location;
      ev.capacity = capacity;
      ev.overflow_mode = overflowMode;
    }

    const attendNames = [];
    if(isNew){
      document.querySelectorAll('#eventEditAttendList .import-toggle-row').forEach(function(row){
        if(row.dataset.present === '1') attendNames.push(row.dataset.name);
      });
    }

    const saveBtn = document.getElementById('eventEditSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    const ok = await persistEvents();

    if(ok){
      await refreshEvents(); // 重抓一次同步回來，更新 signup_count 等欄位
      let importMsg = '';
      if(isNew && attendNames.length){
        // 用後端這次寫入實際回傳的 events（已含新產生的 id），
        // 而不是靠「本地陣列最後一筆」去猜，避免順序假設錯了就找錯賽事。
        // 週期賽事會一次新增多筆，取陣列最後 createdCount 筆逐一匯入名單。
        const createdEvents = ok.events || [];
        const newEvents = createdEvents.slice(createdEvents.length - createdCount).filter(function(e){ return e && e.id; });
        if(newEvents.length === createdCount){
          try{
            const bulkResults = await Promise.all(newEvents.map(function(newEv){
              return apiPost('bulkSignupEvent', { event_id: newEv.id, names: attendNames });
            }));
            const failed = bulkResults.some(function(r){ return !r || !r.success; });
            if(!failed){
              const confirmed = bulkResults.reduce(function(s, r){ return s + (r.confirmed || 0); }, 0);
              const waitlist = bulkResults.reduce(function(s, r){ return s + (r.waitlist || 0); }, 0);
              const parts = [];
              if(confirmed) parts.push('確認 ' + confirmed + ' 人次');
              if(waitlist) parts.push('候補 ' + waitlist + ' 人次');
              if(parts.length) importMsg = '，' + parts.join('、');
              await refreshEvents();
            } else {
              importMsg = '，但月繳名單匯入失敗，請稍後手動匯入';
            }
          } catch(e){
            importMsg = '，但月繳名單匯入失敗，請稍後手動匯入';
          }
        } else {
          importMsg = '，但月繳名單匯入失敗，請稍後手動匯入';
        }
      }
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      closeEventEdit();
      const createdMsg = isNew && createdCount > 1 ? ('已新增 ' + createdCount + ' 場賽事') : (isNew ? '已新增賽事' : '已更新賽事資訊');
      showToast(createdMsg + importMsg);
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      if(isNew) EVENTS.splice(EVENTS.length - createdCount, createdCount);
      else Object.assign(ev, backup);
      showToast('儲存失敗，請稍後再試');
    }
  }

  let detailIndex = null;
  let signupMode = 'member';

  function currentMemberNames(){
    const cached = getApiCache({ action:'getMembers' });
    const members = (cached && cached.members) || [];
    return [...new Set(members.map(function(m){ return m.name; }).filter(Boolean))]
      .sort(function(a, b){ return a.localeCompare(b); });
  }

  // 報名頭像＋名單，欄位塞得下就直接全部列出來，不用再多一層展開收合。
  function detailAttendeesHTML(ev){
    const names = Array.isArray(ev.signup_names) ? ev.signup_names : [];
    if(!names.length) return '<div class="detail-attendees-empty">尚無人報名</div>';
    return '<div class="detail-attendees-list">' + names.map(function(n, idx){
      return '<div class="detail-attendee-row">' +
        '<div class="avatar ' + AVATAR_COLORS[idx % AVATAR_COLORS.length] + '">' + String(n).trim().slice(0, 1) + '</div>' +
        '<span>' + n + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  // 已報名時要取消，需要這筆報名紀錄的 id（getEvents 的 signup_names
  // 只是名字快照，沒有 id），開詳情時順便查一次，取消按鈕先鎖住等查到才能按。
  let detailSelfSignupId = null;
  async function loadDetailSelfSignup(ev, name){
    detailSelfSignupId = null;
    const cancelBtn = document.getElementById('signupCancelBtn');
    cancelBtn.disabled = true;
    try{
      const result = await apiGet({ action:'getEventSignups', event_id: ev.id });
      const match = (result.signups || []).find(function(s){
        return s.type === 'member' && s.member_name === name && (s.status === 'confirmed' || s.status === 'waitlist');
      });
      if(match){
        detailSelfSignupId = match.id;
        cancelBtn.disabled = false;
      }
    } catch(e){
      // 查不到就讓取消按鈕維持鎖住，避免打一個沒有 id 的取消請求
    }
  }

  // 球員模式一定要登入才能報名，而且只能替自己報名（沒有下拉選單可以
  // 選別人）；沒登入就顯示「請先登入」，引導去 profile.html 綁定身分。
  // 訪客模式不需要登入，輸入姓名＋選推薦人（目前的會員名單）就能報名。
  function signupAsSelfHTML(name){
    if(name) return '<div class="signup-self-note">以 <b>' + name + '</b> 身份報名</div>';
    return '<div class="signup-self-note warn">尚未登入，無法以球員身份報名</div>' +
      '<a href="profile.html" class="signup-login-link">前往登入 →</a>';
  }

  function openEventDetail(index){
    detailIndex = index;
    const ev = EVENTS[index];
    document.getElementById('detailTitle').textContent = ev.title;
    document.getElementById('detailMeta').textContent = (ev.type ? ev.type + '　' : '') + String(ev.date).slice(0, 10) + '　' + ev.time + '　' + ev.location;
    document.getElementById('detailProgress').innerHTML = progressHTML(ev, eventStatusMeta(ev));
    document.getElementById('detailAttendees').innerHTML = detailAttendeesHTML(ev);

    const currentName = window.WhonextAuth ? WhonextAuth.getPlayerName() : '';

    // 沒登入的人打開報名表單，直接停在訪客分頁比較實用（球員分頁點了
    // 也只會看到「請先登入」），登入的人一樣預設球員分頁替自己報名。
    signupMode = currentName ? 'member' : 'guest';
    document.getElementById('signupModeMember').classList.toggle('active', signupMode === 'member');
    document.getElementById('signupModeGuest').classList.toggle('active', signupMode === 'guest');
    document.getElementById('signupMemberFields').style.display = signupMode === 'member' ? '' : 'none';
    document.getElementById('signupGuestFields').style.display = signupMode === 'guest' ? '' : 'none';
    document.getElementById('signupGuestName').value = '';
    const submitBtn = document.getElementById('signupSubmit');
    submitBtn.disabled = false;
    submitBtn.textContent = '送出報名';

    document.getElementById('signupAsSelf').innerHTML = signupAsSelfHTML(currentName);

    // 推薦人（訪客模式）從目前的會員名單選，登入的人預設推薦人是自己
    // （畢竟通常是自己拉朋友來），還是可以改選別人。
    const nameOptions = currentMemberNames().map(function(n){ return '<option value="' + n + '">' + n + '</option>'; }).join('');
    document.getElementById('signupReferrer').innerHTML = '<option value="">— 無 —</option>' + nameOptions;
    if(currentName) document.getElementById('signupReferrer').value = currentName;

    const selfSigned = currentPlayerSignedUp(ev);
    document.getElementById('selfSignedSection').style.display = selfSigned ? '' : 'none';
    document.getElementById('signupToggleBtn').style.display = selfSigned ? 'none' : '';
    document.getElementById('eventSignupSection').style.display = 'none';
    if(selfSigned){
      // 每次重新打開都把按鈕文字重置成「取消報名」，不要沿用上一次
      // 點擊留下的「取消中…」，查到 id 前先鎖住避免打沒有 id 的請求。
      const cancelBtn = document.getElementById('signupCancelBtn');
      cancelBtn.textContent = '取消報名';
      cancelBtn.disabled = true;
      loadDetailSelfSignup(ev, currentName);
    }

    document.getElementById('eventDetailOverlay').classList.add('open');
  }

  function closeEventDetail(){
    document.getElementById('eventDetailOverlay').classList.remove('open');
    detailIndex = null;
  }

  async function cancelCurrentSignup(){
    if(!detailSelfSignupId) return;
    const btn = document.getElementById('signupCancelBtn');
    btn.disabled = true;
    btn.textContent = '取消中…';
    try{
      const result = await apiPost('cancelSignup', { id: detailSelfSignupId });
      if(result && result.success){
        showToast('已取消報名');
        await refreshEvents();
        if(detailIndex !== null) openEventDetail(detailIndex);
        return;
      }
      showToast('取消失敗，請稍後再試');
    } catch(e){
      showToast('取消失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '取消報名';
  }
  document.getElementById('signupCancelBtn').addEventListener('click', cancelCurrentSignup);

  document.getElementById('signupToggleBtn').addEventListener('click', function(){
    this.style.display = 'none';
    document.getElementById('eventSignupSection').style.display = '';
  });

  const SIGNUP_FAIL_MSG = {
    full: '報名已額滿',
    duplicate: '您已經報名過了',
    event_not_found: '找不到這筆賽事',
    not_open: '報名尚未開放',
    closed: '報名已截止'
  };

  async function submitSignup(){
    if(detailIndex === null) return;
    const ev = EVENTS[detailIndex];
    const payload = { event_id: ev.id, type: signupMode };
    if(signupMode === 'member'){
      const name = window.WhonextAuth ? WhonextAuth.getPlayerName() : '';
      if(!name){ showToast('請先登入才能以球員身份報名'); return; }
      payload.member_name = name;
    } else {
      const guestName = document.getElementById('signupGuestName').value.trim();
      if(!guestName){ showToast('請輸入姓名'); return; }
      payload.guest_name = guestName;
      payload.referrer = document.getElementById('signupReferrer').value;
    }

    const btn = document.getElementById('signupSubmit');
    btn.disabled = true;
    btn.textContent = '送出中…';
    try{
      const result = await apiPost('signupEvent', payload);
      if(result.success){
        showToast(result.status === 'waitlist' ? '已加入候補名單' : '已報名成功');
        const signedUpIndex = detailIndex;
        await refreshEvents();
        if(signedUpIndex !== null) openEventDetail(signedUpIndex);
        return;
      } else {
        showToast(SIGNUP_FAIL_MSG[result.reason] || '報名失敗，請稍後再試');
      }
    } catch(e){
      showToast('報名失敗，請稍後再試');
    }
    btn.disabled = false;
    btn.textContent = '送出報名';
  }

  function currentCalendarMonth(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function importStatusStyle(present){
    return present
      ? 'color:var(--warn); background:rgba(231,161,90,0.15);'
      : 'color:var(--good); background:rgba(127,215,154,0.15);';
  }

  function importRowHTML(name){
    return '<div class="import-toggle-row" data-name="' + name + '" data-present="1">' +
      '<span>' + name + '</span>' +
      '<span class="import-toggle-status" style="' + importStatusStyle(true) + '">出席</span>' +
    '</div>';
  }

  function wireImportToggleRows(containerId){
    document.querySelectorAll('#' + containerId + ' .import-toggle-row').forEach(function(row){
      row.addEventListener('click', function(){
        const nowPresent = row.dataset.present !== '1';
        row.dataset.present = nowPresent ? '1' : '0';
        const statusEl = row.querySelector('.import-toggle-status');
        statusEl.textContent = nowPresent ? '出席' : '請假';
        statusEl.setAttribute('style', importStatusStyle(nowPresent));
      });
    });
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  document.getElementById('eventAddBtn').addEventListener('click', openEventCreate);

  document.querySelectorAll('#eventTabs .event-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      if(tab.classList.contains('active')) return;
      document.querySelectorAll('#eventTabs .event-tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      eventFilter = tab.dataset.filter;
      renderEvents();
    });
  });
  document.getElementById('eventEditTemplate').addEventListener('change', function(){
    applyEventTemplate(this.value);
  });
  document.getElementById('eventEditCancel').addEventListener('click', closeEventEdit);
  document.getElementById('eventEditSave').addEventListener('click', saveEventEdit);
  document.getElementById('eventEditOverlay').addEventListener('click', function(e){
    if(e.target.id === 'eventEditOverlay') closeEventEdit();
  });

  document.getElementById('signupModeMember').addEventListener('click', function(){
    signupMode = 'member';
    this.classList.add('active');
    document.getElementById('signupModeGuest').classList.remove('active');
    document.getElementById('signupMemberFields').style.display = '';
    document.getElementById('signupGuestFields').style.display = 'none';
  });
  document.getElementById('signupModeGuest').addEventListener('click', function(){
    signupMode = 'guest';
    this.classList.add('active');
    document.getElementById('signupModeMember').classList.remove('active');
    document.getElementById('signupMemberFields').style.display = 'none';
    document.getElementById('signupGuestFields').style.display = '';
  });
  document.getElementById('signupSubmit').addEventListener('click', submitSignup);
  document.getElementById('eventDetailOverlay').addEventListener('click', function(e){
    if(e.target.id === 'eventDetailOverlay') closeEventDetail();
  });

  // 遮罩至少停留 1 秒再淡出，快取秒開時也不會一閃而過。
  const BRAND_MASK_MIN_MS = 1000;
  const brandMaskShownAt = Date.now();
  function hideBrandMask(){
    const mask = document.getElementById('brandMask');
    if(!mask || mask.classList.contains('hide') || mask.dataset.hiding) return;
    mask.dataset.hiding = '1';
    const wait = Math.max(0, BRAND_MASK_MIN_MS - (Date.now() - brandMaskShownAt));
    setTimeout(function(){
      mask.classList.add('hide');
      setTimeout(function(){ mask.remove(); }, 400);
    }, wait);
  }

  (async function initialLoad(){
    const hadCache = loadCachedEvents();
    loadCachedWeeksForEvents();
    renderEvents();
    if(hadCache) hideBrandMask();

    await refreshEvents();
    hideBrandMask();
  })();

  // 賽事是首頁第一眼看到的內容，先讓它的請求送出去，
  // 再暖機其他子頁面用的資料，避免跟 GAS 執行配額擠在一起拖慢賽事回應。
  // getWeeks 額外拿來算「進行中／已結束」賽事卡片的實際出席人數，所以讀完要重繪一次。
  refreshWeeksForEvents();
  apiPrefetch({ action:'getMembers' });
</script>
</body>
</html>
