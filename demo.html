<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(228,201,122,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(159,179,200,0.07), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  /* ---------- BRAND MASK ---------- */
  .brand-mask{
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(228,201,122,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(159,179,200,0.07), transparent 50%),
      var(--bg);
    transition: opacity .4s ease;
  }
  .brand-mask.hide{ opacity:0; pointer-events:none; }
  .brand-mask-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--gold);
    text-transform:uppercase; margin-bottom:10px;
  }
  .brand-mask-title{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(30px,8vw,40px);
  }

  /* ---------- NAV ---------- */
  .navbar{
    position:sticky; top:0; z-index:30;
    padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner{
    max-width: 640px; margin:0 auto;
    display:flex; align-items:center; gap:12px; justify-content:space-between;
    padding: 10px 16px 12px;
  }
  .nav-title{ flex:1; min-width:0; }
  .nav-title .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary); text-transform:uppercase; }
  .nav-title h1{ margin:1px 0 0; font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .identity-widget{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .login-btn{
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:999px;
    background: var(--label); color:#000;
  }
  .id-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; background: var(--gold-bg); border:1.5px solid var(--gold); color:var(--gold);
  }
  .id-name{
    font-size:13px; font-weight:700; max-width:88px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .id-widget-btn{ display:flex; align-items:center; gap:8px; }

  .wrap{
    max-width: 640px; margin:0 auto; width:100%;
    padding: 20px 16px calc(96px + env(safe-area-inset-bottom));
  }

  /* ---------- HERO ---------- */
  .hero{ padding: 2px 4px 18px; }
  .hero .hero-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--gold);
    text-transform:uppercase; margin-bottom:10px;
  }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.08em;
    font-size: clamp(24px,9vw,38px);
  }

  /* ---------- RANKING DASHBOARD ---------- */
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.18em; color:var(--tertiary);
    text-transform:uppercase; margin: 0 4px 12px;
  }
  .section-label-row{ display:flex; align-items:center; justify-content:space-between; margin: 26px 4px 12px; }
  .section-label-row .section-label{ margin:0; }

  .board-period{ font-size:11px; color:var(--tertiary); margin: 0 4px 14px; }

  .podium{ display:flex; align-items:stretch; gap:10px; margin: 0 0 12px; padding: 0 2px; }
  .podium-slot{
    flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    text-align:center; padding: 16px 8px 14px;
    border:1px solid var(--line); border-radius:18px;
    background: rgba(255,255,255,0.04);
  }
  .podium-slot.p1{ padding-top:26px; border-color: rgba(228,201,122,0.4); background: var(--gold-bg); order:2; }
  .podium-slot.p2{ order:1; }
  .podium-slot.p3{ order:3; }
  .podium-rank{
    font-family: var(--sf-mono); font-weight:700; font-size:11px; line-height:1; color:var(--tertiary);
    margin-bottom:8px;
  }
  .podium-slot.p1 .podium-rank{ color: var(--gold); font-size:12px; }
  .podium-slot.p2 .podium-rank{ color: var(--silver); }
  .podium-slot.p3 .podium-rank{ color: var(--bronze); }
  .podium-avatar{
    width:44px; height:44px; border-radius:50%; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; line-height:1;
    background: var(--card-strong); border:1.5px solid var(--line);
  }
  .podium-slot.p1 .podium-avatar{ width:56px; height:56px; font-size:18px; border-color: var(--gold); color: var(--gold); }
  .podium-slot.p2 .podium-avatar{ width:46px; height:46px; font-size:15.5px; border-color: var(--silver); color: var(--silver); }
  .podium-slot.p3 .podium-avatar{ width:38px; height:38px; font-size:13px; border-color: var(--bronze); color: var(--bronze); }
  .podium-name{ font-size:12.5px; font-weight:700; line-height:1.3; margin-bottom:2px; }
  .podium-value{ font-size:11px; line-height:1.3; color:var(--secondary); font-family: var(--sf-mono); }

  .board-more{
    display:block; text-align:center; font-size:12.5px; font-weight:700; color:var(--secondary);
    padding: 12px 0 4px;
  }

  /* 歷屆賽事得名：歷史紀錄，不是即時計算的排名，用獎盃卡片橫向陳列，
     跟上面「即時排行」在視覺上明確分開，不會被誤解成同一種數據。 */
  .trophy-row{ display:flex; gap:10px; overflow-x:auto; padding: 2px 2px 6px; margin: 0 -2px; }
  .trophy-card{
    flex-shrink:0; width:158px; padding:16px 14px; scroll-snap-align:start;
  }
  .trophy-row{ scroll-snap-type: x proximity; }
  .trophy-badge{
    width:34px; height:34px; border-radius:50%; margin-bottom:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color: var(--gold);
    border:1.5px solid var(--gold); background: var(--gold-bg);
  }
  .trophy-badge.silver{ color: var(--silver); border-color: var(--silver); background: var(--silver-bg); }
  .trophy-badge.bronze{ color: var(--bronze); border-color: var(--bronze); background: var(--bronze-bg); }
  .trophy-event{ font-size:11px; color:var(--tertiary); margin-bottom:4px; }
  .trophy-members{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; min-height:35px; justify-content:center; }
  .trophy-member{ display:flex; align-items:center; gap:6px; }
  .trophy-member-avatar{
    width:20px; height:20px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:800; line-height:1;
    background: var(--card-strong); border:1px solid var(--gold); color:var(--gold);
  }
  .trophy-card.silver .trophy-member-avatar{ border-color:var(--silver); color:var(--silver); }
  .trophy-card.bronze .trophy-member-avatar{ border-color:var(--bronze); color:var(--bronze); }

  /* ---------- 我的活動 prototype：年度總覽 ---------- */
  .yo-card{ padding:20px; margin-bottom:8px; }
  .yo-stats{ display:flex; align-items:center; margin-bottom:18px; }
  .yo-stat{ flex:1; text-align:center; }
  .yo-stat-value{ font-family: var(--sf-mono); font-size:26px; font-weight:800; line-height:1; margin-bottom:4px; }
  .yo-stat-label{ font-size:11px; color:var(--tertiary); }
  .yo-stat-sep{ width:1px; height:32px; background:var(--line); flex-shrink:0; }
  .yo-milestone{ border-top:1px solid var(--line); padding-top:16px; }
  .yo-milestone-label{ font-size:12px; color:var(--secondary); margin-bottom:8px; }
  .yo-milestone-label b{ color:var(--gold); font-weight:800; }
  .yo-progress-track{ height:8px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; margin-bottom:6px; }
  .yo-progress-fill{ height:100%; border-radius:999px; background: var(--gold); }
  .yo-progress-count{ font-size:11px; color:var(--tertiary); font-family: var(--sf-mono); text-align:right; }

  /* ---------- 我的活動 prototype：獎盃櫃 ---------- */
  .tc-card{ padding:18px; }
  .tc-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:18px 8px; margin-bottom:4px; }
  .tc-item{ display:flex; flex-direction:column; align-items:center; gap:7px; }
  .tc-badge{
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--sf-mono); font-weight:800; font-size:14px;
    border:2px solid var(--gold); background: var(--gold-bg); color: var(--gold);
  }
  .tc-badge.locked{ border-color: var(--line); background: rgba(255,255,255,0.04); color: var(--tertiary); }
  .tc-label{ font-size:10.5px; color:var(--secondary); text-align:center; line-height:1.3; }
  .tc-item.locked .tc-label{ color: var(--tertiary); }
  .tc-more-btn{
    display:block; width:100%; text-align:center; font-size:12.5px; font-weight:700; color:var(--secondary);
    padding: 14px 0 2px; margin-top:4px; border-top:1px solid var(--line);
  }
  .trophy-member-name{ font-size:12.5px; font-weight:700; line-height:1.3; }
  .trophy-name{ font-size:12px; color:var(--secondary); line-height:1.4; }

  /* ---------- GOOGLE 登入／註冊 MOCK ---------- */
  .gauth-overlay{
    position:fixed; inset:0; z-index:250; display:none;
    align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  }
  .gauth-overlay.open{ display:flex; }
  @media (min-width:480px){ .gauth-overlay{ align-items:center; } }
  .gauth-sheet{
    width:100%; max-width:400px; box-sizing:border-box;
    background:#0b0b0c; border:1px solid var(--line);
    border-radius:24px 24px 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  }
  @media (min-width:480px){ .gauth-sheet{ border-radius:24px; } }

  .gauth-title{ font-size:16px; font-weight:800; margin-bottom:4px; }
  .gauth-sub{ font-size:12.5px; color:var(--secondary); margin-bottom:20px; line-height:1.5; }

  .gauth-spinner-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding: 26px 0 10px; }
  .gauth-spinner{
    width:28px; height:28px; border-radius:50%;
    border:3px solid var(--line); border-top-color: var(--gold);
    animation: gauth-spin .8s linear infinite;
  }
  @keyframes gauth-spin{ to{ transform:rotate(360deg); } }
  .gauth-cancel-btn{ width:100%; font-size:12.5px; font-weight:700; padding:10px 0; color:var(--secondary); margin-top:8px; text-align:center; }

  /* ---------- 快速登入：滑動選擇目前真實球員清單（demo 測試工具，
     直接呼叫真的 WhonextAuth.setPlayerName，不用走 Google 驗證）---------- */
  .picker-row{
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x proximity;
    padding: 2px 2px 6px; margin: 0 -2px 4px;
  }
  .picker-card{
    flex-shrink:0; width:76px; scroll-snap-align:start;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:12px 4px; text-align:center;
  }
  .picker-avatar{
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; background: var(--gold-bg); border:1.5px solid var(--gold); color:var(--gold);
  }
  .picker-card.is-admin .picker-avatar{ border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.15); }
  .picker-name{ font-size:12px; font-weight:700; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .picker-admin-tag{ font-size:9px; font-weight:800; color:var(--gold); }
</style>

<script>
  // ---------- 年度總覽／獎盃櫃 prototype（demo 專用，假資料）----------
  // 里程碑照場次門檻分級，達標的場次徽章亮起、還沒達標的維持鎖定灰階。
  // 「下一個里程碑」永遠抓第一個還沒達標的門檻，進度條/文字都照它算。
  var YEAR_ATTENDED = 22;
  var MILESTONES = [
    { threshold: 1, label: '初登場' },
    { threshold: 5, label: '常客' },
    { threshold: 10, label: '熟面孔' },
    { threshold: 20, label: '核心成員' },
    { threshold: 30, label: 'WHO朋引伴' },
    { threshold: 50, label: '傳奇球員' }
  ];
  var TC_PREVIEW_COUNT = 4;
  var tcExpanded = false;

  function renderYearOverview(){
    var earned = MILESTONES.filter(function(m){ return YEAR_ATTENDED >= m.threshold; });
    var next = MILESTONES.find(function(m){ return YEAR_ATTENDED < m.threshold; });

    document.getElementById('yoAttended').textContent = YEAR_ATTENDED;
    document.getElementById('yoBadgeCount').textContent = earned.length;

    if(!next){
      document.getElementById('yoMilestoneLabel').innerHTML = '已達成所有里程碑，<b>傳奇球員</b> 解鎖！';
      document.getElementById('yoProgressFill').style.width = '100%';
      document.getElementById('yoProgressCount').textContent = YEAR_ATTENDED + ' 場';
      return;
    }
    var remain = next.threshold - YEAR_ATTENDED;
    document.getElementById('yoMilestoneLabel').innerHTML = '距離下一個里程碑「<b>' + next.label + '</b>」還差 ' + remain + ' 場';
    document.getElementById('yoProgressFill').style.width = Math.round(YEAR_ATTENDED / next.threshold * 100) + '%';
    document.getElementById('yoProgressCount').textContent = YEAR_ATTENDED + ' / ' + next.threshold + ' 場';
  }

  function renderTrophyCabinet(){
    var visible = tcExpanded ? MILESTONES : MILESTONES.slice(0, TC_PREVIEW_COUNT);
    document.getElementById('tcGrid').innerHTML = visible.map(function(m){
      var earned = YEAR_ATTENDED >= m.threshold;
      return '<div class="tc-item' + (earned ? '' : ' locked') + '">' +
        '<div class="tc-badge' + (earned ? '' : ' locked') + '">' + m.threshold + '</div>' +
        '<div class="tc-label">' + m.label + '</div>' +
      '</div>';
    }).join('');

    var moreBtn = document.getElementById('tcMoreBtn');
    if(MILESTONES.length > TC_PREVIEW_COUNT){
      moreBtn.style.display = '';
      moreBtn.textContent = tcExpanded ? '收合 ↑' : '查看更多 ↓（還有 ' + (MILESTONES.length - TC_PREVIEW_COUNT) + ' 個）';
    } else {
      moreBtn.style.display = 'none';
    }
  }
  document.getElementById('tcMoreBtn').addEventListener('click', function(){
    tcExpanded = !tcExpanded;
    renderTrophyCabinet();
  });

  renderYearOverview();
  renderTrophyCabinet();
</script>

<script>
  // ---------- 快速登入（demo 測試工具）----------
  // 不走 Google 驗證，直接滑動選一位「目前真實球員清單」（getProfiles）
  // 裡的人，點下去就呼叫真的 WhonextAuth.setPlayerName() 登入——跟正式
  // 站共用同一份 localStorage 身分，所以選完可以直接用下面的 bottom nav
  // 切去「個人」「球隊錢包」等頁面，看那個人的真實資料。
  var gauthOverlay = document.getElementById('gauthOverlay');
  var gauthSheet = document.getElementById('gauthSheet');

  function closeGauth(){
    gauthOverlay.classList.remove('open');
  }
  gauthOverlay.addEventListener('click', function(e){
    if(e.target === gauthOverlay) closeGauth();
  });

  function loadProfilesForPicker(){
    var cached = getApiCache({ action: 'getProfiles' });
    if(cached) return Promise.resolve(cached.profiles || []);
    return apiGet({ action: 'getProfiles' }).then(function(result){
      setApiCache({ action: 'getProfiles' }, result);
      return result.profiles || [];
    });
  }

  function renderPlayerPicker(){
    gauthSheet.innerHTML =
      '<div class="gauth-title">快速登入</div>' +
      '<div class="gauth-sub">滑動選一位目前的球員身分（demo 測試用，直接登入不用驗證）。</div>' +
      '<div class="picker-row" id="pickerRow"><div class="gauth-spinner-wrap"><div class="gauth-spinner"></div></div></div>' +
      '<button type="button" class="gauth-cancel-btn" id="gauthCancelBtn">取消</button>';
    document.getElementById('gauthCancelBtn').addEventListener('click', closeGauth);

    loadProfilesForPicker().then(function(profiles){
      var row = document.getElementById('pickerRow');
      if(!row) return; // 使用者已經關掉視窗
      if(!profiles.length){ row.innerHTML = '<div class="gauth-sub">目前沒有球員資料</div>'; return; }

      var sorted = profiles.slice().sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
      row.innerHTML = sorted.map(function(p, i){
        var isAdmin = p.is_admin === true || p.is_admin === 'TRUE';
        return '<button type="button" class="picker-card' + (isAdmin ? ' is-admin' : '') + '" data-i="' + i + '">' +
          '<div class="picker-avatar">' + avatarInitial(p.name) + '</div>' +
          '<div class="picker-name">' + p.name + '</div>' +
          (isAdmin ? '<div class="picker-admin-tag">管理員</div>' : '') +
        '</button>';
      }).join('');
      row.querySelectorAll('.picker-card').forEach(function(btn){
        btn.addEventListener('click', function(){
          var p = sorted[Number(btn.dataset.i)];
          var isAdmin = p.is_admin === true || p.is_admin === 'TRUE';
          WhonextAuth.setPlayerName(p.name, isAdmin);
          closeGauth();
        });
      });
    }).catch(function(){
      var row = document.getElementById('pickerRow');
      if(row) row.innerHTML = '<div class="gauth-sub">載入球員清單失敗，請稍後再試</div>';
    });
  }

  // 右上角身分識別：未登入顯示「登入」按鈕；登入後顯示頭像＋名稱，
  // 點一下直接登出（呼叫真的 WhonextAuth.setPlayerName('')）。身分是
  // 共用的 localStorage 狀態，所以從別頁登入/登出回來這裡也要跟著更新。
  function renderIdentityWidget(){
    const widget = document.getElementById('identityWidget');
    const name = WhonextAuth.getPlayerName();
    if(name){
      widget.innerHTML =
        '<button type="button" class="id-widget-btn" id="idWidgetBtn">' +
          '<div class="id-avatar">' + avatarInitial(name) + '</div>' +
          '<div class="id-name">' + name + '</div>' +
        '</button>';
      document.getElementById('idWidgetBtn').addEventListener('click', function(){ WhonextAuth.setPlayerName(''); });
    } else {
      widget.innerHTML = '<button type="button" class="login-btn" id="loginBtn">登入</button>';
      document.getElementById('loginBtn').addEventListener('click', function(){
        gauthOverlay.classList.add('open');
        renderPlayerPicker();
      });
    }
  }
  document.addEventListener('whonext:playername-change', renderIdentityWidget);

  renderIdentityWidget();
</script>
</body>
</html>
