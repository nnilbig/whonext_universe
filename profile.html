<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的活動 — WHONEXT UNIVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="top-nav.css">
<link rel="stylesheet" href="bottom-nav.css">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(228,201,122,0.08), transparent 45%),
      radial-gradient(ellipse at 90% 105%, rgba(159,179,200,0.07), transparent 50%),
      var(--bg);
    color: var(--label);
    font-family: var(--sf);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .glass{
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line);
    border-radius: 22px;
  }

  .wrap{ max-width: 640px; margin:0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }

  .hero{ padding: 4px 4px 22px; }
  .hero .hero-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--tertiary);
    text-transform:uppercase; margin-bottom:8px;
  }
  .hero .wordmark{
    font-family:'Archivo Black', var(--sf); font-weight:400; letter-spacing:.1em;
    font-size: clamp(26px,7vw,34px); margin-bottom:8px;
  }
  .hero p{ margin:0; font-size: clamp(13px,3.2vw,14.5px); color:var(--secondary); line-height:1.6; max-width:440px; }

  .section-label-row{ display:flex; align-items:center; justify-content:space-between; margin: 26px 4px 12px; }
  .section-label-row:first-of-type{ margin-top:0; }
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.18em; color:var(--tertiary);
    text-transform:uppercase; margin:0;
  }

  /* ---- 活動列表 ---- */
  .plist{ padding: 6px 6px; margin-bottom: 8px; }
  .prow{
    display:flex; align-items:center; gap:12px;
    padding: 12px 8px;
    border-top: 1px solid var(--line);
  }
  .prow:first-child{ border-top:none; }
  .prow-date{
    width:40px; flex-shrink:0; text-align:center;
    font-family: var(--sf-mono); font-weight:700; line-height:1.15;
  }
  .prow-date .mm{ font-size:10px; color:var(--tertiary); }
  .prow-date .dd{ font-size:17px; }
  .prow-body{ flex:1; min-width:0; }
  .prow-title{ font-size:13.5px; font-weight:700; line-height:1.3; }
  .prow-meta{ margin-top:2px; font-size:11px; color:var(--tertiary); }
  .prow-tag{
    font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; flex-shrink:0;
    color: var(--gold); border:1px solid rgba(242,196,85,0.4); background: var(--gold-bg);
  }
  .prow-tag.ended{ color: var(--secondary); border-color: var(--line); background: rgba(255,255,255,0.05); }
  .empty-row{ padding: 20px 10px; font-size:12.5px; color:var(--tertiary); text-align:center; }
  .more-row{
    width:100%; text-align:center;
    padding:12px 6px;
    border-top:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--tertiary);
  }
  .more-row:active{ color:var(--label); }

  /* ---- 歷屆賽事排名 ---- */
  .trow{
    display:flex; align-items:center; gap:12px;
    padding: 12px 8px;
    border-top: 1px solid var(--line);
  }
  .trow:first-child{ border-top:none; }
  .trow-badge{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color: var(--gold);
    border:1.5px solid var(--gold); background: var(--gold-bg);
  }
  .trow-badge.silver{ color: var(--silver); border-color: var(--silver); background: var(--silver-bg); }
  .trow-badge.bronze{ color: var(--bronze); border-color: var(--bronze); background: var(--bronze-bg); }
  .trow-badge.other{ color: var(--tertiary); border-color: var(--line); background: rgba(255,255,255,0.05); }
  .trow-title{ font-size:13.5px; font-weight:700; }
  .trow-sub{ margin-top:2px; font-size:11px; color:var(--tertiary); }

  /* ---- 賽季排名卡 ---- */
  .season-card{ display:flex; align-items:center; gap:16px; padding:20px; margin-bottom:8px; }
  .season-rank{
    font-family: var(--sf-mono); font-weight:800; font-size:26px; line-height:1;
    color: var(--gold); flex-shrink:0;
  }
  .season-body .t{ font-size:13.5px; font-weight:700; margin-bottom:3px; }
  .season-body .s{ font-size:11.5px; color:var(--tertiary); }

  /* ---- 年度總覽（展開看所有勳章）---- */
  .yo-card{ padding:20px; margin-bottom:8px; }
  .yo-stats{ display:flex; align-items:center; }
  .yo-stat{ flex:1; text-align:center; min-width:0; }
  .yo-stat-value{ font-family: var(--sf-mono); font-size:24px; font-weight:800; line-height:1; margin-bottom:4px; }
  .yo-stat-value.yo-stat-text{ font-size:15px; font-family: var(--sf); color: var(--gold); }
  .yo-stat-label{ font-size:11px; color:var(--tertiary); }
  .yo-stat-sep{ width:1px; height:32px; background:var(--line); flex-shrink:0; }
  .tc-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:18px 8px; margin-top:18px; }
  .tc-item{ display:flex; flex-direction:column; align-items:center; gap:7px; }
  .tc-badge{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--sf-mono); font-weight:800; font-size:13px;
    border:2px solid var(--gold); background: var(--gold-bg); color: var(--gold);
  }
  .tc-badge.locked{ border-color: var(--line); background: rgba(255,255,255,0.04); color: var(--tertiary); }
  .tc-label{ font-size:10.5px; color:var(--secondary); text-align:center; line-height:1.3; }
  .tc-item.locked .tc-label{ color: var(--tertiary); }
  .tc-toggle-btn{
    display:block; width:100%; text-align:center; font-size:12.5px; font-weight:700; color:var(--secondary);
    margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
  }
  .tc-toggle-btn:active{ color:var(--label); }

  /* ---- 管理員：球員名冊預覽 ---- */
  .roster-manage-link{
    display:block; text-align:center; font-size:12.5px; font-weight:700; color:var(--secondary);
    padding: 14px 0 4px;
  }

  .toast{
    position:fixed; bottom: calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    max-width: calc(100vw - 32px);
    background: rgba(30,30,32,0.92);
    backdrop-filter: blur(16px);
    color: var(--label); font-size:13.5px; padding:11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px; opacity:0; transition: all .3s ease; pointer-events:none; z-index:200;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">WHONEXT BADMINTON CLUB</div>
      <div class="wordmark" id="profileTitle">我的活動</div>
    </div>

    <!-- ---------- 管理員：球員名冊預覽 ---------- -->
    <!-- 球隊錢包已經是底部導覽自己的分頁（管理員身分會顯示成「球隊錢包」），
         這裡不用重複放入口；直接嵌入當月名單預覽，滿三筆收合。 -->
    <div id="adminOverviewView" style="display:none">

      <div class="section-label-row" style="margin-top:0">
        <div class="section-label">月繳成員</div>
      </div>
      <div class="plist glass" id="adminMonthlyList"></div>

      <div class="section-label-row">
        <div class="section-label">臨打球員</div>
      </div>
      <div class="plist glass" id="adminDropinList"></div>

      <a class="roster-manage-link" href="member.html">管理球員名冊 →</a>
    </div>

    <!-- ---------- 球員：個人頁 ---------- -->
    <div id="personalView" style="display:none">

      <div id="whoamiContainer" style="display:none"></div>

      <div id="personalContent" style="display:none">

        <div class="section-label-row">
          <div class="section-label">年度總覽</div>
        </div>
        <div class="yo-card glass">
          <div class="yo-stats">
            <div class="yo-stat"><div class="yo-stat-value" id="yoAttended">0</div><div class="yo-stat-label">參加場數</div></div>
            <div class="yo-stat-sep"></div>
            <div class="yo-stat"><div class="yo-stat-value" id="yoBadgeCount">0</div><div class="yo-stat-label">勳章數目</div></div>
            <div class="yo-stat-sep"></div>
            <div class="yo-stat"><div class="yo-stat-value yo-stat-text" id="yoChallenge">—</div><div class="yo-stat-label">挑戰中</div></div>
          </div>
          <div class="tc-grid" id="tcGrid" style="display:none"></div>
          <button type="button" class="tc-toggle-btn" id="yoToggleBtn">展開看所有勳章 ↓</button>
        </div>

        <div class="section-label-row">
          <div class="section-label">報名中活動</div>
        </div>
        <div class="plist glass" id="upcomingList"></div>

        <div class="section-label-row">
          <div class="section-label">歷史活動</div>
        </div>
        <div class="plist glass" id="historyList"></div>

        <div class="section-label-row">
          <div class="section-label">排行榜（歷屆賽事排名）</div>
        </div>
        <div class="plist glass" id="trophyList"></div>

        <div class="section-label-row">
          <div class="section-label">賽季排名</div>
        </div>
        <div id="seasonRankBody"></div>

      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

<script src="backend.js"></script>
<script src="tournaments.js"></script>
<script src="top-nav.js"></script>
<script src="auth.js"></script>
<script src="identity-picker.js"></script>
<script src="bottom-nav.js"></script>
<script>
  const HISTORY_PREVIEW_COUNT = 3;
  let historyExpanded = false;

  let EVENTS = [];
  let ALL_WEEKS = [];
  let ALL_MEMBERS = [];

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function splitNames(val){
    return String(val || '').split(',').map(s=>s.trim()).filter(Boolean);
  }
  function parseDropinEntry(entry){
    const m = String(entry || '').match(/^(.*?)\(([^()]+)\)$/);
    return m ? { name: m[1].trim(), referrer: m[2].trim() } : { name: String(entry || '').trim(), referrer: '' };
  }
  // 訪客類佔位名字：純「友」「友1」，或「{邀請人}友{編號}」這種沒留真名的
  // 臨打訪客（例如「忠友1」「CC友」），一律排除在真實身份之外。
  function isPlaceholderName(name){
    return /友\d*$/.test(name);
  }
  function monthOfWeek(w){ return String(w.week_date || '').slice(0,7); }

  function parseTimeRange(str){
    const parts = String(str || '').split(/[-–]/).map(function(s){ return s.trim(); });
    return { start: parts[0] || '', end: parts[1] || '' };
  }
  function isEventEnded(ev){
    const isoDate = String(ev.date || '').slice(0, 10);
    const range = parseTimeRange(ev.time);
    if(!isoDate || !range.end) return false;
    const end = new Date(isoDate + 'T' + range.end);
    return !isNaN(end) && new Date() >= end;
  }

  // ---------------------------------------------------------------
  // 身分綁定：正式站目前沒有帳號系統，選單畫面跟邏輯共用
  // identity-picker.js（我的錢包也是同一份）。存進 whonext_player_name
  // 之後（透過 auth.js，跟 top nav 的頭像共用同一份狀態），靠
  // whonext:playername-change 事件重繪即可。
  // ---------------------------------------------------------------
  function getPlayerName(){ return WhonextAuth.getPlayerName(); }

  // top nav 清空身分（切換/登出）時，把登入流程重置回第一步，
  // 不要停在上一次登入流程跑到一半的畫面。
  document.addEventListener('whonext:playername-change', function(){
    if(!getPlayerName()) document.getElementById('whoamiContainer').innerHTML = '';
    renderPersonalView();
  });

  // ---------------------------------------------------------------
  // 年度總覽：參加場數／勳章數目／挑戰中，展開看所有里程碑勳章。
  // 場次判定：這一年（取 ALL_WEEKS 裡最新的年份）出現在 present_names
  // 或 dropin_names 就算一場，跟月繳/臨打身分無關。
  // ---------------------------------------------------------------
  const MILESTONES = [
    { threshold: 1, label: '初登場' },
    { threshold: 5, label: '常客' },
    { threshold: 10, label: '熟面孔' },
    { threshold: 20, label: '核心成員' },
    { threshold: 30, label: 'WHO朋引伴' },
    { threshold: 50, label: '傳奇球員' }
  ];
  let yoExpanded = false;

  function yearAttendedCount(name){
    const monthsSet = [...new Set(ALL_WEEKS.map(monthOfWeek))].sort();
    if(!monthsSet.length) return 0;
    const year = monthsSet[monthsSet.length - 1].slice(0,4);
    return ALL_WEEKS.filter(function(w){ return monthOfWeek(w).slice(0,4) === year; })
      .filter(function(w){
        return splitNames(w.present_names).indexOf(name) !== -1 ||
          splitNames(w.dropin_names).some(function(entry){ return parseDropinEntry(entry).name === name; });
      }).length;
  }

  function renderYearOverview(name){
    const attended = yearAttendedCount(name);
    const earned = MILESTONES.filter(function(m){ return attended >= m.threshold; });
    const next = MILESTONES.find(function(m){ return attended < m.threshold; });

    document.getElementById('yoAttended').textContent = attended;
    document.getElementById('yoBadgeCount').textContent = earned.length;
    document.getElementById('yoChallenge').textContent = next ? next.label : '全部達成';

    document.getElementById('tcGrid').innerHTML = MILESTONES.map(function(m){
      const got = attended >= m.threshold;
      return '<div class="tc-item' + (got ? '' : ' locked') + '">' +
        '<div class="tc-badge' + (got ? '' : ' locked') + '">' + m.threshold + '</div>' +
        '<div class="tc-label">' + m.label + '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('yoToggleBtn').addEventListener('click', function(){
    yoExpanded = !yoExpanded;
    document.getElementById('tcGrid').style.display = yoExpanded ? '' : 'none';
    this.textContent = yoExpanded ? '收合 ↑' : '展開看所有勳章 ↓';
  });

  // ---------------------------------------------------------------
  // 報名中／歷史活動
  // ---------------------------------------------------------------
  function eventsForPlayer(name){
    return EVENTS.filter(function(ev){
      return Array.isArray(ev.signup_names) && ev.signup_names.indexOf(name) !== -1;
    });
  }

  function eventRowHTML(ev, ended){
    const isoDate = String(ev.date).slice(0, 10);
    const mm = isoDate.slice(5,7);
    const dd = isoDate.slice(8,10);
    return '<div class="prow">' +
      '<div class="prow-date"><div class="mm">' + mm + '月</div><div class="dd">' + dd + '</div></div>' +
      '<div class="prow-body">' +
        '<div class="prow-title">' + ev.title + '</div>' +
        '<div class="prow-meta">' + (ev.type ? ev.type + '・' : '') + ev.time + '・' + ev.location + '</div>' +
      '</div>' +
      '<span class="prow-tag' + (ended ? ' ended' : '') + '">' + (ended ? '已結束' : '報名中') + '</span>' +
    '</div>';
  }

  function renderUpcomingList(name){
    const list = eventsForPlayer(name).filter(function(ev){ return !isEventEnded(ev); })
      .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    const el = document.getElementById('upcomingList');
    el.innerHTML = list.length
      ? list.map(function(ev){ return eventRowHTML(ev, false); }).join('')
      : '<div class="empty-row">目前沒有報名中的活動</div>';
  }

  // 賽事／企劃優先排在前面，同優先度內再依日期新到舊排序。
  function historyPriority(ev){
    return (ev.type === '賽事' || ev.type === '企劃') ? 0 : 1;
  }

  function renderHistoryList(name){
    const list = eventsForPlayer(name).filter(isEventEnded)
      .sort(function(a,b){
        const pa = historyPriority(a), pb = historyPriority(b);
        if(pa !== pb) return pa - pb;
        return String(b.date).localeCompare(String(a.date));
      });
    const el = document.getElementById('historyList');
    if(!list.length){
      el.innerHTML = '<div class="empty-row">尚無歷史活動紀錄</div>';
      return;
    }
    const visible = historyExpanded ? list : list.slice(0, HISTORY_PREVIEW_COUNT);
    const moreBtn = list.length > HISTORY_PREVIEW_COUNT
      ? '<button type="button" class="more-row" id="historyMoreBtn">' + (historyExpanded ? '收合 ↑' : '查看更多 ↓（還有 ' + (list.length - HISTORY_PREVIEW_COUNT) + ' 項）') + '</button>'
      : '';
    el.innerHTML = visible.map(function(ev){ return eventRowHTML(ev, true); }).join('') + moreBtn;
    const btn = document.getElementById('historyMoreBtn');
    if(btn) btn.addEventListener('click', function(){ historyExpanded = !historyExpanded; renderHistoryList(name); });
  }

  // ---------------------------------------------------------------
  // 歷屆賽事排名（球員個人得名紀錄，資料跟 ranking.html 共用 tournaments.js）
  // ---------------------------------------------------------------
  function medalCls(rank){
    return rank === 1 ? '' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : 'other';
  }
  function medalLabel(rank){
    return rank === 1 ? '冠' : rank === 2 ? '亞' : rank === 3 ? '季' : String(rank);
  }

  function renderTrophyList(name){
    const rows = [];
    TOURNAMENT_EVENTS.forEach(function(ev){
      ev.results.forEach(function(r){
        if(r.members.indexOf(name) !== -1) rows.push({ event: ev.label, rank: r.rank });
      });
    });
    const el = document.getElementById('trophyList');
    el.innerHTML = rows.length ? rows.map(function(r){
      return '<div class="trow">' +
        '<div class="trow-badge ' + medalCls(r.rank) + '">' + medalLabel(r.rank) + '</div>' +
        '<div>' +
          '<div class="trow-title">NO.' + r.rank + '</div>' +
          '<div class="trow-sub">' + r.event + '</div>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty-row">尚未有得名紀錄</div>';
  }

  // ---------------------------------------------------------------
  // 賽季排名（呼朋引伴榜，跟 ranking.html 的 BOARDS.friend 算法一致）
  // ---------------------------------------------------------------
  function tally(names){
    const counts = {};
    names.forEach(n=>{ counts[n] = (counts[n] || 0) + 1; });
    return Object.keys(counts)
      .map(name=>({ name, value: counts[name] }))
      .sort((a,b)=> b.value - a.value || a.name.localeCompare(b.name));
  }
  function computeFriendBoard(weeks){
    const referrers = [];
    weeks.forEach(w=>{
      splitNames(w.dropin_names).forEach(entry=>{
        const referrer = parseDropinEntry(entry).referrer;
        if(referrer && !isPlaceholderName(referrer)) referrers.push(referrer);
      });
    });
    return tally(referrers);
  }
  function computeRanks(list){
    const ranks = [];
    let rank = 0;
    let prevValue = null;
    list.forEach(function(p, i){
      if(p.value !== prevValue){ rank = i + 1; prevValue = p.value; }
      ranks.push(rank);
    });
    return ranks;
  }

  function renderSeasonRank(name){
    const el = document.getElementById('seasonRankBody');
    const monthsSet = [...new Set(ALL_WEEKS.map(monthOfWeek))].sort();
    if(!monthsSet.length){
      el.innerHTML = '<div class="empty-row glass" style="border:1px solid var(--line); border-radius:22px;">尚無賽季資料</div>';
      return;
    }
    const year = monthsSet[monthsSet.length - 1].slice(0,4);
    const yearWeeks = ALL_WEEKS.filter(w=> monthOfWeek(w).slice(0,4) === year);
    const list = computeFriendBoard(yearWeeks).filter(p=> p.value >= 3);
    const ranks = computeRanks(list);
    const idx = list.findIndex(p=> p.name === name);

    if(idx < 0){
      el.innerHTML = '<div class="season-card glass">' +
        '<div class="season-body">' +
          '<div class="t">' + year + ' 呼朋引伴</div>' +
          '<div class="s">尚未上榜，累積揪團／帶新人次數即可上榜</div>' +
        '</div>' +
      '</div>';
      return;
    }
    el.innerHTML = '<div class="season-card glass">' +
      '<div class="season-rank">NO.' + ranks[idx] + '</div>' +
      '<div class="season-body">' +
        '<div class="t">' + year + ' 呼朋引伴</div>' +
        '<div class="s">揪團／帶新人次數 ' + list[idx].value + ' 次</div>' +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------
  // 管理員：球員名冊預覽（月繳／臨打各先顯示 3 位，超過收合）
  // ---------------------------------------------------------------
  const ADMIN_ROSTER_PREVIEW_COUNT = 3;
  let adminMonthlyExpanded = false;
  let adminDropinExpanded = false;

  function currentCalendarMonth(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function weeksOfCurrentMonth(){
    const month = currentCalendarMonth();
    return ALL_WEEKS.filter(function(w){ return monthOfWeek(w) === month; });
  }
  function adminMonthlyNames(){
    const month = currentCalendarMonth();
    return ALL_MEMBERS.filter(function(m){ return String(m.month) === month; }).map(function(m){ return m.name; });
  }
  function adminDropinNames(){
    const names = [];
    weeksOfCurrentMonth().forEach(function(w){
      splitNames(w.dropin_names).forEach(function(entry){
        const name = parseDropinEntry(entry).name;
        if(!isPlaceholderName(name) && names.indexOf(name) === -1) names.push(name);
      });
    });
    return names;
  }
  function rosterRowHTML(name){
    return '<div class="trow"><div class="trow-badge other">' + name.slice(0,1) + '</div><div class="trow-title">' + name + '</div></div>';
  }
  function renderRosterPreview(elId, names, expanded, onToggle){
    const el = document.getElementById(elId);
    if(!names.length){ el.innerHTML = '<div class="empty-row">本月尚無資料</div>'; return; }
    const visible = expanded ? names : names.slice(0, ADMIN_ROSTER_PREVIEW_COUNT);
    const moreBtnId = elId + 'MoreBtn';
    const moreBtn = names.length > ADMIN_ROSTER_PREVIEW_COUNT
      ? '<button type="button" class="more-row" id="' + moreBtnId + '">' + (expanded ? '收合 ↑' : '顯示更多 ↓（還有 ' + (names.length - ADMIN_ROSTER_PREVIEW_COUNT) + ' 位）') + '</button>'
      : '';
    el.innerHTML = visible.map(rosterRowHTML).join('') + moreBtn;
    const btn = document.getElementById(moreBtnId);
    if(btn) btn.addEventListener('click', onToggle);
  }
  function renderAdminRoster(){
    renderRosterPreview('adminMonthlyList', adminMonthlyNames(), adminMonthlyExpanded, function(){
      adminMonthlyExpanded = !adminMonthlyExpanded;
      renderAdminRoster();
    });
    renderRosterPreview('adminDropinList', adminDropinNames(), adminDropinExpanded, function(){
      adminDropinExpanded = !adminDropinExpanded;
      renderAdminRoster();
    });
  }

  // ---------------------------------------------------------------
  // 版面切換
  // ---------------------------------------------------------------
  function renderPersonalView(){
    const name = getPlayerName();
    const whoamiContainer = document.getElementById('whoamiContainer');
    const content = document.getElementById('personalContent');

    if(!name){
      // 只在第一次（容器還是空的）才渲染，避免資料重新整理時把使用者
      // 正在操作的 Google 登入流程（選擇身份中）整個重繪回第一步。
      if(!whoamiContainer.childElementCount) WhonextIdentityPicker.render(whoamiContainer);
      whoamiContainer.style.display = '';
      content.style.display = 'none';
      return;
    }

    whoamiContainer.style.display = 'none';
    content.style.display = '';

    historyExpanded = false;
    renderYearOverview(name);
    renderUpcomingList(name);
    renderHistoryList(name);
    renderTrophyList(name);
    renderSeasonRank(name);
  }

  function updateViewMode(){
    const isAdmin = document.body.classList.contains('is-admin');
    document.getElementById('profileTitle').textContent = isAdmin ? '球員名冊' : '我的活動';
    document.getElementById('adminOverviewView').style.display = isAdmin ? '' : 'none';
    document.getElementById('personalView').style.display = isAdmin ? 'none' : '';
    if(isAdmin) renderAdminRoster();
    else renderPersonalView();
  }
  document.addEventListener('DOMContentLoaded', updateViewMode);
  new MutationObserver(updateViewMode).observe(document.body, { attributes:true, attributeFilter:['class'] });

  // ---------------------------------------------------------------
  // 資料載入
  // ---------------------------------------------------------------
  function loadCached(){
    const events = getApiCache({ action:'getEvents' });
    if(events) EVENTS = events.events || [];
    const weeks = getApiCache({ action:'getWeeks' });
    if(weeks) ALL_WEEKS = weeks.weeks || [];
    const members = getApiCache({ action:'getMembers' });
    if(members) ALL_MEMBERS = members.members || [];
  }

  async function refreshAll(){
    try{
      const [eventsRes, weeksRes, membersRes] = await Promise.all([
        apiGet({ action:'getEvents' }),
        apiGet({ action:'getWeeks' }),
        apiGet({ action:'getMembers' })
      ]);
      setApiCache({ action:'getEvents' }, eventsRes);
      setApiCache({ action:'getWeeks' }, weeksRes);
      setApiCache({ action:'getMembers' }, membersRes);
      EVENTS = eventsRes.events || [];
      ALL_WEEKS = weeksRes.weeks || [];
      ALL_MEMBERS = membersRes.members || [];
      if(document.body.classList.contains('is-admin')) renderAdminRoster();
      else renderPersonalView();
    } catch(e){
      // 讀取失敗就沿用快取（可能是空陣列）
    }
  }

  (async function init(){
    loadCached();
    updateViewMode();
    await refreshAll();
  })();
</script>

</body>
</html>
